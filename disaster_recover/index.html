<html lang="zh-CN">
<head>

    <title>Feel Cool TV</title>
    <style>
        :root { --glass-bg: rgba(28, 28, 30, 0.55); --glass-border: rgba(255, 255, 255, 0.08); --animation-speed: 0.3s; }
        html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #000 !important; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; overflow: hidden !important; user-select: none; position: fixed; -webkit-font-smoothing: antialiased; }
        * { scrollbar-width: none !important; -webkit-user-drag: none; }
        ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
        .preload * { transition: none !important; animation: none !important; }
        
        .window-drag-bar { position: fixed; top: 0; left: 0; right: 0; height: 34px; z-index: 9000; cursor: default; }

        .top-right-clock { position: fixed; top: 28px; right: 38px; z-index: 80; background: rgba(28, 28, 30, 0.65); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.12); padding: 6px 16px; border-radius: 999px; font-size: 15px; font-weight: 600; color: rgba(255, 255, 255, 0.9); letter-spacing: 0.5px; opacity: 0; transform: translateY(-8px); transition: opacity 0.4s ease, transform 0.4s ease; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .top-right-clock.visible { opacity: 1; transform: translateY(0); }

        /* 细节 8：纯黑底层支持在用户卡片和系统设置卡片上呈现克制的暗夜微光渐变 */
        .base-layer { position: absolute; inset: 0; background-color: #000; z-index: -3; overflow: hidden; }
        .base-layer::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 76% 26%, rgba(16, 42, 86, 0.34) 0%, rgba(44, 20, 68, 0.16) 42%, rgba(0, 0, 0, 0) 74%), radial-gradient(circle at 24% 82%, rgba(12, 52, 64, 0.22) 0%, transparent 60%); opacity: 0; transition: opacity 0.65s ease; pointer-events: none; }
        .base-layer.stylized-ambient::after { opacity: 1; }

        .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to right, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 60%, transparent 100%), linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.05) 45%, transparent 100%); z-index: -1; transition: opacity 0.4s ease; }

        .sidebar { position: fixed; left: 20px; top: 38px; bottom: 20px; width: 205px; background: var(--glass-bg); backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px); border-radius: 20px; border: 1px solid var(--glass-border); z-index: 10; display: flex; flex-direction: column; padding: 18px 12px; box-sizing: border-box; transition: width var(--animation-speed) cubic-bezier(0.25, 1, 0.5, 1), padding var(--animation-speed) ease, opacity 0.35s ease; overflow: hidden; background-clip: padding-box; -webkit-mask-image: -webkit-radial-gradient(white, black); transform: translateZ(0); }
        .sidebar.collapsed { width: 68px; padding: 18px 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; margin-bottom: 20px; border-radius: 12px; transition: transform 0.2s ease, background-color 0.2s ease; cursor: pointer; outline: none; white-space: nowrap; flex-shrink: 0; }
        .sidebar.collapsed .sidebar-header { justify-content: center; padding: 6px 0; }
        .sidebar-header.focused { background-color: rgba(255, 255, 255, 0.18); transform: scale3d(1.02, 1.02, 1); }
        .sidebar-header.pressing { transform: scale3d(0.92, 0.92, 1) !important; background-color: rgba(10, 132, 255, 0.45) !important; }
        
        .user-left { display: flex; align-items: center; pointer-events: none; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: #444; margin-right: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); flex-shrink: 0; }
        .sidebar.collapsed .user-avatar { margin-right: 0; }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .user-name { font-size: 15px; font-weight: 400; }
        .sidebar-clock { font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.7); pointer-events: none; }
        .sidebar.collapsed .user-name, .sidebar.collapsed .sidebar-clock, .sidebar.collapsed .nav-section-title { opacity: 0; max-width: 0; max-height: 0; margin: 0; display: none; }
        
        .nav-list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; overflow-x: hidden; flex-grow: 1; padding: 4px; margin: -4px; }
        .settings-section { flex-shrink: 0; display: flex; flex-direction: column; }
        .nav-item { display: flex; align-items: center; width: 170px; height: 44px; padding: 0 12px; margin: 0 auto; box-sizing: border-box; border-radius: 12px; flex-shrink: 0; font-size: 15px; font-weight: 500; color: rgba(255,255,255,0.65); white-space: nowrap; cursor: pointer; outline: none; transition: width var(--animation-speed) cubic-bezier(0.25, 1, 0.5, 1), background-color 0.2s ease, color 0.2s ease, transform 0.2s ease; }
        .sidebar.collapsed .nav-item { width: 44px; padding: 0; justify-content: center; }
        .nav-item svg { width: 20px; height: 20px; margin-right: 12px; fill: currentColor; opacity: 0.8; display: block; flex-shrink: 0; }
        .sidebar.collapsed .nav-item svg { margin-right: 0; }
        .item-text { transition: max-width 0.2s ease, opacity 0.2s ease; max-width: 150px; overflow: hidden; opacity: 1; }
        .sidebar.collapsed .item-text { max-width: 0; opacity: 0; }
        .nav-item:focus, .nav-item.focused { background-color: rgba(255, 255, 255, 0.88); color: rgba(0, 0, 0, 0.9) !important; transform: scale3d(1.04, 1.04, 1); box-shadow: 0 6px 16px rgba(0,0,0,0.18); z-index: 2; }
        .sidebar.collapsed .nav-item.focused svg { color: rgba(0,0,0,0.9); }
        .nav-item.active-row { background-color: rgba(255, 255, 255, 0.15); color: rgba(255, 255, 255, 0.95); }
        .nav-divider { height: 1px; background: rgba(255,255,255,0.08); margin: 12px 10px; flex-shrink: 0; }
        .nav-section-title { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.35); text-transform: uppercase; margin: 0 10px 8px 10px; flex-shrink: 0; }

        .main-content { position: absolute; top: 0; bottom: 0; z-index: 2; left: 88px; width: calc(100% - 88px); display: flex; flex-direction: column; justify-content: flex-end; padding: 40px 45px; box-sizing: border-box; transform: translateX(137px); transition: transform var(--animation-speed) cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease; will-change: transform; }
        .main-content.expanded { transform: translateX(0); }
        .hero-text { margin-bottom: 10px; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease; display: flex; flex-direction: column; justify-content: flex-end; }
        .hero-text.lowered { transform: translateY(192px); }

        .brand-title { font-size: 14px; font-weight: 400; letter-spacing: 1px; color: rgba(255,255,255,0.7); margin-bottom: 0; display: flex; align-items: center; }
        .brand-title svg { width: 16px !important; height: 16px !important; fill: #fff; opacity: 0.5; display: block; flex-shrink: 0; margin-right: 6px; transform: translateY(1px); } 
        #heroBrandText { line-height: 1; display: flex; align-items: center; }

        .main-title { font-size: 42px; font-weight: 800; margin: 0 0 4px 0; letter-spacing: -0.5px; line-height: 1.15; max-width: 75%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .main-title.single-line-marquee { display: block; white-space: nowrap; overflow: hidden; max-width: 68%; -webkit-mask-image: linear-gradient(to right, black 0%, black 93%, transparent 100%); mask-image: linear-gradient(to right, black 0%, black 93%, transparent 100%); }
        .marquee-track { display: inline-block; white-space: nowrap; will-change: transform; animation: smoothMarquee var(--marquee-dur, 14s) linear infinite; }
        .marquee-track span { display: inline-block; padding-right: 72px; }
        @keyframes smoothMarquee {
            0%, 15% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        .sub-title { font-size: 15px; color: rgba(255,255,255,0.85); max-width: 650px; line-height: 1.3; margin-bottom: 6px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hero-desc { font-size: 14px; color: rgba(255, 255, 255, 0.85); max-width: 620px; line-height: 1.38; margin-bottom: 10px; font-weight: 400; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .season-bar { display: none; gap: 10px; margin-bottom: 10px; align-items: center; z-index: 6; flex-wrap: wrap; }
        .season-bar.active { display: flex; }
        .season-pill { padding: 6px 16px; border-radius: 999px; background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.75); font-size: 13px; font-weight: 600; cursor: pointer; outline: none; transition: all 0.2s ease; }
        .season-pill.current { background: rgba(255,255,255,0.22); color: #fff; }
        .season-pill.focused, .season-pill:focus { background: #fff !important; color: #000 !important; border-color: #fff; transform: scale(1.06); box-shadow: 0 6px 16px rgba(0,0,0,0.35); }

        .carousel-container { width: calc(100% + 90px); height: 240px; margin: -20px -45px; padding: 20px 45px; position: relative; box-sizing: border-box; -webkit-mask-image: linear-gradient(to right, transparent 0px, black 45px, black calc(100% - 45px), transparent 100%); }
        .carousel-track { display: flex; gap: 20px; padding: 5px 0; z-index: 5; width: max-content; transform: translate3d(0, 0, 0); transition: transform 0.32s cubic-bezier(0.25, 1, 0.5, 1); will-change: transform; }

        .media-item { display: flex; flex-direction: column; gap: 8px; width: 220px; flex-shrink: 0; outline: none; cursor: pointer; }
        /* 细节 3 & 4：使用 clip-path 强制硬件圆角裁切，并用顶层伪元素 ::after 绘制选中圆角高光边框，彻底杜绝直角图片溢出遮挡 */
        .card-image-wrapper { width: 100%; height: 124px; border-radius: 14px; background-color: rgba(255,255,255,0.06); position: relative; overflow: hidden; box-sizing: border-box; clip-path: inset(0 round 14px); -webkit-clip-path: inset(0 round 14px); transition: transform 0.22s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.22s ease; transform: translateZ(0); }
        .card-image-wrapper::after { content: ''; position: absolute; inset: 0; border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); pointer-events: none; z-index: 4; transition: box-shadow 0.22s ease; }
        .card-image-wrapper img { width: 100%; height: 100%; opacity: 0; transition: opacity 0.3s ease; display: block; border-radius: 14px; }
        
        /* 细节 6：半透明毛玻璃 + 刷新 SVG 符号专属卡片样式 */
        .card-image-wrapper.refresh-card-wrapper { display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); }
        .card-image-wrapper.refresh-card-wrapper svg { width: 38px; height: 38px; fill: rgba(255, 255, 255, 0.75); transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1), fill 0.25s ease; }
        .media-item:focus .card-image-wrapper.refresh-card-wrapper svg, .media-item.focused .card-image-wrapper.refresh-card-wrapper svg { transform: rotate(180deg) scale(1.1); fill: #fff; }

        .card-info { opacity: 0.6; transition: opacity 0.22s ease, transform 0.22s ease; transform: translateY(-2px); }
        .card-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-meta { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .media-item:focus .card-image-wrapper, .media-item.focused .card-image-wrapper { transform: scale3d(1.06, 1.06, 1); box-shadow: 0 14px 28px rgba(0,0,0,0.55); z-index: 10; }
        .media-item:focus .card-image-wrapper::after, .media-item.focused .card-image-wrapper::after { box-shadow: inset 0 0 0 2.5px rgba(255, 255, 255, 0.95); }
        .media-item:focus .card-info, .media-item.focused .card-info { opacity: 1; transform: translateY(0); }

        .glass-modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.72); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); z-index: 100; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.25s ease; }
        .glass-modal-mask.active { display: flex; opacity: 1; }
        .glass-modal { width: 540px; background: rgba(32, 32, 36, 0.92); border: 1px solid rgba(255,255,255,0.14); border-radius: 28px; padding: 34px 38px; box-shadow: 0 28px 70px rgba(0,0,0,0.75); color: #fff; box-sizing: border-box; }
        .modal-title { font-size: 24px; font-weight: 700; margin: 0 0 8px 0; }
        .modal-desc { font-size: 14px; color: rgba(255,255,255,0.55); margin-bottom: 24px; line-height: 1.4; }
        .form-group { margin-bottom: 18px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.75); margin-bottom: 8px; }
        .form-input { width: 100%; height: 46px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.4); color: #fff; padding: 0 14px; font-size: 15px; box-sizing: border-box; outline: none; transition: all 0.2s ease; }
        .form-input:focus, .form-input.modal-focused { border-color: #fff !important; background: rgba(0,0,0,0.65); box-shadow: 0 0 0 4px rgba(255,255,255,0.15); transform: scale(1.01); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 14px; margin-top: 28px; }
        .btn { height: 46px; padding: 0 26px; border-radius: 12px; border: 2px solid transparent; font-size: 15px; font-weight: 600; cursor: pointer; outline: none; transition: all 0.2s ease; }
        .btn-cancel { background: rgba(255,255,255,0.12); color: #fff; }
        .btn-primary { background: #0A84FF; color: #fff; }
        .btn-full { width: 100%; height: 46px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.15); color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:focus, .btn.modal-focused { border-color: #fff !important; transform: scale(1.05); box-shadow: 0 8px 24px rgba(0,0,0,0.5); background: #fff !important; color: #000 !important; }
    </style>
</head>

        document.addEventListener('keydown', function(e) {
            if (isFullScreen) {
                e.preventDefault();
                e.stopPropagation();
                if (e.key === 'Escape' || e.key === 'Backspace') {
                    isFullScreen = false;
                    updateClock();
                    macVideo.muted = true;
                    macVideo.style.objectFit = 'cover';
                    document.getElementById('sidebar').style.opacity = '1';
                    document.getElementById('mainContent').style.opacity = '1';
                    document.getElementById('heroOverlay').style.opacity = '1';
                    if (currentFocusEl) setFocus(currentFocusEl);
                } else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                    switchFullScreenVideo(1);
                } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                    switchFullScreenVideo(-1);
                } else if (e.key === ' ' || e.key === 'Enter') {
                    if (macVideo.paused) macVideo.play();
                    else macVideo.pause();
                }
                return;
            }

            if (isModalOpen) {
                if (e.key === 'Escape') {
                    e.preventDefault();
                    closeSettingsModal();
                    closePasswordModal();
                    return;
                }
                if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                    if (e.key === 'ArrowRight' && document.activeElement && document.activeElement.tagName === 'INPUT') return;
                    e.preventDefault();
                    setModalFocus(modalFocusIdx + 1);
                    return;
                }
                if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                    if (e.key === 'ArrowLeft' && document.activeElement && document.activeElement.tagName === 'INPUT') return;
                    e.preventDefault();
                    setModalFocus(modalFocusIdx - 1);
                    return;
                }
                if (e.key === 'Enter') {
                    e.preventDefault();
                    var activeModalEl = modalFocusList[modalFocusIdx];
                    if (activeModalEl && activeModalEl.tagName === 'BUTTON') {
                        activeModalEl.click();
                    } else if (document.getElementById('passwordModal').classList.contains('active')) {
                        verifyAndUnlockPorn();
                    } else if (document.getElementById('settingsModal').classList.contains('active')) {
                        saveSettingsAndScan();
                    }
                    return;
                }
                return;
            }

            if (activeSeriesView && (e.key === 'Escape' || e.key === 'Backspace')) {
                e.preventDefault();
                exitSeriesEpisodes();
                return;
            }

            // 细节 7：在头像栏按住 Enter 键 550ms 即可稳定唤出密码窗
            if (e.key === 'Enter' && currentFocusEl && parseInt(currentFocusEl.getAttribute('data-row')) === -1) {
                e.preventDefault();
                if (!e.repeat && !enterHoldTimer) {
                    avatarHeader.classList.add('pressing');
                    enterHoldTimer = setTimeout(function() {
                        enterHoldTimer = null;
                        triggerAvatarLongPress();
                    }, 550);
                }
                return;
            }

            if (e.key !== 'Enter') {
                var now = Date.now();
                if (now - lastKeyTime < 110) { e.preventDefault(); return; }
                lastKeyTime = now;
            }

            if (!currentFocusEl) return;
            var row = parseInt(currentFocusEl.getAttribute('data-row')), col = parseInt(currentFocusEl.getAttribute('data-col')), nextEl = null;

            switch(e.key) {
                case 'ArrowDown':
                    e.preventDefault();
                    if (row === 0) {
                        var targetRow = activeSeriesView ? 1 : currentTrackRow;
                        nextEl = getRememberedCard(targetRow);
                    } else if (col === 0) {
                        if (row === -1) nextEl = findTargetFocusable(1, 0);
                        else if (row === 3) nextEl = pornUnlocked ? findTargetFocusable(4, 0) : findTargetFocusable(5, 0);
                        else nextEl = findTargetFocusable(row + 1, 0);
                    } else {
                        nextEl = findTargetFocusable(row, 0);
                    }
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    // 细节 5：修复丸形胶囊按钮按 ↑ 键无法返回左侧边栏的问题（去掉了误阻断的 return）
                    if (row === 0) {
                        if (activeSeriesView) { exitSeriesEpisodes(); return; }
                        nextEl = findTargetFocusable(currentTrackRow, 0);
                        break;
                    } else if (col === 0) {
                        if (row === 1) nextEl = findTargetFocusable(-1, 0);
                        else if (row === 5) nextEl = pornUnlocked ? findTargetFocusable(4, 0) : findTargetFocusable(3, 0);
                        else nextEl = findTargetFocusable(row - 1, 0);
                    } else {
                        if (document.getElementById('seasonBar').classList.contains('active')) {
                            var currentPill = document.querySelector('.season-pill.current') || findTargetFocusable(0, 1);
                            if (currentPill) { nextEl = currentPill; break; }
                        }
                        nextEl = findTargetFocusable(row, 0);
                    }
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    if (col === 0) nextEl = (row === -1) ? getRememberedCard(1) : getRememberedCard(row);
                    else nextEl = findTargetFocusable(row, col + 1);
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    if (col > 1) nextEl = findTargetFocusable(row, col - 1);
                    else if (col === 1) {
                        if (row === 0) {
                            if (activeSeriesView) { exitSeriesEpisodes(); return; }
                            nextEl = findTargetFocusable(currentTrackRow, 0);
                            break;
                        }
                        if (activeSeriesView) { exitSeriesEpisodes(); return; }
                        nextEl = findTargetFocusable(row, 0);
                    }
                    break;
                case 'Enter':
                    e.preventDefault();
                    if (row === 0) {
                        var tRow = activeSeriesView ? 1 : currentTrackRow;
                        nextEl = getRememberedCard(tRow);
                        break;
                    }
                    var action = currentFocusEl.getAttribute('data-action');
                    if (action) executeItemAction(action, currentFocusEl.getAttribute('data-title') || '');
                    else if (col === 0 && row > 0) nextEl = getRememberedCard(row);
                    break;
            }
            if (nextEl && nextEl !== currentFocusEl) requestAnimationFrame(function() { setFocus(nextEl); });
        });

        document.addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                if (enterHoldTimer) {
                    clearTimeout(enterHoldTimer);
                    enterHoldTimer = null;
                }
                avatarHeader.classList.remove('pressing');
            }
        });

        function updateClock() {
            var now = new Date(), h = now.getHours(), m = now.getMinutes();
            var timeStr = (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m);
            document.getElementById('sidebarClock').innerText = timeStr;

            var topClock = document.getElementById('topRightClock');
            if (topClock) {
                topClock.innerText = timeStr;
                var sidebarEl = document.getElementById('sidebar');
                var isSidebarCollapsed = sidebarEl && sidebarEl.classList.contains('collapsed');
                var isHalfOrFullHour = (m === 0 || m === 30);
                if ((isSidebarCollapsed || isFullScreen) && isHalfOrFullHour) {
                    topClock.classList.add('visible');
                } else {
                    topClock.classList.remove('visible');
                }
            }
        }
        setInterval(updateClock, 1000); updateClock();

        function initApp() {
            scrapeLocalMediaFolder(appSettings.mediaPath, 1, false);
            loadDouyinNativeFeed(false, false);
            fetch(CONFIG_URL + "?t=" + new Date().getTime())
                .then(res => res.json())
                .then(data => {
                    if (data.user) {
                        globalConfig.user = data.user;
                        if (data.user.name) document.getElementById('uiUserName').innerText = data.user.name;
                        if (data.user.avatar_url) document.getElementById('uiAvatar').src = optimizeImageUrl(data.user.avatar_url);
                    }
                    if (data.api) globalConfig.api = data.api;
                    if (data.rows && data.rows["2"]) {
                        ROW_DATA[2] = data.rows["2"];
                        if (currentTrackRow === 2) {
                            currentTrackRow = -1;
                            renderTrack(2);
                            if (currentFocusEl) setFocus(currentFocusEl);
                        }
                    }
                }).catch(e => {});

            fetch(EPG_URL_MAIN + "?t=" + new Date().getTime()).then(r => r.json()).then(d => { EPG_DATA = d; }).catch(e => {});

            var initial = document.querySelector('.focusable[data-row="1"][data-col="0"]');
            setTimeout(() => setFocus(initial), 100);
            setTimeout(() => document.body.classList.remove('preload'), 250);
        }

        initApp();
    </script>
</body>
</html>
