<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>Feel Cool TV</title>
    <style>
        :root { --glass-bg: rgba(28, 28, 30, 0.55); --glass-border: rgba(255, 255, 255, 0.08); --animation-speed: 0.3s; }
        html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #000 !important; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif; overflow: hidden !important; user-select: none; position: fixed; -webkit-font-smoothing: antialiased; }
        * { scrollbar-width: none !important; -webkit-user-drag: none; }
        ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
        .preload * { transition: none !important; animation: none !important; }
        
        .window-drag-bar { position: fixed; top: 0; left: 0; right: 0; height: 34px; z-index: 9000; cursor: default; }

        .top-right-clock { position: fixed; top: 28px; right: 38px; z-index: 80; background: rgba(28, 28, 30, 0.65); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.12); padding: 6px 16px; border-radius: 999px; font-size: 15px; font-weight: 600; color: rgba(255, 255, 255, 0.9); letter-spacing: 0.5px; opacity: 0; transform: translateY(-8px); transition: opacity 0.4s ease, transform 0.4s ease; pointer-events: none; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .top-right-clock.visible { opacity: 1; transform: translateY(0); }

        /* 修复 1 (Round 4) & 任务 11 (Round 5) & 任务 3 (Round 6) & 任务 2 (Round 7)：日本电视台风格顶部中央两行天气速报/预警，字号再度放大 */
        .jp-weather-telop {
            position: fixed;
            top: 58px;
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            width: min(940px, 74vw);
            min-width: 620px;
            z-index: 95;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
            font-size: 35px;
            font-weight: 800;
            letter-spacing: 1.8px;
            line-height: 1.35;
            color: #ffffff;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            -webkit-font-smoothing: antialiased;
            text-shadow:
                -2.5px -2.5px 0 #000,
                 2.5px -2.5px 0 #000,
                -2.5px  2.5px 0 #000,
                 2.5px  2.5px 0 #000,
                 0px -2.5px 0 #000,
                 0px  2.5px 0 #000,
                -2.5px  0px 0 #000,
                 2.5px  0px 0 #000,
                 0px  5px 12px rgba(0, 0, 0, 0.90);
        }
        .jp-weather-telop.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .jp-telop-row1 {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            width: 100%;
            gap: 32px;
        }
        .jp-telop-row2 {
            display: flex;
            align-items: baseline;
            justify-content: flex-end;
            width: 100%;
            font-size: 29px;
            letter-spacing: 2.2px;
        }

        /* 修复 2 (Round 4) & 任务 8 (Round 6)：IPTV 与抖音全屏播放左下角大屏信息块 */
        .iptv-fullscreen-hud {
            position: fixed;
            left: 58px;
            bottom: 52px;
            z-index: 92;
            background: rgba(18, 19, 24, 0.82);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            border-radius: 22px;
            padding: 22px 34px;
            color: #fff;
            opacity: 0;
            transform: translateY(14px);
            transition: opacity 0.28s ease, transform 0.28s ease;
            pointer-events: none;
            max-width: 720px;
            min-width: 340px;
            box-shadow: 0 22px 54px rgba(0, 0, 0, 0.72);
        }
        .iptv-fullscreen-hud.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .iptv-hud-title {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1.25;
            margin-bottom: 8px;
        }
        .iptv-hud-sub {
            font-size: 20px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.84);
            line-height: 1.35;
        }

        /* PSP UI 风格低饱和度动态流光背景 (严格图层层级：.base-layer z-index:-3 < #mac-bg-video z-index:-2 < .hero-overlay z-index:-1) */
        .base-layer { position: fixed; inset: 0; background-color: #070a10; z-index: -3; overflow: hidden; transition: opacity 0.45s ease; transform: translate3d(0,0,0); -webkit-transform: translate3d(0,0,0); pointer-events: none; }
        #pspWaveCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; opacity: 0.92; transition: opacity 0.65s ease; }

        .hero-overlay { position: fixed; inset: 0; background: linear-gradient(to right, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.18) 60%, transparent 100%), linear-gradient(to top, rgba(0,0,0,0.86) 0%, rgba(0,0,0,0.04) 45%, transparent 100%); z-index: -1; transition: opacity 0.4s ease; transform: translate3d(0,0,0); -webkit-transform: translate3d(0,0,0); pointer-events: none; }

        .sidebar { position: fixed; left: 20px; top: 38px; bottom: 20px; width: 205px; background: var(--glass-bg); backdrop-filter: blur(35px); -webkit-backdrop-filter: blur(35px); border-radius: 20px; border: 1px solid var(--glass-border); z-index: 10; display: flex; flex-direction: column; padding: 18px 12px; box-sizing: border-box; transition: width var(--animation-speed) cubic-bezier(0.25, 1, 0.5, 1), padding var(--animation-speed) ease, opacity 0.35s ease; overflow: hidden; background-clip: padding-box; -webkit-mask-image: -webkit-radial-gradient(white, black); transform: translateZ(0); }
        .sidebar.collapsed { width: 68px; padding: 18px 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; margin-bottom: 20px; border-radius: 12px; transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease; cursor: pointer; outline: none; white-space: nowrap; flex-shrink: 0; }
        .sidebar.collapsed .sidebar-header { justify-content: center; padding: 6px 0; }
        .sidebar-header.focused { background-color: rgba(255, 255, 255, 0.18); transform: scale3d(1.02, 1.02, 1); }
        /* 修复 5：长按用户按钮去掉蓝色，改为契合整体毛玻璃 UI 的温润微光态 */
        .sidebar-header.pressing { transform: scale3d(0.92, 0.92, 1) !important; background-color: rgba(255, 255, 255, 0.28) !important; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.32), 0 6px 18px rgba(0, 0, 0, 0.35) !important; }
        
        .user-left { display: flex; align-items: center; pointer-events: none; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: #444; margin-right: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); flex-shrink: 0; }
        .sidebar.collapsed .user-avatar { margin-right: 0; }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .user-name { font-size: 15px; font-weight: 400; }
        .sidebar-clock { font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.7); pointer-events: none; }
        .sidebar.collapsed .user-name, .sidebar.collapsed .sidebar-clock, .sidebar.collapsed .nav-section-title { opacity: 0; max-width: 0; max-height: 0; margin: 0; display: none; }
        
        .nav-list { display: flex; flex-direction: column; gap: 4px; overflow: hidden; flex-grow: 1; padding: 4px; margin: -4px; }
        .settings-section { flex-shrink: 0; display: flex; flex-direction: column; gap: 4px; }
        .nav-item { display: flex; align-items: center; width: 170px; height: 44px; padding: 0 12px; margin: 0 auto; box-sizing: border-box; border-radius: 12px; flex-shrink: 0; font-size: 15px; font-weight: 500; color: rgba(255,255,255,0.65); white-space: nowrap; cursor: pointer; outline: none; transition: width var(--animation-speed) cubic-bezier(0.25, 1, 0.5, 1), background-color 0.2s ease, color 0.2s ease, transform 0.2s ease; }
        .sidebar.collapsed .nav-item { width: 44px; padding: 0; justify-content: center; }
        .nav-item svg { width: 20px; height: 20px; margin-right: 12px; fill: currentColor; opacity: 0.8; display: block; flex-shrink: 0; }
        .sidebar.collapsed .nav-item svg { margin-right: 0; }
        .item-text { transition: max-width 0.2s ease, opacity 0.2s ease; max-width: 150px; overflow: hidden; opacity: 1; }
        .sidebar.collapsed .item-text { max-width: 0; opacity: 0; }
        .nav-item:focus, .nav-item.focused { background-color: rgba(255, 255, 255, 0.88); color: rgba(0, 0, 0, 0.9) !important; transform: scale3d(1.04, 1.04, 1); box-shadow: 0 6px 16px rgba(0,0,0,0.18); z-index: 2; }
        .sidebar.collapsed .nav-item.focused svg { color: rgba(0,0,0,0.9); }
        .nav-item.active-row { background-color: rgba(255, 255, 255, 0.15); color: rgba(255, 255, 255, 0.95); }
        .nav-divider { height: 1px; background: rgba(255,255,255,0.08); margin: 12px 10px 8px 10px; flex-shrink: 0; }
        .nav-section-title { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.35); text-transform: uppercase; margin: 0 10px 4px 10px; flex-shrink: 0; }

        .main-content { position: absolute; top: 0; bottom: 0; z-index: 2; left: 88px; width: calc(100% - 88px); display: flex; flex-direction: column; justify-content: flex-end; padding: 40px 45px; box-sizing: border-box; transform: translateX(137px); transition: transform var(--animation-speed) cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s ease; will-change: transform; overflow: hidden; }
        .main-content.expanded { transform: translateX(0); }
        .hero-text { margin-bottom: 10px; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease; display: flex; flex-direction: column; justify-content: flex-end; }
        .hero-text.lowered { transform: translateY(192px); }

        /* 修复 1：小标题旁小 SVG 与文字精准垂直居中对齐 */
        .brand-title { font-size: 14px; font-weight: 400; letter-spacing: 1px; color: rgba(255,255,255,0.7); margin-bottom: 0; display: inline-flex; align-items: center; height: 20px; line-height: 20px; }
        .brand-title svg { width: 16px !important; height: 16px !important; fill: #fff; opacity: 0.5; display: block; flex-shrink: 0; margin-right: 6px; transform: translateY(0px); } 
        #heroBrandText { line-height: 20px; display: inline-flex; align-items: center; }

        .main-title { font-size: 42px; font-weight: 800; margin: 0 0 4px 0; letter-spacing: -0.5px; line-height: 1.15; max-width: 75%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .main-title.single-line-marquee { display: block; white-space: nowrap; overflow: hidden; max-width: 68%; -webkit-mask-image: linear-gradient(to right, black 0%, black 93%, transparent 100%); mask-image: linear-gradient(to right, black 0%, black 93%, transparent 100%); }
        .marquee-track { display: inline-block; white-space: nowrap; will-change: transform; animation: smoothMarquee var(--marquee-dur, 14s) linear infinite; }
        .marquee-track span { display: inline-block; padding-right: 72px; }
        @keyframes smoothMarquee {
            0%, 15% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        /* 修复 8：TMDB 剧集 Logo 正方形/横向自适应放置容器 */
        .tmdb-logo-stage {
            display: inline-flex;
            align-items: flex-end;
            justify-content: flex-start;
            min-height: 84px;
            margin-bottom: 8px;
        }
        .tmdb-logo-stage.square-stage {
            width: 148px;
            height: 148px;
        }

        /* 修复 1：认证徽标与副标题文字精准垂直居中对齐 */
        .sub-title { font-size: 15px; color: rgba(255,255,255,0.85); max-width: 650px; line-height: 20px; min-height: 20px; margin-bottom: 6px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; }
        #heroSubBadge { display: inline-flex; align-items: center; flex-shrink: 0; }
        #heroSubBadge svg { width: 15px; height: 15px; margin-right: 5px; fill: #00A1FF; opacity: 1; display: block; flex-shrink: 0; transform: translateY(0px); }
        #heroSubText { line-height: 20px; display: inline-block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* 修复 6：剧集文字介绍强制顶格显示 */
        .hero-desc { font-size: 14px; color: rgba(255, 255, 255, 0.85); max-width: 620px; line-height: 1.38; margin-bottom: 10px; font-weight: 400; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-indent: 0 !important; }

        /* 任务 4 (Round 6)：丸形菜单展开与折叠丝滑过渡动画 */
        .season-bar { display: none; gap: 10px; margin-bottom: 10px; align-items: center; z-index: 6; flex-wrap: wrap; transition: opacity 0.26s cubic-bezier(0.22, 1, 0.36, 1), transform 0.26s cubic-bezier(0.22, 1, 0.36, 1); }
        .season-bar.active { display: flex; }
        /* 任务 2 (Round 5)：丸形菜单内嵌精致右向/左向 SVG 箭头对齐样式 */
        .season-pill { display: inline-flex; align-items: center; gap: 4px; padding: 6px 16px; border-radius: 999px; background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.08); color: rgba(255,255,255,0.75); font-size: 13px; font-weight: 600; cursor: pointer; outline: none; transition: background-color 0.22s ease, color 0.22s ease, border-color 0.22s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.24s ease; }
        .season-pill.pill-anim-expand { animation: pillExpandSpring 0.32s cubic-bezier(0.16, 1, 0.3, 1) both; }
        .season-pill.pill-anim-collapse { animation: pillCollapseSpring 0.28s cubic-bezier(0.16, 1, 0.3, 1) both; }
        @keyframes pillExpandSpring {
            0% { opacity: 0; transform: translate3d(-12px, 0, 0) scale(0.92); }
            100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        }
        @keyframes pillCollapseSpring {
            0% { opacity: 0.35; transform: translate3d(10px, 0, 0) scale(0.95); }
            100% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        }
        .season-pill.current { background: rgba(255,255,255,0.22); color: #fff; }
        .season-pill.focused, .season-pill:focus { background: #fff !important; color: #000 !important; border-color: #fff; transform: scale(1.06); box-shadow: 0 6px 16px rgba(0,0,0,0.35); }
        .pill-chevron-svg { width: 15px; height: 15px; fill: currentColor; opacity: 0.88; flex-shrink: 0; display: block; margin-right: -2px; transition: transform 0.25s ease; }
        .pill-chevron-left-svg { width: 15px; height: 15px; fill: currentColor; opacity: 0.88; flex-shrink: 0; display: block; margin-left: -2px; }

        .carousel-container { width: calc(100% + 90px); height: 240px; margin: -20px -45px; padding: 20px 45px; position: relative; box-sizing: border-box; overflow: hidden; -webkit-mask-image: linear-gradient(to right, transparent 0px, black 45px, black calc(100% - 45px), transparent 100%); }
        .carousel-track { display: flex; gap: 20px; padding: 5px 0; z-index: 5; width: max-content; transform: translate3d(0, 0, 0); transition: transform 0.32s cubic-bezier(0.25, 1, 0.5, 1); will-change: transform; }

        .media-item { display: flex; flex-direction: column; gap: 8px; width: 220px; flex-shrink: 0; outline: none; cursor: pointer; contain: layout style; }
        .card-image-wrapper { width: 100%; height: 124px; border-radius: 14px; background-color: rgba(255,255,255,0.06); position: relative; overflow: hidden; box-sizing: border-box; clip-path: inset(0 round 14px); -webkit-clip-path: inset(0 round 14px); transition: transform 0.22s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.22s ease; transform: translateZ(0); }
        .card-image-wrapper::after { content: ''; position: absolute; inset: 0; border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); pointer-events: none; z-index: 4; transition: box-shadow 0.22s ease; }
        .card-image-wrapper img { width: 100%; height: 100%; opacity: 0; transition: opacity 0.3s ease; display: block; border-radius: 14px; }
        
        .card-image-wrapper.refresh-card-wrapper { display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); }
        .card-image-wrapper.refresh-card-wrapper svg { width: 38px; height: 38px; fill: rgba(255, 255, 255, 0.75); transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1), fill 0.25s ease; }
        .media-item:focus .card-image-wrapper.refresh-card-wrapper svg, .media-item.focused .card-image-wrapper.refresh-card-wrapper svg { transform: rotate(180deg) scale(1.1); fill: #fff; }

        .card-info { opacity: 0.6; transition: opacity 0.22s ease, transform 0.22s ease; transform: translateY(-2px); }
        .card-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-meta { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .media-item:focus .card-image-wrapper, .media-item.focused .card-image-wrapper { transform: scale3d(1.06, 1.06, 1); box-shadow: 0 14px 28px rgba(0,0,0,0.55); z-index: 10; }
        .media-item:focus .card-image-wrapper::after, .media-item.focused .card-image-wrapper::after { box-shadow: inset 0 0 0 2.5px rgba(255, 255, 255, 0.95); }
        .media-item:focus .card-info, .media-item.focused .card-info { opacity: 1; transform: translateY(0); }

        .glass-modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.72); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); z-index: 100; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.25s ease; }
        .glass-modal-mask.active { display: flex; opacity: 1; }
        .glass-modal { width: 560px; max-height: 90vh; overflow-y: auto; background: rgba(32, 32, 36, 0.92); border: 1px solid rgba(255,255,255,0.14); border-radius: 28px; padding: 30px 36px; box-shadow: 0 28px 70px rgba(0,0,0,0.75); color: #fff; box-sizing: border-box; }
        .modal-title { font-size: 24px; font-weight: 700; margin: 0 0 6px 0; }
        .modal-desc { font-size: 13px; color: rgba(255,255,255,0.55); margin-bottom: 16px; line-height: 1.4; }
        /* 修复 3 (Round 4)：设置页更新时间与状态栏改造为可选中刷新按钮，保留原文字排版并在最右侧加入刷新符号 */
        .sync-status-bar { width: 100%; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; font-size: 12px; color: rgba(255,255,255,0.75); cursor: pointer; outline: none; transition: all 0.2s ease; box-sizing: border-box; font-family: inherit; }
        .sync-status-inner { display: flex; align-items: center; justify-content: space-between; flex: 1; margin-right: 10px; }
        .sync-status-time { color: #00d474; font-weight: 600; }
        .sync-status-time.offline { color: #ffcc00; }
        .sync-refresh-icon { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; opacity: 0.85; transition: transform 0.45s ease; }
        .sync-status-bar.refreshing .sync-refresh-icon { animation: spinRefreshIcon 0.8s linear infinite; }
        @keyframes spinRefreshIcon { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .sync-status-bar:focus, .sync-status-bar.modal-focused { border-color: #fff !important; background: #fff !important; color: #000 !important; transform: scale(1.02); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .sync-status-bar:focus .sync-status-time, .sync-status-bar.modal-focused .sync-status-time { color: #008a4b !important; }
        .sync-status-bar:focus .sync-status-time.offline, .sync-status-bar.modal-focused .sync-status-time.offline { color: #b27b00 !important; }
        .form-group { margin-bottom: 14px; }
        .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
        .form-label { display: block; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.75); margin-bottom: 6px; }
        .form-input { width: 100%; height: 42px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.4); color: #fff; padding: 0 14px; font-size: 14px; box-sizing: border-box; outline: none; transition: all 0.2s ease; }
        .form-input:focus, .form-input.modal-focused { border-color: #fff !important; background: rgba(0,0,0,0.65); box-shadow: 0 0 0 4px rgba(255,255,255,0.15); transform: scale(1.01); }
        /* 任务 6 (Round 6)：密码输入框内专属从左向右铺满半透明红/绿动画容器 */
        .pwd-input-wrap {
            position: relative;
            width: 100%;
            height: 60px;
            border-radius: 16px;
            overflow: hidden;
            box-sizing: border-box;
        }
        .pwd-input-wrap .form-input {
            position: relative;
            z-index: 2;
            background: rgba(0, 0, 0, 0.42);
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .pwd-input-wrap .form-input:focus,
        .pwd-input-wrap .form-input.modal-focused {
            background: rgba(0, 0, 0, 0.48);
            transform: none;
        }
        .pwd-fill-bar {
            position: absolute;
            inset: 0;
            border-radius: 16px;
            z-index: 3;
            pointer-events: none;
            transform: scaleX(0);
            transform-origin: left center;
            opacity: 0;
        }
        .pwd-fill-bar.fill-error {

                .replace(/^(?:\[.*?\]|【.*?】|\(.*?\))+/g, ' ')
                .replace(/(?:[._\-\s]+|^)(?:S\d{1,2}\s*E\d{1,3}|S\d{1,2}|EP?\s*\d{1,3}|第\s*[0-9一二三四五六七八九十百]+\s*[季集话期]).*$/i, '')

                .replace(/\[.*?\]|\(.*?\)|【.*?】/g, ' ')
                .replace(/\b(19\d{2}|20\d{2})\b/g, ' ')
                .replace(/[._\-]+/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
            return s;

        function isSeasonFolderName(name) {
            return /^(?:Season\s*\d+|S\d{1,2}|第\s*[0-9一二三四五六七八九十]+\s*季|Specials|SP)$/i.test(name.trim());

        function deriveSeriesKey(mediaBasePath, fullPath, rawName) {
            var cleanBase = mediaBasePath.replace(/\/+$/, '');
            var rel = fullPath.indexOf(cleanBase) === 0 ? fullPath.substring(cleanBase.length).replace(/^\/+/, '') : '';
            var parts = rel ? rel.split('/') : [];

            if (parts.length >= 2) {
                var topFolder = parts[0];
                if (!isSeasonFolderName(topFolder)) {
                    var folderClean = cleanTextToSeriesTitle(topFolder);
                    if (folderClean) return folderClean;
                }
            }
            if (parts.length >= 2 && isSeasonFolderName(parts[0])) {
                var baseParts = cleanBase.split('/');
                var baseFolder = baseParts[baseParts.length - 1];
                var baseClean = cleanTextToSeriesTitle(baseFolder);
                if (baseClean) return baseClean;
            }

            var nameClean = cleanTextToSeriesTitle(rawName);
            if (!nameClean || /^\d+$/.test(nameClean)) {
                var bParts = cleanBase.split('/');
                return cleanTextToSeriesTitle(bParts[bParts.length - 1]) || rawName;
            }
            return nameClean;
        }

        function parseSeasonAndEp(fullPath, rawName, idx) {
            var season = 1, ep = idx + 1;

            if (sMatch) season = parseInt(sMatch[1]) || 1;
            var eMatch = rawName.match(/E(\d{1,3})/i) || rawName.match(/EP(\d{1,3})/i) || rawName.match(/第\s*(\d+)\s*[集话期]/) || rawName.match(/(?:^|[._\-\s])(\d{1,3})(?:[._\-\s]|$)/);
            if (eMatch) ep = parseInt(eMatch[1]) || (idx + 1);
            return { season: season, ep: ep, label: '第 ' + ep + ' 集' };

                    break;
            }
            if (nextEl && nextEl !== currentFocusEl) requestAnimationFrame(function() { setFocus(nextEl); });
        });

        document.addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                if (enterHoldTimer) {
                    clearTimeout(enterHoldTimer);
                    enterHoldTimer = null;
                }
                avatarHeader.classList.remove('pressing');
            }
        });

        function updateClock() {
            var now = new Date(), h = now.getHours(), m = now.getMinutes();
            var timeStr = (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m);
            document.getElementById('sidebarClock').innerText = timeStr;

            var topClock = document.getElementById('topRightClock');
            if (topClock) {
                topClock.innerText = timeStr;
                var sidebarEl = document.getElementById('sidebar');
                var isSidebarCollapsed = sidebarEl && sidebarEl.classList.contains('collapsed');
                var isHalfOrFullHour = (m === 0 || m === 30);
                if ((isSidebarCollapsed || isFullScreen) && isHalfOrFullHour) {
                    topClock.classList.add('visible');
                } else {
                    topClock.classList.remove('visible');
                }
            }
        }
        setInterval(updateClock, 1000); updateClock();

        // ================= EPG 电子节目单后台解析与实时刷新 =================
        function applyEpgToChannelRow() {
            if (!ROW_DATA[2] || ROW_DATA[2].length === 0) return;
            var trackCards = document.querySelectorAll('.media-item[data-row="2"]');
            for (var i = 0; i < trackCards.length; i++) {
                var cardEl = trackCards[i];
                var title = cardEl.getAttribute('data-title') || '';
                var epgName = cardEl.getAttribute('data-epg-name') || BUILTIN_EPG_NAME_MAP[title] || '';
                var prog = lookupEpgProgram(title, epgName);
                if (prog) {
                    cardEl.setAttribute('data-sub', prog);
                    var metaEl = cardEl.querySelector('.card-meta');
                    if (metaEl) metaEl.innerText = prog;
                }
            }
        }

        function refreshEpgFromBackend() {
            var targetEpgUrl = (appSettings.epgUrl || DEFAULT_EPG_URL).trim();
            invoke('fetch_epg_data', { epgUrl: targetEpgUrl }).then(epgMap => {
                if (epgMap && Object.keys(epgMap).length > 0) {
                    EPG_DATA = epgMap;
                    localStorage.setItem('fc_epg_cache', JSON.stringify(EPG_DATA));
                    applyEpgToChannelRow();
                }
            }).catch(() => {
                try {
                    var cachedEpg = JSON.parse(localStorage.getItem('fc_epg_cache') || '{}');
                    if (Object.keys(cachedEpg).length > 0) {
                        EPG_DATA = cachedEpg;
                        applyEpgToChannelRow();
                    }
                } catch (_) {}
            });
        }

        // ================= 修复 1 & 4 (Round 4) & 任务 11 (Round 5)：日本电视台风格两行顶部居中天气速报与实时预警推送 =================
        var weatherHideTimer = null;
        var weatherFollowupTimer = null;
        var lastWeatherAlertKey = '';

        function displayWeatherTelop(mainText, areasText, agencyText, durationMs) {
            var el = document.getElementById('jpWeatherTelop');
            var mainEl = document.getElementById('telopMainText');
            var areasEl = document.getElementById('telopAreasText');
            var agencyEl = document.getElementById('telopAgencyText');
            if (!el || !mainEl || !areasEl || !agencyEl || !mainText) return;
            mainEl.innerText = mainText;
            areasEl.innerText = areasText || '';
            agencyEl.innerText = agencyText || '';
            el.classList.add('visible');
            if (weatherHideTimer) clearTimeout(weatherHideTimer);
            weatherHideTimer = setTimeout(function() {
                el.classList.remove('visible');
            }, durationMs || 15000);
        }

        function getMacNativeGeolocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) return resolve(null);
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
                    () => resolve(null),
                    { enableHighAccuracy: false, timeout: 3000, maximumAge: 600000 }
                );
            });
        }

        // isRoutineSchedule = true：每30分钟一次定时展示常规气象速报（每次展示 15 秒，间隔 1 分钟播报下一条）；
        // isRoutineSchedule = false：后台高频轮询特殊天气与灾害预警，检测到即实时推送（刚进入 App 时不触发常规气象速报）
        async function pollWeatherBroadcast(isRoutineSchedule) {
            try {
                var coords = await getMacNativeGeolocation();
                var res = await invoke('fetch_weather_broadcast', {
                    clientLat: coords ? coords.lat : null,
                    clientLon: coords ? coords.lon : null
                });
                if (!res) return;
                var routineText = res.routine_headline || '';
                var warnText = res.warning_headline || '';
                var warnKey = res.warning_key || '';
                var areasText = res.areas || '';
                var agencyText = res.agency || '';

                if (isRoutineSchedule) {
                    if (routineText) {
                        displayWeatherTelop(routineText, areasText, agencyText, 15000);
                    }
                    if (warnText && warnKey && warnKey !== lastWeatherAlertKey) {
                        lastWeatherAlertKey = warnKey;
                        if (weatherFollowupTimer) clearTimeout(weatherFollowupTimer);
                        weatherFollowupTimer = setTimeout(function() {
                            displayWeatherTelop(warnText, areasText, agencyText, 15000);
                        }, 75000);
                    }
                } else if (warnText && warnKey && warnKey !== lastWeatherAlertKey) {
                    lastWeatherAlertKey = warnKey;
                    displayWeatherTelop(warnText, areasText, agencyText, 15000);
                }
            } catch (e) {}
        }

        // ================= GitHub 配置数据自动缓存与更新时间展示 =================
        function formatDateTimeNow() {
            var d = new Date();
            var pad = n => (n < 10 ? '0' + n : '' + n);
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
        }

        function applyGithubConfigData(data, isOnline, syncTimeStr) {
            if (!data) return;
            if (data.user) {
                globalConfig.user = data.user;
                if (data.user.name) document.getElementById('uiUserName').innerText = data.user.name;
                if (data.user.avatar_url) document.getElementById('uiAvatar').src = optimizeImageUrl(data.user.avatar_url);
            }
            if (data.api) {
                globalConfig.api = data.api;
                if (data.api.epg_url && !localStorage.getItem('fc_epg_url')) {
                    appSettings.epgUrl = data.api.epg_url;
                }
            }
            // 任务 6 (Round 5)：支持从 GitHub config.json 读取 porn_brands 或 rows["4_brands"] 厂牌配置（含 logo_url、desc、img、folder）
            var remoteBrands = data.porn_brands || data.brands || (data.rows && data.rows["4_brands"]);
            if (Array.isArray(remoteBrands) && remoteBrands.length > 0) {
                PORN_BRANDS_CONFIG = remoteBrands;
                if (currentTrackRow === 4 && activePornPrimaryTab === 'brands') {
                    syncPornRowData();
                    currentTrackRow = -1;
                    renderTrack(4);
                    if (currentFocusEl) setFocus(currentFocusEl);
                }
            }
            if (data.rows && data.rows["2"]) {
                data.rows["2"].forEach(ch => {
                    if (!ch.epg_name && BUILTIN_EPG_NAME_MAP[ch.title]) {
                        ch.epg_name = BUILTIN_EPG_NAME_MAP[ch.title];
                    }
                });
                ROW_DATA[2] = data.rows["2"];
                if (currentTrackRow === 2) {
                    currentTrackRow = -1;
                    renderTrack(2);
                    if (currentFocusEl) setFocus(currentFocusEl);
                }
            }
            var syncEl = document.getElementById('githubSyncStatusText');
            if (syncEl) {
                if (isOnline) {
                    syncEl.className = 'sync-status-time';
                    syncEl.innerText = (syncTimeStr || '刚刚') + '（网络正常）';
                } else {
                    syncEl.className = 'sync-status-time offline';
                    syncEl.innerText = (syncTimeStr || '未知时间') + '（离线缓存 · 网络异常）';
                }
            }
        }

        function fetchGithubConfigOnline() {
            var cachedConfigStr = localStorage.getItem('fc_github_config_cache');
            var cachedSyncTime = localStorage.getItem('fc_github_sync_time') || '未记录';
            return fetch(CONFIG_URL + "?t=" + new Date().getTime())
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(data => {
                    var nowTimeStr = formatDateTimeNow();
                    localStorage.setItem('fc_github_config_cache', JSON.stringify(data));
                    localStorage.setItem('fc_github_sync_time', nowTimeStr);
                    applyGithubConfigData(data, true, nowTimeStr);
                })
                .catch(e => {
                    var syncEl = document.getElementById('githubSyncStatusText');
                    if (syncEl) {
                        syncEl.className = 'sync-status-time offline';
                        syncEl.innerText = cachedConfigStr ? (cachedSyncTime + '（离线缓存 · 网络异常）') : '无缓存（网络异常）';
                    }
                });
        }

        function initApp() {
            scrapeLocalMediaFolder(appSettings.mediaPath, 1, false);
            loadDouyinNativeFeed(false, false);

            // 1. 先读取本地缓存的 GitHub 配置以确保离线秒开
            var cachedConfigStr = localStorage.getItem('fc_github_config_cache');
            var cachedSyncTime = localStorage.getItem('fc_github_sync_time') || '未记录';
            if (cachedConfigStr) {
                try {
                    applyGithubConfigData(JSON.parse(cachedConfigStr), false, cachedSyncTime);
                } catch (_) {}
            }

            // 2. 网络通畅时拉取最新 GitHub 配置并更新缓存与时间戳
            fetchGithubConfigOnline();

            // 3. 加载 EPG 节目单并定时更新
            refreshEpgFromBackend();
            setInterval(refreshEpgFromBackend, 5 * 60 * 1000);

            // 4. 任务 11 (Round 5)：取消刚进入 App 时的常规气象速报，仅保留每 30 分钟定时气象速报与实时特殊天气预警推送
            setTimeout(() => pollWeatherBroadcast(false), 3500);
            setInterval(() => pollWeatherBroadcast(true), 30 * 60 * 1000);
            setInterval(() => pollWeatherBroadcast(false), 2 * 60 * 1000);

            var initial = document.querySelector('.focusable[data-row="1"][data-col="0"]');
            setTimeout(() => setFocus(initial), 100);
            setTimeout(() => document.body.classList.remove('preload'), 250);
        }

        initApp();
    </script>
</body>
