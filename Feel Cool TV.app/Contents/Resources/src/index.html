<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>Feel Cool TV</title>
    <style>
        @font-face {
            font-family: 'DouyinMeihaoti';
            src: url('./assets/DouyinMeihaoti.otf') format('opentype'),
                 url('assets/DouyinMeihaoti.otf') format('opentype'),
                 local('抖音美好体'),
                 local('Douyin Sans Bold'),
                 local('Douyin Sans');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }
        @font-face {
            font-family: 'DouyinMeihaoti';
            src: url('./assets/DouyinMeihaoti.otf') format('opentype'),
                 url('assets/DouyinMeihaoti.otf') format('opentype'),
                 local('抖音美好体'),
                 local('Douyin Sans Bold'),
                 local('Douyin Sans');
            font-weight: bold;
            font-style: normal;
            font-display: block;
        }
        .douyin-font {
            font-family: 'DouyinMeihaoti', '抖音美好体', 'Douyin Sans Bold', 'Douyin Sans', -apple-system, BlinkMacSystemFont, sans-serif !important;
            font-weight: 700;
            letter-spacing: 0.2px;
        }
        .inline-bili-logo {
            display: inline-block;
            height: 1.04em;
            width: auto;
            vertical-align: -0.14em;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
        }
        /* 任务 3 (Round 21) & 问题 2 & 4 (Round 22) & 任务 10 (Round 23)：很酷 TV+ Logo 与 bilibili Logo 内联显示，确保很酷 TV+ 与后方“剧集/电影”二字视觉大小一致且不过大 */
        .inline-cooltv-logo {
            display: inline-block;
            height: 0.97em;
            width: auto;
            vertical-align: -0.11em;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
        }
        .main-title .inline-bili-logo,
        .main-title .inline-cooltv-logo,
        .iptv-hud-title .inline-bili-logo,
        .iptv-hud-title .inline-cooltv-logo {
            opacity: 1;
        }
        .brand-title .inline-bili-logo,
        .brand-title .inline-cooltv-logo {
            opacity: 0.7;
        }
        .sub-title .inline-bili-logo,
        .sub-title .inline-cooltv-logo,
        .iptv-hud-sub .inline-bili-logo,
        .iptv-hud-sub .inline-cooltv-logo {
            opacity: 0.78;
        }
        .card-meta .inline-bili-logo,
        .card-meta .inline-cooltv-logo {
            opacity: 0.55;
        }
        .season-pill .inline-bili-logo,
        .season-pill .inline-cooltv-logo {
            opacity: 0.75;
            transition: opacity 0.22s ease, filter 0.22s ease;
        }
        .season-pill .inline-bili-logo {
            height: 1.08em;
            vertical-align: -0.15em;
            margin-right: 0;
        }
        .season-pill .inline-cooltv-logo {
            height: 0.97em;
            vertical-align: -0.11em;
            margin-right: 0;
        }
        .season-pill.current:not(.focused):not(:focus) .inline-bili-logo,
        .season-pill.current:not(.focused):not(:focus) .inline-cooltv-logo {
            opacity: 0.85;
        }
        .season-pill.focused .inline-bili-logo,
        .season-pill:focus .inline-bili-logo,
        .season-pill.focused .inline-cooltv-logo,
        .season-pill:focus .inline-cooltv-logo,
        .btn:focus .inline-bili-logo,
        .btn.modal-focused .inline-bili-logo,
        .btn:focus .inline-cooltv-logo,
        .btn.modal-focused .inline-cooltv-logo {
            opacity: 1 !important;
            filter: invert(1) brightness(0.08);
        }
        :root { --glass-bg: rgba(28, 28, 30, 0.55); --glass-border: rgba(255, 255, 255, 0.08); --animation-speed: 0.3s; --overlay-bg-inner: rgba(16, 20, 28, 0.76); --overlay-bg-outer: rgba(6, 8, 12, 0.88); }
        /* 任务 5 (Round 20)：窗口模式下允许鼠标指针可见；全屏模式（html.app-cursor-hidden）继续严格执行鼠标指针不可见 */
        html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #000 !important; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif; overflow: hidden !important; user-select: none; position: fixed; -webkit-font-smoothing: antialiased; }
        *, *::before, *::after { scrollbar-width: none !important; -webkit-user-drag: none; }
        ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
        .preload * { transition: none !important; animation: none !important; }
        
        .window-drag-bar { position: fixed; top: 0; left: 0; right: 0; height: 34px; z-index: 9000; }
        html.app-cursor-hidden, html.app-cursor-hidden *, html.app-cursor-hidden *::before, html.app-cursor-hidden *::after { cursor: none !important; }

        /* 任务 4 (Round 9) & 任务 5 (Round 10) & 任务 9 (Round 21)：整点和半点前一分钟开始显示右上角无底框时钟，调高文字阴影模糊半径使阴影柔化不突兀聚集 */
        .top-right-clock { position: fixed; top: 28px; right: 40px; z-index: 80; background: transparent; border: none; padding: 0; font-size: 25px; font-weight: 700; color: rgba(255, 255, 255, 0.95); letter-spacing: 1.2px; opacity: 0; transform: translateY(-8px); transition: opacity 0.4s ease, transform 0.4s ease; pointer-events: none; text-shadow: 0 4px 28px rgba(0, 0, 0, 0.62), 0 2px 16px rgba(0, 0, 0, 0.44); }
        .top-right-clock.visible { opacity: 1; transform: translateY(0); }

        /* 任务 12 (Round 18) & 任务 6 (Round 30)：气象信息轻微调大字号（33px / 27px），并根据顶部侧边栏显隐状态动态下移避让顶部胶囊侧边栏 */
        .jp-weather-telop {
            position: fixed;
            top: var(--telop-top, 48px);
            left: 50%;
            transform-origin: top center;
            transform: translateX(-50%) translateY(-8px) scale(var(--telop-scale, 1));
            width: min(900px, 75vw);
            min-width: 560px;
            z-index: 95;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
            font-size: 33px;
            font-weight: 700;
            letter-spacing: 1.6px;
            line-height: 1.35;
            color: #ffffff;
            white-space: nowrap;
            opacity: 0;
            transition: top 0.36s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            -webkit-font-smoothing: antialiased;
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px -2px 0 #000,
                 0px  2px 0 #000,
                -2px  0px 0 #000,
                 2px  0px 0 #000,
                 0px  4px 10px rgba(0, 0, 0, 0.88);
        }
        .jp-weather-telop.top-bar-avoid {
            top: var(--telop-top-with-bar, 118px);
        }
        .jp-weather-telop.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(var(--telop-scale, 1));
        }
        .jp-telop-row1 {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            width: 100%;
            gap: 28px;
        }
        /* 任务 2 (Round 14)：气象信息的色彩下划线置于文字后方（isolation: isolate + z-index: -1），避免遮挡文字 */
        #telopMainText {
            position: relative;
            display: inline-block;
            padding: 0 3px;
            z-index: 1;
            isolation: isolate;
        }
        #telopMainText::after {
            content: '';
            position: absolute;
            left: -2px;
            right: -2px;
            bottom: 2px;
            height: 12px;
            border-radius: 5px;
            background: var(--telop-underline-color, rgba(10, 132, 255, 0.72));
            pointer-events: none;
            z-index: -1;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.32);
        }
        .jp-telop-row2 {
            display: flex;
            align-items: baseline;
            justify-content: flex-end;
            width: 100%;
            font-size: 27px;
            letter-spacing: 2px;
        }

        /* 任务 2 & 3 (Round 9) & 任务 8 (Round 18)：正式播放画面底部全宽黑色渐变透明遮罩，最底部黑色部分增加些许透明度柔化视觉体验 */
        .iptv-fullscreen-hud {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            z-index: 92;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.72) 0%, rgba(0, 0, 0, 0.42) 54%, rgba(0, 0, 0, 0) 100%);
            padding: 84px 58px 40px 58px;
            box-sizing: border-box;
            color: #fff;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .iptv-fullscreen-hud.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 任务 7 & 8 (Round 18)：本地剧集正式播放期间按 F16 在底部唤出选集列表，采用与进度条一致的柔化黑色透明渐变遮罩 + 横向排布集数按钮 + 左右 SVG 季切换箭头 */
        .fs-episode-picker-hud {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            z-index: 94;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.72) 0%, rgba(0, 0, 0, 0.42) 54%, rgba(0, 0, 0, 0) 100%);
            padding: 90px 58px 42px 58px;
            box-sizing: border-box;
            color: #fff;
            opacity: 0;
            visibility: hidden;
            transform: translateY(14px);
            transition: opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1), transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.28s ease;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 14px;
        }
        .fs-episode-picker-hud.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            pointer-events: auto;
        }
        .fs-ep-picker-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding: 0 4px;
        }
        .fs-ep-picker-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.4px;
            color: rgba(255, 255, 255, 0.96);
            text-shadow: 0 4px 26px rgba(0, 0, 0, 0.50), 0 2px 12px rgba(0, 0, 0, 0.30);
        }
        .fs-ep-picker-season-meta {
            font-size: 15px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.72);
            margin-left: 12px;
            text-shadow: 0 3px 20px rgba(0, 0, 0, 0.45), 0 1px 10px rgba(0, 0, 0, 0.26);
        }
        .fs-ep-picker-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
        }
        .fs-ep-season-arrow {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.20);
            color: rgba(255, 255, 255, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            outline: none;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.22);
            transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }
        .fs-ep-season-arrow svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            display: block;
        }
        .fs-ep-season-arrow.disabled {
            opacity: 0.35;
        }
        .fs-ep-season-arrow.focused {
            background: #ffffff !important;
            color: #000000 !important;
            border-color: #ffffff !important;
            transform: scale(1.10);
            box-shadow: 0 10px 34px rgba(0, 0, 0, 0.34), 0 4px 16px rgba(0, 0, 0, 0.20);
        }
        .fs-ep-list-viewport {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            padding: 8px 6px;
            margin: -8px -6px;
            -webkit-mask-image: linear-gradient(to right, transparent 0px, black 12px, black calc(100% - 12px), transparent 100%);
            mask-image: linear-gradient(to right, transparent 0px, black 12px, black calc(100% - 12px), transparent 100%);
        }
        /* 任务 3 (Round 24)：清除“流媒体选项”左侧渐变遮罩残余，避免单按钮放大或高亮时左侧出现暗影裁切 */
        #fsStreamMenuViewport {
            overflow: visible !important;
            padding: 8px 4px !important;
            margin: -8px -4px !important;
            -webkit-mask-image: none !important;
            mask-image: none !important;
        }
        .fs-ep-list-track {
            display: flex;
            align-items: center;
            gap: 12px;
            width: max-content;
            transform: translate3d(0, 0, 0);
            transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }
        .fs-ep-item-btn {
            height: 44px;
            padding: 0 22px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            color: rgba(255, 255, 255, 0.90);
            font-size: 15px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            flex-shrink: 0;
            outline: none;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.22);
            transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .fs-ep-item-btn.current {
            background: rgba(255, 255, 255, 0.28);
            border-color: rgba(255, 255, 255, 0.48);
            color: #ffffff;
        }
        .fs-ep-item-btn.focused {
            background: #ffffff !important;
            color: #000000 !important;
            border-color: #ffffff !important;
            transform: scale(1.07);
            box-shadow: 0 10px 34px rgba(0, 0, 0, 0.34), 0 4px 16px rgba(0, 0, 0, 0.20);
        }
        /* 任务 6 (Round 26)：通过扩大阴影所在容器的 padding + 对称负 margin 扩充离屏光栅化与 mask 边界，保持模糊值不变的同时彻底消除标题背景半透明黑色矩形裁切框 */
        .iptv-hud-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 0.4px;
            line-height: 1.25;
            padding: 38px 42px;
            margin: -38px -42px -32px -42px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 76vw;
            text-shadow: 0 4px 28px rgba(0, 0, 0, 0.52), 0 2px 14px rgba(0, 0, 0, 0.32);
        }
        /* 任务 1 (Round 14) & 任务 2 (Round 15) & 任务 6 (Round 26)：文字滚动时左侧也增加渐变透明效果，同时上下预留充足内边距避免大半径文字阴影被 mask 盒裁切成半透明矩形底框 */
        .iptv-hud-title.single-line-marquee {
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: clip;
            max-width: 76vw;
            padding: 38px 42px 38px 26px;
            margin: -38px -42px -32px -26px;
            transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            -webkit-mask-image: linear-gradient(to right, transparent 0px, black 26px, black 93%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0px, black 26px, black 93%, transparent 100%);
        }
        .iptv-hud-sub {
            font-size: 20px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.35;
            padding: 32px 36px;
            margin: -32px -36px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 76vw;
            text-shadow: 0 4px 24px rgba(0, 0, 0, 0.48), 0 2px 12px rgba(0, 0, 0, 0.30);
        }
        .fs-progress-wrap {
            margin-top: 18px;
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
        }
        .fs-progress-wrap.active {
            display: flex;
        }
        .fs-progress-row {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
        }
        /* 任务 2 (Round 30)：轻微放大正式播放页面的播放状态按钮（34px -> 42px，图标 18px -> 22px），并赋予 macOS 27 原生 Liquid Glass 液态玻璃设计 */
        .fs-play-state-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            -apple-visual-effect: -apple-system-glass-material-clear;
            color-scheme: dark;
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border: none !important;
            box-shadow: none !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #fff;
            overflow: hidden;
            transform: translateZ(0);
            transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .fs-play-state-btn.liquid-light {
            color-scheme: light;
        }
        .fs-play-state-btn.liquid-dark {
            color-scheme: dark;
        }
        .fs-play-state-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            display: block;
            filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.38));
        }
        /* 任务 2 (Round 21)：取消亮度符号的按钮样式容器，直接显示亮度符号 */
        .tv-brightness-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0;
            color: rgba(255, 255, 255, 0.96);
        }
        .tv-brightness-icon svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            display: block;
            filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.44)) drop-shadow(0 2px 8px rgba(0, 0, 0, 0.26));
        }
        #tvBrightnessFill {
            transition: width 0.04s ease-out;
        }
        #tvBrightnessThumb {
            transition: left 0.04s ease-out, transform 0.15s ease;
        }
        .fs-progress-track {
            position: relative;
            flex: 1;
            height: 7px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.24);
            overflow: visible;
            cursor: pointer;
        }
        .fs-progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0%;
            border-radius: 999px;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.42), 0 2px 14px rgba(0, 0, 0, 0.28);
            transition: width 0.08s linear;
        }
        .fs-progress-thumb {
            position: absolute;
            top: 50%;
            left: 0%;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #ffffff;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.40), 0 0 14px rgba(255, 255, 255, 0.35);
            transition: left 0.08s linear, transform 0.18s ease;
        }
        .fs-progress-wrap.scrubbing .fs-progress-thumb {
            transform: translate(-50%, -50%) scale(1.32);
        }
        .fs-time-label {
            font-size: 16px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: rgba(255, 255, 255, 0.92);
            min-width: 118px;
            text-align: right;
            flex-shrink: 0;
            letter-spacing: 0.5px;
            text-shadow: 0 3px 22px rgba(0, 0, 0, 0.46), 0 1px 10px rgba(0, 0, 0, 0.28);
        }

        /* PSP UI 风格低饱和度动态流光背景 (严格图层层级：.base-layer z-index:-3 < #mac-bg-video z-index:-2 < .hero-overlay z-index:-1) */
        .base-layer { position: fixed; inset: 0; background-color: #070a10; z-index: -3; overflow: hidden; transition: opacity 0.45s ease; transform: translate3d(0,0,0); -webkit-transform: translate3d(0,0,0); pointer-events: none; }
        #pspWaveCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; opacity: 0.92; transition: opacity 0.65s ease; }

        .hero-overlay { position: fixed; inset: 0; background: linear-gradient(to right, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.18) 60%, transparent 100%), linear-gradient(to top, rgba(0,0,0,0.86) 0%, rgba(0,0,0,0.04) 45%, transparent 100%); z-index: -1; transition: opacity 0.4s ease; transform: translate3d(0,0,0); -webkit-transform: translate3d(0,0,0); pointer-events: none; }

        /* 任务 1 & 10 & 14 (Round 26) & 任务 6 (Round 27) & 任务 2, 3, 4, 8 (Round 29)：
           1) 左侧边栏与屏幕边缘间距、侧边栏内按钮与侧边栏边缘间距、按钮内文字/图标与按钮边缘间距轻微缩小，进一步提高屏幕空间利用率；
           2) 提升侧边栏 z-index (z-index: 30)，在“始终隐藏”模式下召唤左侧边栏时彻底分层覆盖下层页面，绝不推动或改变主页面元素位置；
           3) 支持 Liquid Glass 浅色 (light) 与深色 (dark) 两种原生外观模式；
           4) 支持全新“顶部侧边栏” (.sidebar.top-bar) 居中长连贯药丸胶囊设计，无任何折叠或隐藏逻辑，始终显示。 */
        .sidebar {
            position: fixed;
            left: 14px;
            top: 14px;
            bottom: 14px;
            width: 190px;
            background: linear-gradient(165deg, rgba(30, 33, 42, 0.34) 0%, rgba(16, 18, 24, 0.24) 52%, rgba(12, 14, 20, 0.30) 100%);
            backdrop-filter: blur(48px) saturate(160%);
            -webkit-backdrop-filter: blur(48px) saturate(160%);
            border-radius: 20px;
            border: 0.5px solid rgba(255, 255, 255, 0.042);
            box-shadow:
                0 18px 46px rgba(0, 0, 0, 0.24),
                inset 0 0 0 0.5px rgba(255, 255, 255, 0.025);
            z-index: 30;
            display: flex;
            flex-direction: column;
            padding: 12px 8px;
            box-sizing: border-box;
            transition: width 0.34s cubic-bezier(0.22, 1, 0.36, 1), transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.34s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.34s ease;
            overflow: hidden;
            background-clip: padding-box;
            -webkit-mask-image: -webkit-radial-gradient(white, black);
            transform: translate3d(0, 0, 0);
            will-change: width, transform, opacity;
        }
        .sidebar.collapsed { width: 58px; padding: 12px 8px; }
        .sidebar.autohidden {
            transform: translate3d(-110px, 0, 0);
            opacity: 0;
            pointer-events: none;
        }
        /* 任务 4 (Round 28) & 任务 2 (Round 29)：macOS 27 Golden Gate 100% 原生 Liquid Glass（液态玻璃）侧边栏设计方案，原生支持深色 (dark) 与浅色 (light) 两种模式 */
        .sidebar.liquid-glass {
            -apple-visual-effect: -apple-system-glass-material-clear;
            color-scheme: dark;
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            -webkit-mask-image: none !important;
            mask-image: none !important;
            border: none !important;
            box-shadow: none !important;
        }
        .sidebar.liquid-glass.liquid-light {
            color-scheme: light;
        }
        .sidebar.liquid-glass.liquid-dark {
            color-scheme: dark;
        }
        .sidebar.liquid-glass::before,
        .sidebar.liquid-glass::after {
            display: none !important;
            content: none !important;
        }
        .sidebar.liquid-glass .sidebar-focus-pill {
            background: rgba(255, 255, 255, 0.90);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
        }
        .sidebar.liquid-glass.liquid-light .sidebar-focus-pill {
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
        }
        .sidebar.liquid-glass .sidebar-focus-pill.avatar-mode {
            background: rgba(255, 255, 255, 0.22);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14);
        }
        /* 任务 1 (Round 26) & 任务 8 (Round 29)：侧边栏选中样式平滑平移指示胶囊（同时支持左侧纵向位移与顶部横向位移） */
        .sidebar-focus-pill {
            position: absolute;
            left: 0;
            top: 0;
            width: calc(100% - 16px);
            height: 40px;
            border-radius: 11px;
            background: rgba(255, 255, 255, 0.88);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transform: translate3d(var(--pill-x, 8px), var(--pill-y, 0px), 0) scale3d(1.03, 1.03, 1);
            transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), width 0.26s cubic-bezier(0.22, 1, 0.36, 1), height 0.26s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.22s ease, opacity 0.18s ease, box-shadow 0.22s ease;
            will-change: transform, width, height, opacity;
        }
        .sidebar-focus-pill.visible {
            opacity: 1;
        }
        .sidebar-focus-pill.avatar-mode {
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14);
            transform: translate3d(var(--pill-x, 8px), var(--pill-y, 0px), 0) scale3d(1.02, 1.02, 1);
        }
        .sidebar-focus-pill.pressing {
            transform: translate3d(var(--pill-x, 8px), var(--pill-y, 0px), 0) scale3d(0.92, 0.92, 1) !important;
            background: rgba(255, 255, 255, 0.28) !important;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.32), 0 6px 18px rgba(0, 0, 0, 0.35) !important;
        }
        .sidebar-header { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 4px 5px; margin-bottom: 12px; border-radius: 11px; box-sizing: border-box; overflow: hidden; transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.2s ease, box-shadow 0.2s ease; cursor: pointer; outline: none; white-space: nowrap; flex-shrink: 0; }
        .sidebar-header.focused { background-color: transparent; transform: scale3d(1.02, 1.02, 1); }
        /* 修复 5 & 任务 3/5 (Round 11)：长按用户头像、正在观看、流媒体时的温润微光按压态 */
        .sidebar-header.pressing, .nav-item.pressing { transform: scale3d(0.92, 0.92, 1) !important; background-color: transparent !important; box-shadow: none !important; }
        
        .user-left { display: flex; align-items: center; pointer-events: none; min-width: 0; flex-shrink: 0; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: #444; margin-right: 9px; overflow: hidden; border: 1px solid rgba(255,255,255,0.2); flex-shrink: 0; transition: margin-right 0.34s cubic-bezier(0.22, 1, 0.36, 1); }
        .sidebar.collapsed:not(.top-bar) .user-avatar { margin-right: 10px; }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .user-name { font-size: 15px; font-weight: 400; opacity: 1; max-width: 92px; overflow: hidden; text-overflow: ellipsis; transition: opacity 0.2s ease, max-width 0.32s cubic-bezier(0.22, 1, 0.36, 1), transform 0.28s cubic-bezier(0.22, 1, 0.36, 1); transform: translateX(0); }
        .sidebar-clock { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.7); pointer-events: none; opacity: 1; max-width: 50px; overflow: hidden; flex-shrink: 0; transition: opacity 0.18s ease, max-width 0.32s cubic-bezier(0.22, 1, 0.36, 1), transform 0.28s cubic-bezier(0.22, 1, 0.36, 1); transform: translateX(0); }
        .sidebar.collapsed:not(.top-bar) .user-name, .sidebar.collapsed:not(.top-bar) .sidebar-clock { opacity: 0; max-width: 0; transform: translateX(-6px); pointer-events: none; }
        
        .nav-list { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 3px; overflow: visible; flex-grow: 1; padding: 4px 4px; margin: -4px -4px; }
        .settings-section { position: relative; z-index: 2; flex-shrink: 0; display: flex; flex-direction: column; gap: 3px; overflow: visible; padding: 3px 4px; margin: -3px -4px; }
        .nav-item { position: relative; z-index: 2; display: flex; align-items: center; justify-content: flex-start; width: 100%; height: 40px; padding: 0 9px; margin: 0; box-sizing: border-box; border-radius: 11px; flex-shrink: 0; font-size: 15px; font-weight: 500; color: rgba(255,255,255,0.68); white-space: nowrap; overflow: hidden; cursor: pointer; outline: none; transition: background-color 0.22s ease, color 0.22s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.22s ease; }
        .sidebar.collapsed:not(.top-bar) .nav-item { padding: 0 11px; }
        .nav-item svg { width: 20px; height: 20px; margin-right: 9px; fill: currentColor; opacity: 0.85; display: block; flex-shrink: 0; transition: margin-right 0.34s cubic-bezier(0.22, 1, 0.36, 1), transform 0.24s ease; }
        .nav-icon-slot { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; margin-right: 9px; flex-shrink: 0; transition: margin-right 0.34s cubic-bezier(0.22, 1, 0.36, 1); }
        .nav-icon-slot svg { margin-right: 0 !important; }
        .item-text { transition: max-width 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1); max-width: 130px; overflow: hidden; opacity: 1; transform: translateX(0); }
        .sidebar.collapsed:not(.top-bar) .item-text { max-width: 0; opacity: 0; transform: translateX(-6px); }
        .nav-item:focus, .nav-item.focused { background-color: transparent; color: rgba(0, 0, 0, 0.9) !important; transform: scale3d(1.03, 1.03, 1); box-shadow: none; z-index: 2; }
        .sidebar.collapsed:not(.top-bar) .nav-item.focused svg { color: rgba(0,0,0,0.9); }
        .nav-item.active-row:not(.focused) { background-color: rgba(255, 255, 255, 0.14); color: rgba(255, 255, 255, 0.95); }
        .nav-divider { height: 1px; background: rgba(255,255,255,0.08); margin: 9px 4px 6px 4px; flex-shrink: 0; transition: margin 0.32s cubic-bezier(0.22, 1, 0.36, 1); }
        .nav-section-title { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.35); text-transform: uppercase; margin: 0 8px 3px 8px; max-height: 18px; opacity: 1; overflow: hidden; white-space: nowrap; flex-shrink: 0; transition: opacity 0.18s ease, max-height 0.3s cubic-bezier(0.22, 1, 0.36, 1), margin 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
        .sidebar.collapsed:not(.top-bar) .nav-section-title { opacity: 0; max-height: 0; margin: 0 8px; pointer-events: none; }

        /* 任务 8 (Round 29) & 任务 1, 3 (Round 30)：全新顶部侧边栏 (.sidebar.top-bar) 设计方案 —— Apple 官方 tvOS 长连贯药丸胶囊造型，支持“始终显示”与“始终隐藏”两种方案，并在进入正式播放页面时自动隐藏 */
        .sidebar.top-bar,
        .sidebar.top-bar.collapsed {
            position: fixed;
            top: 16px;
            left: 50%;
            right: auto;
            bottom: auto;
            width: max-content;
            height: 46px;
            padding: 3px 5px;
            border-radius: 999px;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transform: translate3d(-50%, 0, 0);
            opacity: 1;
            pointer-events: auto;
            overflow: hidden;
            z-index: 30;
        }
        .sidebar.top-bar.autohidden {
            transform: translate3d(-50%, -88px, 0) !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }
        .sidebar.fullscreen-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }
        .sidebar.top-bar.fullscreen-hidden {
            transform: translate3d(-50%, -88px, 0) !important;
            opacity: 0 !important;
            pointer-events: none !important;
            visibility: hidden !important;
        }
        .sidebar.top-bar .sidebar-focus-pill {
            border-radius: 999px;
        }
        .sidebar.top-bar .sidebar-header {
            width: 38px;
            height: 38px;
            padding: 0;
            margin: 0 2px 0 0;
            border-radius: 999px;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }
        .sidebar.top-bar .user-left {
            justify-content: center;
            align-items: center;
        }
        .sidebar.top-bar .user-avatar {
            width: 32px;
            height: 32px;
            margin: 0 !important;
        }
        .sidebar.top-bar .user-name,
        .sidebar.top-bar .sidebar-clock,
        .sidebar.top-bar .nav-divider,
        .sidebar.top-bar .nav-section-title {
            display: none !important;
        }
        .sidebar.top-bar .nav-list,
        .sidebar.top-bar .settings-section {
            flex-direction: row;
            align-items: center;
            gap: 2px;
            padding: 0;
            margin: 0;
            flex-grow: 0;
        }
        .sidebar.top-bar .nav-item {
            width: auto;
            height: 38px;
            padding: 0 15px;
            border-radius: 999px;
            justify-content: center;
            align-items: center;
            font-size: 14.5px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }
        /* 顶部侧边栏中的纯文字导航项（“正在观看”、“很酷 TV+”、“有线电视”、“流媒体”、“限制级”）隐藏图标，仅显示纯文字 */
        .sidebar.top-bar .nav-list .nav-item svg,
        .sidebar.top-bar .nav-list .nav-item .nav-icon-slot {
            display: none !important;
        }
        .sidebar.top-bar .nav-list .nav-item .item-text {
            max-width: none !important;
            opacity: 1 !important;
            transform: none !important;
        }
        /* 顶部侧边栏中的设置与电源按钮：仅显示纯 SVG 图标，隐藏文字 */
        .sidebar.top-bar .settings-section .nav-item {
            width: 38px;
            height: 38px;
            padding: 0;
            border-radius: 999px;
            justify-content: center;
            align-items: center;
        }
        .sidebar.top-bar .settings-section .nav-item svg {
            display: block !important;
            margin: 0 !important;
            width: 19px;
            height: 19px;
        }
        .sidebar.top-bar .settings-section .nav-item .item-text {
            display: none !important;
        }

        /* 任务 11 & 13 (Round 10)：三条竖线随机升高降低动态波形 SVG 动画与卡片右上角波形徽标 */
        .wave-bars-svg .wave-bar {
            transform-box: fill-box;
            transform-origin: center bottom;
            fill: currentColor;
        }
        .wave-bars-svg .wave-bar.b1 {
            animation: waveBarBounce1 0.72s ease-in-out infinite alternate;
        }
        .wave-bars-svg .wave-bar.b2 {
            animation: waveBarBounce2 0.56s ease-in-out infinite alternate;
        }
        .wave-bars-svg .wave-bar.b3 {
            animation: waveBarBounce3 0.84s ease-in-out infinite alternate;
        }
        @keyframes waveBarBounce1 {
            0%   { transform: scaleY(0.28); }
            35%  { transform: scaleY(0.95); }
            68%  { transform: scaleY(0.45); }
            100% { transform: scaleY(1.00); }
        }
        @keyframes waveBarBounce2 {
            0%   { transform: scaleY(0.96); }
            30%  { transform: scaleY(0.32); }
            65%  { transform: scaleY(0.88); }
            100% { transform: scaleY(0.24); }
        }
        @keyframes waveBarBounce3 {
            0%   { transform: scaleY(0.42); }
            40%  { transform: scaleY(1.00); }
            72%  { transform: scaleY(0.30); }
            100% { transform: scaleY(0.86); }
        }
        .card-wave-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.62);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.24);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 6;
            color: #ffffff;
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
        }
        .card-wave-badge svg {
            width: 15px;
            height: 15px;
            display: block;
            fill: currentColor;
        }

        .main-content { position: absolute; top: 0; bottom: 0; z-index: 2; left: 74px; width: calc(100% - 74px); display: flex; flex-direction: column; justify-content: flex-end; padding: 40px 45px; box-sizing: border-box; transform: translateX(128px); transition: left 0.38s cubic-bezier(0.22, 1, 0.36, 1), width 0.38s cubic-bezier(0.22, 1, 0.36, 1), transform 0.34s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease; will-change: transform, left, width; overflow: hidden; }
        .main-content.expanded { transform: translateX(0); }
        /* 任务 10 (Round 26) & 任务 4, 8 (Round 29)：“自动隐藏”收起态、“始终隐藏”独立分层模式以及“顶部侧边栏”模式下，主内容区始终铺满全宽且不随侧边栏召唤发生位移 */
        .main-content.sidebar-autohidden,
        .main-content.top-bar-mode {
            left: 0;
            width: 100%;
            transform: translateX(0);
        }
        .hero-text { margin-bottom: 10px; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease; display: flex; flex-direction: column; justify-content: flex-end; }
        .hero-text.lowered { transform: translateY(192px); }

        /* 修复 1：小标题旁小 SVG 与文字精准垂直居中对齐 */
        .brand-title { font-size: 14px; font-weight: 400; letter-spacing: 1px; color: rgba(255,255,255,0.7); margin-bottom: 0; display: inline-flex; align-items: center; height: 20px; line-height: 20px; }
        .brand-title svg { width: 16px !important; height: 16px !important; fill: #fff; opacity: 0.5; display: block; flex-shrink: 0; margin-right: 6px; transform: translateY(0px); } 
        #heroBrandText { line-height: 20px; display: inline-flex; align-items: center; }

        .main-title { font-size: 42px; font-weight: 800; margin: 0 0 4px 0; letter-spacing: -0.5px; line-height: 1.15; max-width: 75%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        /* 任务 10 (Round 19)：采用双节点乒乓交替驻留跑马灯架构，当标题滚动回静止位 (0px) 时直接由当前可见节点驻留，仅在屏幕外重置隐藏节点，彻底消除归位闪烁 */
        .main-title.single-line-marquee {
            display: block;
            white-space: nowrap;
            overflow: hidden;
            max-width: 68%;
            margin-left: -26px;
            padding-left: 26px;
            -webkit-mask-image: linear-gradient(to right, transparent 0px, black 26px, black 93%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0px, black 26px, black 93%, transparent 100%);
        }
        .marquee-track {
            position: relative;
            display: inline-block;
            white-space: nowrap;
            vertical-align: bottom;
        }
        .marquee-track > span {
            display: inline-block;
            padding-right: 72px;
            box-sizing: border-box;
            white-space: nowrap;
            will-change: transform;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .marquee-track > span.marquee-copy-b {
            position: absolute;
            top: 0;
            left: 0;
        }

        /* 修复 8 & 任务 6 (Round 21) & 问题 10 (Round 22)：TMDB 剧集 Logo 正方形/横向自适应放置容器（尺寸继续缩小 20%） */
        .tmdb-logo-stage {
            display: inline-flex;
            align-items: flex-end;
            justify-content: flex-start;
            min-height: 54px;
            margin-bottom: 8px;
        }
        .tmdb-logo-stage.square-stage {
            width: 94px;
            height: 94px;
        }

        /* 修复 1：认证徽标与副标题文字精准垂直居中对齐 */
        .sub-title { font-size: 15px; color: rgba(255,255,255,0.85); max-width: 650px; line-height: 20px; min-height: 20px; margin-bottom: 6px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; }
        #heroSubBadge { display: inline-flex; align-items: center; flex-shrink: 0; }
        #heroSubBadge svg { width: 15px; height: 15px; margin-right: 5px; fill: #00A1FF; opacity: 1; display: block; flex-shrink: 0; transform: translateY(0px); }
        #heroSubText { line-height: 20px; display: inline-block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* 修复 6：剧集文字介绍强制顶格显示 */
        .hero-desc { font-size: 14px; color: rgba(255, 255, 255, 0.85); max-width: 620px; line-height: 1.38; margin-bottom: 10px; font-weight: 400; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-indent: 0 !important; }

        /* 任务 4 & 6 (Round 19) & 任务 3 (Round 24)：流媒体左侧刷新符号改为无圆形容器纯状态指示器；清理流媒体二级菜单左侧跑马灯渐变遮罩残余，消除左侧阴影裁切感 */
        .season-bar { display: none; gap: 10px; margin-bottom: 10px; align-items: center; z-index: 6; flex-wrap: wrap; transition: opacity 0.26s cubic-bezier(0.22, 1, 0.36, 1), transform 0.26s cubic-bezier(0.22, 1, 0.36, 1); }
        .season-bar.active { display: flex; }
        .season-bar.single-line-mode { flex-wrap: nowrap; width: 100%; max-width: 92%; overflow: visible; }
        .season-pills-scroll-viewport {
            flex: 1;
            min-width: 0;
            overflow: visible;
            margin-left: 0;
            padding: 10px 4px;
            margin-top: -10px;
            margin-bottom: -10px;
            -webkit-mask-image: none;
            mask-image: none;
        }
        .season-pills-scroll-track {
            display: inline-flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 10px;
            width: max-content;
            transform: translate3d(0, 0, 0);
            transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        /* 任务 9 & 10 (Round 11) & 任务 5 (Round 15) & 任务 5 (Round 30)：参照 Apple TV (tvOS) 深色设置页面 (systemThickMaterialDark / UIBlurEffectStyleDark) 升级设置页、电源选项页与密码页背景遮罩——采用大半径高斯模糊 + 高饱和度环境光透出 + 石墨深灰多层微调渐晕 */

                radial-gradient(115% 92% at 26% 18%, var(--overlay-ambient-glow, rgba(82, 114, 168, 0.16)) 0%, rgba(255, 255, 255, 0.018) 48%, rgba(0, 0, 0, 0) 100%),

            e.preventDefault();
            e.stopPropagation();
            return false;
        }, true);

        document.getElementById('windowDragBar').addEventListener('mousedown', function(e) {
            if (e.button === 0) invoke('start_drag').catch(() => {});
        });

        window.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') e.preventDefault();

        // 修复 11：严防浏览器原生横向滚动导致画面飞出最左侧
        function lockViewportScroll() {
            if (window.scrollX !== 0 || window.scrollY !== 0) window.scrollTo(0, 0);
            if (document.documentElement.scrollLeft !== 0) document.documentElement.scrollLeft = 0;
            if (document.body.scrollLeft !== 0) document.body.scrollLeft = 0;
            var mc = document.getElementById('mainContent');
            if (mc && mc.scrollLeft !== 0) mc.scrollLeft = 0;
            var cc = document.getElementById('carouselContainer');
            if (cc && cc.scrollLeft !== 0) cc.scrollLeft = 0;
        }
        window.addEventListener('scroll', lockViewportScroll, true);

        // 任务 4 (Round 5) & 任务 1 & 4 (Round 8) & 任务 9 & 10 (Round 11) & 任务 6 (Round 12)：扩大每档 UI 缩放步进（100% ~ 200%），并使全屏设置页、全屏密码页、全屏电源页与顶部气象文字完美适配各个缩放等级
        const UI_SCALE_PRESETS = [
            { id: '1.00', label: '100%', factor: 1.00 },
            { id: '1.20', label: '120%', factor: 1.20 },
            { id: '1.40', label: '140%', factor: 1.40 },
            { id: '1.60', label: '160%', factor: 1.60 },
            { id: '1.80', label: '180%', factor: 1.80 },
            { id: '2.00', label: '200%', factor: 2.00 }
        ];
        const LEGACY_SCALE_MAP = {
            '1.08': '1.20',
            '1.15': '1.40',
            '1.22': '1.60',
            '1.30': '1.80',
            '1.38': '2.00'
        };

        function getCurrentUiScalePreset() {
            var saved = localStorage.getItem('fc_ui_scale') || '1.40';
            if (LEGACY_SCALE_MAP[saved]) {
                saved = LEGACY_SCALE_MAP[saved];
                localStorage.setItem('fc_ui_scale', saved);
            }
            return UI_SCALE_PRESETS.find(p => p.id === saved) || UI_SCALE_PRESETS[2];
        }

        // 任务 6 (Round 30)：根据顶部侧边栏是否处于可见状态以及当前 UI 缩放比例，动态计算气象信息顶部偏移位置，确保完美避让顶部胶囊侧边栏
        function syncWeatherTelopPosition() {
            var telopEl = document.getElementById('jpWeatherTelop');
            var sidebar = document.getElementById('sidebar');
            if (!telopEl) return;
            var preset = getCurrentUiScalePreset();
            var scale = (window.innerWidth / 1440) * preset.factor;
            var topBarVisible = Boolean(
                sidebar &&
                sidebar.classList.contains('top-bar') &&
                !sidebar.classList.contains('autohidden') &&
                !sidebar.classList.contains('fullscreen-hidden') &&
                (typeof isFullScreen === 'undefined' || !isFullScreen)
            );
            var avoidTopPx = Math.max(88, Math.round(62 * scale + 20));
            telopEl.style.setProperty('--telop-top', '48px');
            telopEl.style.setProperty('--telop-top-with-bar', avoidTopPx + 'px');
            telopEl.classList.toggle('top-bar-avoid', topBarVisible);
        }

        function autoScaleUI() {
            var preset = getCurrentUiScalePreset();
            var scale = (window.innerWidth / 1440) * preset.factor;
            var sidebar = document.getElementById('sidebar'), mainContent = document.getElementById('mainContent');
            if (sidebar && mainContent) { sidebar.style.zoom = scale; mainContent.style.zoom = scale; }
            var settingsPage = document.getElementById('settingsPageContent');
            var passwordPage = document.getElementById('passwordPageContent');
            var powerPage = document.getElementById('powerPageContent');
            var shutdownPage = document.getElementById('tvShuttingDownContent');
            var overlayZoom = (window.innerWidth / 1440) * (0.92 + (preset.factor - 1.0) * 0.65);
            overlayZoom = Math.max(0.85, Math.min(2.15, overlayZoom));
            if (settingsPage) {
                settingsPage.style.zoom = overlayZoom;
                settingsPage.style.maxHeight = Math.floor(window.innerHeight / overlayZoom) + 'px';
            }
            if (passwordPage) passwordPage.style.zoom = overlayZoom;
            if (powerPage) powerPage.style.zoom = overlayZoom;
            if (shutdownPage) shutdownPage.style.zoom = overlayZoom;
            var telopEl = document.getElementById('jpWeatherTelop');
            if (telopEl) {
                var telopScale = (window.innerWidth / 1680) * (0.81 + (preset.factor - 1.0) * 0.24);
                telopScale = Math.max(0.77, Math.min(1.10, telopScale));
                telopEl.style.setProperty('--telop-scale', telopScale.toFixed(3));
            }
            syncWeatherTelopPosition();
        }
        window.addEventListener('resize', autoScaleUI); autoScaleUI();

        function optimizeImageUrl(url) {

        // 任务 3 (Round 7)：IPTV 台标像素级 Alpha 边界自动裁切 + 视觉体量均衡算法
        // 针对如 CCTV1 等无留白双行厚重台标大幅缩小（内边距增至 38px 58px），针对如江西卫视等四周存在大面积透明留白或丝带+单行字纤细台标自动剥离留白并显著放大（内边距缩至 20px 22px）
        var iptvLogoTrimCache = {};

        function applyIptvLogoBoxStyle(img, itemEl, trimRatio, bboxFill) {
            var cardTitle = (itemEl ? (itemEl.getAttribute('data-title') || '') : '').toUpperCase();
            var isCctv = cardTitle.indexOf('CCTV') !== -1 || cardTitle.indexOf('CGTN') !== -1;

            img.style.objectFit = 'contain';
            img.style.boxSizing = 'border-box';
            img.style.transform = 'none';

            if (isCctv) {
                // CCTV 系列双行满画幅高密度台标：缩小显示，留出充足呼吸感
                img.style.padding = '38px 58px';
            } else if (trimRatio < 1.38) {
                // 近正方形/圆形独立台标：适度收窄内边距防止过大
                img.style.padding = '35px 62px';
            } else if (bboxFill < 0.29) {
                // 如江西卫视等左侧丝带+右侧单行文字（去留白后右上角大片镂空、视觉占比偏小）：显著放大
                img.style.padding = '19px 20px';
            } else if (bboxFill < 0.36 || trimRatio >= 2.38) {
                // 常规地方卫视横向图文台标：适度放大
                img.style.padding = '23px 26px';
            } else if (trimRatio <= 2.25 && bboxFill >= 0.39) {
                // 高密度饱满块状台标：适度缩小
                img.style.padding = '36px 54px';
            } else {
                // 标准均衡台标
                img.style.padding = '30px 40px';
            }
        }

        function fitSingleImage(img) {
            if (!img) return;
            var itemEl = img.closest('.media-item');
            var rowId = itemEl ? parseInt(itemEl.getAttribute('data-row')) : 1;
            var sourceRow = itemEl ? parseInt(itemEl.getAttribute('data-source-row') || '0') : 0;

            if (rowId !== 2 && sourceRow !== 2) {
                img.style.objectFit = 'cover';
                img.style.padding = '0px';
                img.style.transform = 'none';
                img.style.opacity = '1';
                return;
            }

            var currentSrc = img.getAttribute('src') || '';
            if (currentSrc.indexOf('data:image/jpeg') === 0 || currentSrc === DEFAULT_LOCAL_CARD_SVG) {
                img.style.objectFit = 'cover';
                img.style.padding = '0px';
                img.style.transform = 'none';
                img.style.opacity = '1';
                return;
            }

            if (img.getAttribute('data-logo-trimmed') === '1') {
                var tRatio = parseFloat(img.getAttribute('data-trim-ratio') || '2.2');
                var bFill = parseFloat(img.getAttribute('data-bbox-fill') || '0.32');
                applyIptvLogoBoxStyle(img, itemEl, tRatio, bFill);
                img.style.opacity = '1';
                return;
            }

            if (img.naturalWidth && img.naturalHeight) {
                var origKey = img.getAttribute('data-orig-src') || currentSrc;
                img.setAttribute('data-orig-src', origKey);

                if (iptvLogoTrimCache[origKey]) {
                    var cached = iptvLogoTrimCache[origKey];
                    if (cached.isFullCover) {
                        img.style.objectFit = 'cover';
                        img.style.padding = '0px';
                        img.style.transform = 'none';
                        img.style.opacity = '1';
                        return;
                    }
                    img.setAttribute('data-logo-trimmed', '1');
                    img.setAttribute('data-trim-ratio', String(cached.trimRatio));
                    img.setAttribute('data-bbox-fill', String(cached.bboxFill));
                    applyIptvLogoBoxStyle(img, itemEl, cached.trimRatio, cached.bboxFill);
                    if (cached.trimmedDataUrl && img.src !== cached.trimmedDataUrl) {
                        img.src = cached.trimmedDataUrl;

                    img.style.opacity = '1';
                    return;

                try {
                    var nw = img.naturalWidth, nh = img.naturalHeight;
                    var scanScale = Math.min(1, 280 / Math.max(nw, nh));
                    var sw = Math.max(1, Math.round(nw * scanScale));
                    var sh = Math.max(1, Math.round(nh * scanScale));
                    var c = document.createElement('canvas');
                    c.width = sw;

                    var c1 = imgData[3], c2 = imgData[(sw - 1) * 4 + 3], c3 = imgData[(sh - 1) * sw * 4 + 3], c4 = imgData[(sh * sw - 1) * 4 + 3];
                    var rawRatio = nw / nh;
                    if (c1 > 242 && c2 > 242 && c3 > 242 && c4 > 242 && rawRatio >= 1.50 && rawRatio <= 1.90 && nw >= 400) {
                        iptvLogoTrimCache[origKey] = { isFullCover: true };

                        img.style.padding = '0px';
                        img.style.transform = 'none';
                        img.style.opacity = '1';
                        return;
                    }

                    var minX = sw, minY = sh, maxX = -1, maxY = -1;
                    var weightedInk = 0;
                    for (var py = 0; py < sh; py++) {
                        var rowOff = py * sw * 4;
                        for (var px = 0; px < sw; px++) {
                            var a = imgData[rowOff + px * 4 + 3];
                            if (a > 20) {
                                if (px < minX) minX = px;
                                if (px > maxX) maxX = px;
                                if (py < minY) minY = py;
                                if (py > maxY) maxY = py;
                                weightedInk += (a / 255);

                            bboxFill: bboxFill

                    if (fallbackTitle.indexOf('CCTV') !== -1 || fallbackTitle.indexOf('CGTN') !== -1) {

        var DOUYIN_CATEGORY_CACHE = {};

        // 任务 13 & 14 (Round 5) & 任务 3 (Round 12)：确保流媒体靠近结尾自动加载更多视频流时刷新按钮也显示正在加载，直到本次新增卡片全部加载完毕
        function requestMoreDouyinStreams() {

        async function loadDouyinNativeFeed(forceRefresh, requestMore) {
            var reqCat = activeDouyinCategory;
            var catObj = getStreamCategoryObj(reqCat);
            if (forceRefresh) {
                if (douyinPollTimer) { clearInterval(douyinPollTimer); douyinPollTimer = null; }
                isLoadDouyinFeedInFlight = false;
                isDouyinRefreshing = true;
                triggerStreamRefreshSpin(1400);

                lastRowColMap[3] = 1;

                if (isCurrentStreamDouyin()) {
                    stopPreviewStream(true);

                var refreshPlaceholder = [{ title: "正在刷新 " + catObj.name + " 视频流...", sub: "请稍候", desc: "", isRefreshCard: true, action: "douyin:refresh" }];
                DOUYIN_CATEGORY_CACHE[reqCat] = {
                    cards: refreshPlaceholder,
                    fullList: [],
                    visibleQuota: STREAM_INITIAL_VISIBLE_COUNT,
                    rawCount: 0,
                    contentSig: '',
                    lastCol: 1,
                    lastGrowthTs: Date.now(),
                    loading: true
                };
                ROW_DATA[3] = refreshPlaceholder;
                updateDouyinRefreshBtnState();
                if (currentTrackRow === 3) {
                    var prevRow = currentFocusEl ? parseInt(currentFocusEl.getAttribute('data-row')) : 3;
                    var prevCol = currentFocusEl ? parseInt(currentFocusEl.getAttribute('data-col')) : 1;
                    renderDouyinTrackCardsOnly();
                    if (prevRow === 0) {

                        if (restorePill) setFocus(restorePill);
                    } else if (prevCol === 0) {
                        // 任务 2 (Round 12)：长按左侧边栏“流媒体”刷新推荐流时，保持焦点留在“流媒体”导航项上，绝不跳入卡片或触发全屏播放
                        var navDyItem = document.querySelector('.focusable[data-row="3"][data-col="0"]');
                        if (navDyItem) setFocus(navDyItem);
                    } else {
                        var first = document.querySelector('.focusable[data-row="3"][data-col="1"]') || document.querySelector('.focusable[data-row="3"][data-col="0"]');
                        if (first) setFocus(first);
                    }
                }
                await invoke('get_douyin_feed', { refresh: true, loadMore: false, category: reqCat }).catch(() => {});
                if (isBiliCategory(reqCat)) {
                    setTimeout(() => loadDouyinNativeFeed(false, false), 80);
                }
                douyinPollTimer = setInterval(() => loadDouyinNativeFeed(false, false), 750);
                return;
            }

            if (isLoadDouyinFeedInFlight && !requestMore) {
                return;
            }
            isLoadDouyinFeedInFlight = true;

            try {
                const list = await invoke('get_douyin_feed', { refresh: false, loadMore: !!requestMore, category: reqCat });
                if (list && list.length > 0) {
                    var fullList = list.slice(0, 200);
                    var prevCache = DOUYIN_CATEGORY_CACHE[reqCat];
                    var prevRawCount = prevCache ? (prevCache.rawCount || 0) : 0;
                    var prevSig = prevCache ? (prevCache.contentSig || '') : '';
                    var visibleQuota = (prevCache && prevCache.visibleQuota) ? prevCache.visibleQuota : STREAM_INITIAL_VISIBLE_COUNT;
                    var cappedList = fullList.slice(0, visibleQuota);
                    var newSig = computeStreamListSig(cappedList);
                    var isAppendOnly = Boolean(prevSig && newSig && newSig.indexOf(prevSig) === 0);
                    var sigChanged = Boolean(newSig && newSig !== prevSig && !isAppendOnly);
                    var nowMs = Date.now();
                    var growthTs = (cappedList.length > prevRawCount || sigChanged || !prevCache || !prevCache.lastGrowthTs)
                        ? nowMs
                        : prevCache.lastGrowthTs;
                    var settleMs = isBiliCategory(reqCat) ? 650 : DOUYIN_BATCH_SETTLE_MS;
                    var stillAddingCards = (nowMs - growthTs) < settleMs && cappedList.length < visibleQuota;

                    var cards = cappedList.map((item, idx) => buildStreamVideoCardObj(item, idx, catObj));
                    cards.push(buildStreamRefreshCardObj(catObj));

                    DOUYIN_CATEGORY_CACHE[reqCat] = {
                        cards: cards,
                        fullList: fullList,
                        visibleQuota: visibleQuota,
                        rawCount: cappedList.length,
                        contentSig: newSig,
                        lastCol: (prevCache && prevCache.lastCol) ? prevCache.lastCol : 1,
                        lastGrowthTs: growthTs,
                        loading: stillAddingCards
                    };

                    if (reqCat === activeDouyinCategory) {
                        isDouyinRefreshing = stillAddingCards;
                        updateDouyinRefreshBtnState();
                        var track = document.getElementById('mainTrack');
                        var domVideoCards = (currentTrackRow === 3 && track)
                            ? track.querySelectorAll('.media-item[data-row="3"]:not([data-action="douyin:refresh"])').length
                            : lastDouyinCount;

                        if (cappedList.length !== lastDouyinCount || sigChanged || prevRawCount === 0 || (currentTrackRow === 3 && domVideoCards < cappedList.length)) {
                            var wasPlaceholder = (lastDouyinCount === 0 || prevRawCount === 0 || sigChanged || (currentTrackRow === 3 && domVideoCards === 0));
                            lastDouyinCount = cappedList.length;
                            ROW_DATA[3] = cards;

                            if (currentTrackRow === 3 && track) {
                                if (wasPlaceholder) {
                                    var focusedRow = currentFocusEl ? parseInt(currentFocusEl.getAttribute('data-row')) : 3;
                                    var focusedCol = currentFocusEl ? parseInt(currentFocusEl.getAttribute('data-col')) : 0;

                                    if (!isFullScreen) {
                                        if (focusedRow === 3) {
                                            var targetFocus = document.querySelector('.focusable[data-row="3"][data-col="' + (focusedCol > 0 ? Math.min(focusedCol, cappedList.length) : 0) + '"]');
                                            if (targetFocus) setFocus(targetFocus);
                                        } else if (focusedRow === 0) {
                                            var targetPillFocus = document.querySelector('.focusable[data-row="0"][data-col="' + focusedCol + '"]') || document.querySelector('.focusable[data-row="0"][data-col="1"]');
                                            if (targetPillFocus) setFocus(targetPillFocus);
                                        }
                                    }
                                } else {
                                    var refreshCardEl = track.querySelector('.media-item[data-action="douyin:refresh"]');
                                    if (refreshCardEl && cappedList.length > domVideoCards) {
                                        var frag = document.createDocumentFragment();
                                        var tempDiv = document.createElement('div');
                                        for (var n = domVideoCards; n < cappedList.length; n++) {
                                            tempDiv.innerHTML = buildMediaCardHTML(3, cards[n], n + 1, n);
                                            frag.appendChild(tempDiv.firstChild);
                                        }
                                        refreshCardEl.setAttribute('data-col', String(cards.length));
                                        track.insertBefore(frag, refreshCardEl);
                                        bindTrackImages(track);
                                    }
                                }
                            }

                            if (pendingAutoAdvanceDouyin && isFullScreen && fullScreenRow === 3 && cappedList.length > fullScreenCol) {
                                pendingAutoAdvanceDouyin = false;
                                switchFullScreenVideo(1);
                            }
                        }

                        if (!stillAddingCards && cappedList.length >= visibleQuota && douyinPollTimer) {
                            clearInterval(douyinPollTimer);
                            douyinPollTimer = null;
                        }
                    }
                } else if (reqCat === activeDouyinCategory) {
                    updateDouyinRefreshBtnState();
                }
            } catch (e) {
            } finally {
                isLoadDouyinFeedInFlight = false;
            }
        }

        function cleanTextToSeriesTitle(str) {
            if (!str) return '';
            var s = str
                .replace(/^(?:\[.*?\]|【.*?】|\(.*?\))+/g, ' ')
                .replace(/(?:[._\-\s]+|^)(?:S\d{1,2}\s*E\d{1,3}|S\d{1,2}|EP?\s*\d{1,3}|第\s*[0-9一二三四五六七八九十百]+\s*[季集话期]).*$/i, '')
                .replace(/(?:[._\-\s]+)(?:1080p|720p|2160p|4K|UHD|HDR|HEVC|H264|H265|x264|x265|WEB-DL|BluRay|REMUX|AAC|DTS|RMVB|DIVX).*$/i, '')
                .replace(/\[.*?\]|\(.*?\)|【.*?】/g, ' ')
                .replace(/\b(19\d{2}|20\d{2})\b/g, ' ')
                .replace(/[._\-]+/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
            return s;
        }

        function isSeasonFolderName(name) {
            return /^(?:Season\s*\d+|S\d{1,2}|第\s*[0-9一二三四五六七八九十]+\s*季|Specials|SP)$/i.test(name.trim());
        }

        function deriveSeriesKey(mediaBasePath, fullPath, rawName) {
            var cleanBase = mediaBasePath.replace(/\/+$/, '');
            var rel = fullPath.indexOf(cleanBase) === 0 ? fullPath.substring(cleanBase.length).replace(/^\/+/, '') : '';
            var parts = rel ? rel.split('/') : [];

            if (parts.length >= 2) {
                var topFolder = parts[0];
                if (!isSeasonFolderName(topFolder)) {
                    var folderClean = cleanTextToSeriesTitle(topFolder);
                    if (folderClean) return folderClean;
                }
            }
            if (parts.length >= 2 && isSeasonFolderName(parts[0])) {
                var baseParts = cleanBase.split('/');
                var baseFolder = baseParts[baseParts.length - 1];
                var baseClean = cleanTextToSeriesTitle(baseFolder);
                if (baseClean) return baseClean;
            }

            var nameClean = cleanTextToSeriesTitle(rawName);
            if (!nameClean || /^\d+$/.test(nameClean)) {
                var bParts = cleanBase.split('/');
                return cleanTextToSeriesTitle(bParts[bParts.length - 1]) || rawName;
            }
            return nameClean;
        }

        function parseSeasonAndEp(fullPath, rawName, idx) {
            var season = 1, ep = idx + 1;
            var sMatch = rawName.match(/S(\d{1,2})/i) || rawName.match(/第\s*(\d+)\s*季/) || fullPath.match(/(?:Season|S)\s*(\d{1,2})/i) || fullPath.match(/第\s*(\d+)\s*季/);
            if (sMatch) season = parseInt(sMatch[1]) || 1;
            var eMatch = rawName.match(/E(\d{1,3})/i) || rawName.match(/EP(\d{1,3})/i) || rawName.match(/第\s*(\d+)\s*[集话期]/) || rawName.match(/(?:^|[._\-\s])(\d{1,3})(?:[._\-\s]|$)/);
            if (eMatch) ep = parseInt(eMatch[1]) || (idx + 1);
            return { season: season, ep: ep, label: '第 ' + ep + ' 集' };
        }

        function extractPornSubfolder(basePath, fullPath) {
            var cleanBase = basePath.replace(/\/+$/, '');
            var rel = fullPath.indexOf(cleanBase) === 0 ? fullPath.substring(cleanBase.length).replace(/^\/+/, '') : fullPath;
            var parts = rel.split('/');
            if (parts.length > 1) return parts[0];
            var baseParts = cleanBase.split('/');
            return baseParts[baseParts.length - 1] || '默认';
        }

        function consolidateSameTitleSeriesForList(sourceList, isMovieMode) {
            var titleMap = {};
            var outList = [];
            for (var i = 0; i < sourceList.length; i++) {
                var item = sourceList[i];
                var t = item.title;
                if (!isMovieMode && item.seriesKey && titleMap[t]) {
                    var primaryItem = titleMap[t];
                    var primaryKey = primaryItem.seriesKey;
                    var currKey = item.seriesKey;
                    if (primaryKey !== currKey && SERIES_GROUPS[currKey]) {
                        SERIES_GROUPS[primaryKey] = (SERIES_GROUPS[primaryKey] || []).concat(SERIES_GROUPS[currKey]);
                        SERIES_GROUPS[primaryKey].sort((a, b) => (a.season - b.season) || (a.ep - b.ep));
                        delete SERIES_GROUPS[currKey];
                    }
                } else {
                    if (item.seriesKey) titleMap[t] = item;
                    outList.push(item);
                }
            }
            for (var j = 0; j < outList.length; j++) {
                var it = outList[j];
                if (isMovieMode) {
                    var mCache = it.seriesKey ? localTmdbCache[it.seriesKey] : null;
                    if (mCache) {
                        it.sub = getSeriesScorePrefix(mCache) + ' · 电影';
                    }
                } else if (it.seriesKey && SERIES_GROUPS[it.seriesKey]) {
                    var totalEps = SERIES_GROUPS[it.seriesKey].length;
                    it.action = totalEps > 1 ? ('series:' + it.seriesKey) : ('local:' + SERIES_GROUPS[it.seriesKey][0].fullPath);
                    var scorePrefix = getSeriesScorePrefix(localTmdbCache[it.seriesKey]);
                    it.sub = scorePrefix + (totalEps > 1 ? (' · 共 ' + totalEps + ' 集') : '');
                }
            }
            return outList;
        }

        function consolidateSameTitleSeries() {
            COOLTV_SERIES_ITEMS = consolidateSameTitleSeriesForList(COOLTV_SERIES_ITEMS, false);
            COOLTV_MOVIE_ITEMS = consolidateSameTitleSeriesForList(COOLTV_MOVIE_ITEMS, true);

        // 任务 2 (Round 10)：快速移动进度条时基于 lockedSeekTargetSec 连续累加，绝不读回未完成的旧 currentTime，彻底根除回弹现象

        function executeCommittedSeek(targetSec) {

        // 任务 4 (Round 7)：严格等待视频解码出真实画面、播放进度推进 (currentTime >= 0.16, videoWidth > 0, readyState >= 2)，且距离最后一次 resize/loadedmetadata 几何变更满 380ms（确保 macOS CoreAnimation 内部 AVSampleBufferDisplayLayer 250ms 隐式缩放动画在 opacity:0.002 幕后 100% 结束）后再平滑淡入

                    startVideoPlaybackWithFallback(reqSeq);
                }
            };
        }

        function onBackgroundVideoStarted() {
            setTimeout(function() {
                if (currentPlayingStream && currentPlayingStream.indexOf('http') === 0) {
                    try {
                        var canvas = document.createElement('canvas'); canvas.width = 640; canvas.height = 360;
                        canvas.getContext('2d').drawImage(macVideo, 0, 0, canvas.width, canvas.height);
                        var dataUrl = canvas.toDataURL('image/jpeg', 0.65);
                        iptvFrameCache[currentPlayingStream] = dataUrl;
                    } catch(e) {}

        var forceStoppedBgByUser = false;

        function startPreviewStream(url) {
            if (isFullScreen) return;
            forceStoppedBgByUser = false;
            var previewMuted = !appSettings.previewSound;
            if (currentBgUrl !== url || (!isVideoReady && !hlsInstance && !inFlightFfmpegReq) || (macVideo.paused && isCurrentStreamIptv())) {
                destroyActiveHlsAndResetVideo();
                currentBgUrl = url;
                lockedSeekTargetSec = null;
                lockedSeekExpireTs = 0;
                // 任务 3 (Round 19)：若该内容存在已保存的历史观看进度，背景预览与起播直接从历史进度秒数开始
                var savedPreviewHist = findSavedWatchHistoryEntry(url);
                var previewResumeSec = (savedPreviewHist && savedPreviewHist.progressSec && savedPreviewHist.progressSec > 3 && (!savedPreviewHist.durationSec || savedPreviewHist.progressSec < savedPreviewHist.durationSec - 5))
                    ? savedPreviewHist.progressSec
                    : ((activePreviewMeta && activePreviewMeta.url === url && activePreviewMeta.progressSec > 3)
                        ? activePreviewMeta.progressSec
                        : ((url && url.indexOf('/') === 0) ? 2 : 0));
                streamSeekBaseSec = previewResumeSec;
                if (previewResumeSec > 3) {
                    lockedSeekTargetSec = previewResumeSec;
                    lockedSeekExpireTs = performance.now() + 6500;
                }
                var mySeq = ++streamReqSeq;
                probeStreamDuration(url, mySeq);
                // 任务 11 (Round 18)：未进入正式播放界面的预览内容不计入 watchHistoryList，仅通过 syncNowWatchingRowData 临时显示当前正在预览的卡片
                syncNowWatchingRowData(false);
                updateNowPlayingNavVisibility(true);
                var ffmpegSpec = (isCurrentStreamIptv() && activePreviewMeta && activePreviewMeta.title)
                    ? (url + '@@title=' + activePreviewMeta.title)
                    : url;
                var previewFfmpegArgs = (previewResumeSec > 3)
                    ? { url: ffmpegSpec, seekSec: previewResumeSec }
                    : { url: ffmpegSpec };
                var p = invoke('start_ffmpeg', previewFfmpegArgs);
                inFlightFfmpegReq = { url: url, seq: mySeq, promise: p, seekSec: previewResumeSec };
                p.then((localM3u8Url) => {
                    if (inFlightFfmpegReq && inFlightFfmpegReq.seq === mySeq) inFlightFfmpegReq = null;
                    if (mySeq !== streamReqSeq || currentBgUrl !== url) return; 
                    loadAndPlayVideo(localM3u8Url + "?t=" + new Date().getTime(), isFullScreen ? false : previewMuted, mySeq);
                }).catch(e => {
                    if (inFlightFfmpegReq && inFlightFfmpegReq.seq === mySeq) inFlightFfmpegReq = null;
                }); 
            } else {
                applyPreviewOrFullscreenAudio();
                syncNowWatchingRowData(false);
                macVideo.play().then(() => {
                    setVideoLayerVisible(true);
                    updateNowPlayingNavVisibility(true);
                }).catch(() => {
                    macVideo.muted = true;
                    macVideo.play().then(() => {
                        setVideoLayerVisible(true);

            }

        // 任务 7 (Round 18) & 任务 9 (Round 20)：本地剧集正式播放期间按上下文菜单键 (F16) 或下方向键 (ArrowDown) 在底部唤出选集列表（含左右两端 SVG < 和 > 季切换按钮）
        var fsEpisodePickerOpen = false;

        function resolveLocalSeriesByPath(filePath, hintSeriesKey) {
            if (hintSeriesKey && SERIES_GROUPS[hintSeriesKey] && SERIES_GROUPS[hintSeriesKey].length > 0) {
                var matchedEp = SERIES_GROUPS[hintSeriesKey].find(function(e) { return e.fullPath === filePath; });
                return {
                    seriesKey: hintSeriesKey,
                    seasonNum: matchedEp ? matchedEp.season : (activeSeasonNum || 1)
                };
            }
            if (!filePath || filePath.indexOf('/') !== 0) return null;
            for (var sKey in SERIES_GROUPS) {
                if (Object.prototype.hasOwnProperty.call(SERIES_GROUPS, sKey)) {
                    var arr = SERIES_GROUPS[sKey];
                    if (Array.isArray(arr) && arr.length > 1) {
                        var hit = arr.find(function(e) { return e.fullPath === filePath; });
                        if (hit) {
                            return { seriesKey: sKey, seasonNum: hit.season || 1 };
                        }
                    }
                }
            }
            return null;
        }

        function isCurrentStreamLocalSeries() {
            var curPath = (activePreviewMeta && activePreviewMeta.url) ? activePreviewMeta.url : (currentBgUrl || currentPlayingStream || '');
            var resolved = resolveLocalSeriesByPath(curPath, (activePreviewMeta && activePreviewMeta.seriesKey) || activeSeriesView || '');
            if (!resolved || !SERIES_GROUPS[resolved.seriesKey]) return false;
            return SERIES_GROUPS[resolved.seriesKey].length > 1;
        }

        function updateFsEpPickerFocusVisuals() {
            var prevBtn = document.getElementById('fsEpPrevSeasonBtn');
            var nextBtn = document.getElementById('fsEpNextSeasonBtn');
            var track = document.getElementById('fsEpListTrack');

            if (!track || !viewport) return;

            if (prevBtn) prevBtn.classList.toggle('focused', fsEpFocusZone === 'prevSeason');
            if (nextBtn) nextBtn.classList.toggle('focused', fsEpFocusZone === 'nextSeason');
            epBtns.forEach(function(btn, idx) {
                btn.classList.toggle('focused', fsEpFocusZone === 'ep' && idx === fsEpFocusIndex);
            });
            if (fsEpFocusZone === 'ep' && epBtns[fsEpFocusIndex]) {
                var targetBtn = epBtns[fsEpFocusIndex];
                var vpWidth = viewport.clientWidth || 800;
                var btnCenter = targetBtn.offsetLeft + (targetBtn.offsetWidth / 2);
                var maxScroll = Math.max(0, track.scrollWidth - vpWidth);
                var desiredScroll = Math.max(0, Math.min(maxScroll, btnCenter - (vpWidth / 2)));
                track.style.transform = 'translate3d(-' + Math.round(desiredScroll) + 'px, 0, 0)';
            } else if (fsEpFocusZone === 'prevSeason') {
                track.style.transform = 'translate3d(0px, 0, 0)';
            } else if (fsEpFocusZone === 'nextSeason') {
                var vpW = viewport.clientWidth || 800;

                track.style.transform = 'translate3d(-' + Math.round(maxS) + 'px, 0, 0)';

        function renderFsEpisodePickerSeason(seasonNum, focusMode) {
            var allEps = SERIES_GROUPS[fsEpPickerSeriesKey] || [];
            if (!allEps.length) return;

            fsEpPickerSeasonNum = (seasons.indexOf(seasonNum) !== -1) ? seasonNum : seasons[0];

            var seasonEps = allEps.filter(function(e) { return e.season === fsEpPickerSeasonNum; });

            if (nextBtn) nextBtn.classList.toggle('disabled', seasons.length <= 1);

            var curPlayingPath = (activePreviewMeta && activePreviewMeta.url) ? activePreviewMeta.url : (currentBgUrl || currentPlayingStream || '');
            var curEpIdx = 0;

            for (var i = 0; i < seasonEps.length; i++) {

                html += '<button type="button" class="fs-ep-item-btn' + (isCur ? ' current' : '') + '" data-ep-idx="' + i + '" data-ep-path="' + ep.fullPath.replace(/"/g, '&quot;') + '" tabindex="-1">' + ep.label + '</button>';

            if (focusMode === 'keepArrow') {
                fsEpFocusIndex = 0;
            } else if (focusMode === 'firstEp') {
                fsEpFocusZone = 'ep';
                fsEpFocusIndex = 0;
            } else if (focusMode === 'lastEp') {
                fsEpFocusZone = 'ep';
                fsEpFocusIndex = Math.max(0, seasonEps.length - 1);

                fsEpFocusZone = 'ep';
                fsEpFocusIndex = curEpIdx;

        function switchFsEpPickerSeason(stepDir) {

            var idx = fsEpPickerSeasons.indexOf(fsEpPickerSeasonNum);
            if (idx === -1) idx = 0;
            var nextIdx = (idx + stepDir + fsEpPickerSeasons.length) % fsEpPickerSeasons.length;

        function playFsEpisodeFromPicker(epIdx) {
            var allEps = SERIES_GROUPS[fsEpPickerSeriesKey] || [];

                if (mainTrack) mainTrack.style.transform = 'translate3d(-' + offset + 'px, 0, 0)';
            }
            var meta = localTmdbCache[fsEpPickerSeriesKey] || { title: fsEpPickerSeriesKey, scoreLine: 'TMDB 剧集', desc: '', img: '' };
            var scorePrefix = getSeriesScorePrefix(meta);
            var subLine = normalizeMiddleDotSpacing(scorePrefix + ' · 第 ' + fsEpPickerSeasonNum + ' 季 · ' + ep.label);
            var seriesTitle = meta.title || fsEpPickerSeriesKey;

        function openFsEpisodePicker() {
            if (!isFullScreen) return false;
            var curPath = (activePreviewMeta && activePreviewMeta.url) ? activePreviewMeta.url : (currentBgUrl || currentPlayingStream || '');
            var resolved = resolveLocalSeriesByPath(curPath, (activePreviewMeta && activePreviewMeta.seriesKey) || activeSeriesView || '');
            if (!resolved || !SERIES_GROUPS[resolved.seriesKey] || SERIES_GROUPS[resolved.seriesKey].length <= 1) {
