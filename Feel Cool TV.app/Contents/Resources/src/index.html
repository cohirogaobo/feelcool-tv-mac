        // 任务 7 (Round 23) & 任务 6 (Round 24)：流媒体正式播放页面按菜单键（F16）唤出流媒体专用菜单选项（支持“只看作者”选项预抓取、上下键立即切视频与首尾循环切换）
        var fsStreamMenuOpen = false;
        var streamAuthorOnlyActive = false;
        var streamAuthorOnlyName = '';
        var streamAuthorOnlyVideos = [];
        var streamAuthorOnlyIndex = 0;
        var streamAuthorFetchPromise = null;

        function extractCleanAuthorName(subStr) {
            var s = String(subStr || '').trim();
            if (!s) return '';
            var parts = s.split('·');
            var first = (parts[0] || '').trim();
            if (first.indexOf('@') === 0) first = first.substring(1).trim();
            return first;
        }

        function normalizeAuthorVideoDedupKey(rawUrl) {
            if (!rawUrl) return '';
            return String(rawUrl)
                .replace(/^douyin:/, '')
                .replace(/^h264:/, '')
                .split('@@')[0]
                .trim();
        }

        function buildInitialAuthorVideoList(curUrl, curTitle, curSub, cleanAuthor) {
            var initialList = [];
            var seenKeys = {};
            function addCandidate(vTitle, vSub, vUrl, vAct, vImg) {
                var key = normalizeAuthorVideoDedupKey(vUrl || vAct);
                if (!key || seenKeys[key]) return;
                seenKeys[key] = true;
                var fullAct = String(vAct || vUrl);
                if (fullAct.indexOf('douyin:') !== 0 && fullAct.indexOf('iptv:') !== 0 && fullAct.indexOf('local:') !== 0) {
                    fullAct = 'douyin:' + fullAct;
                }
                initialList.push({
                    title: vTitle || '精选视频',
                    sub: vSub || (cleanAuthor ? ('@' + cleanAuthor) : ''),
                    url: fullAct,
                    action: fullAct,
                    img: vImg || ''
                });
            }
            if (curUrl) {
                addCandidate(
                    curTitle || '精选视频',
                    curSub || (cleanAuthor ? ('@' + cleanAuthor) : ''),
                    curUrl,
                    curUrl,
                    (activePreviewMeta && activePreviewMeta.img) ? activePreviewMeta.img : ''
                );
            }
            if (ROW_DATA[3] && ROW_DATA[3].length > 0 && cleanAuthor) {
                for (var i = 0; i < ROW_DATA[3].length; i++) {
                    var item = ROW_DATA[3][i];
                    if (!item || !item.action || item.action === 'douyin:refresh') continue;
                    var itemAuthor = extractCleanAuthorName(item.sub || '');
                    if (itemAuthor && itemAuthor === cleanAuthor) {
                        addCandidate(
                            item.title || '精选视频',
                            item.sub || ('@' + cleanAuthor),
                            item.previewUrl || item.action,
                            item.action,
                            item.img || ''
                        );
                    }
                }
            }
            var catCache = DOUYIN_CATEGORY_CACHE[activeDouyinCategory];
            if (catCache && Array.isArray(catCache.fullList) && cleanAuthor) {
                for (var k = 0; k < catCache.fullList.length; k++) {
                    var rawNode = catCache.fullList[k];
                    if (!Array.isArray(rawNode) || !rawNode[3]) continue;
                    var nodeAuthor = extractCleanAuthorName(rawNode[1] || '');
                    if (nodeAuthor && nodeAuthor === cleanAuthor) {
                        var fullNodeAct = String(rawNode[3]).indexOf('douyin:') === 0 ? String(rawNode[3]) : ('douyin:' + rawNode[3]);
                        addCandidate(
                            rawNode[0] || '精选视频',
                            '@' + nodeAuthor,
                            fullNodeAct,
                            fullNodeAct,
                            rawNode[2] || ''
                        );
                    }
                }
            }
            return initialList;
        }

        function fetchAndMergeStreamAuthorVideos(curUrl, cleanAuthor) {
            if (!curUrl) return Promise.resolve(streamAuthorOnlyVideos);
            var reqPromise = invoke('get_stream_author_videos', {
                url: curUrl,
                author: cleanAuthor
            }).then(function(authorItems) {
                if (!Array.isArray(authorItems) || !authorItems.length) return streamAuthorOnlyVideos;
                var seenUrls = {};
                streamAuthorOnlyVideos.forEach(function(v) {
                    var k = normalizeAuthorVideoDedupKey(v && (v.url || v.action));
                    if (k) seenUrls[k] = true;
                });
                for (var j = 0; j < authorItems.length; j++) {
                    var raw = authorItems[j];
                    if (!raw) continue;
                    var vUrl = Array.isArray(raw) ? raw[3] : (raw.video_url || raw.url || '');
                    var vTitle = Array.isArray(raw) ? raw[0] : (raw.title || '');
                    var vAuthor = Array.isArray(raw) ? raw[1] : (raw.author || '');
                    var vCover = Array.isArray(raw) ? raw[2] : (raw.cover_url || raw.cover || '');
                    if (!vUrl) continue;
                    var cleanBase = normalizeAuthorVideoDedupKey(vUrl);
                    if (!cleanBase || seenUrls[cleanBase]) continue;
                    seenUrls[cleanBase] = true;
                    var aName = String(vAuthor || cleanAuthor || '创作者').replace(/^@+/, '').trim();
                    var fullAction = String(vUrl).indexOf('douyin:') === 0 ? String(vUrl) : ('douyin:' + vUrl);
                    streamAuthorOnlyVideos.push({
                        title: vTitle || '作者视频',
                        sub: '@' + aName,
                        url: fullAction,
                        action: fullAction,
                        img: vCover || ''
                    });
                }
                return streamAuthorOnlyVideos;
            }).catch(function() {
                return streamAuthorOnlyVideos;
            });
            streamAuthorFetchPromise = reqPromise;
            return reqPromise;
        }

        function updateFsStreamMenuUI() {
            var btn = document.getElementById('fsStreamAuthorOnlyBtn');

            var curSub = (activePreviewMeta && activePreviewMeta.sub) ? activePreviewMeta.sub : currentHudSub;

            var curUrl = (activePreviewMeta && activePreviewMeta.url) ? activePreviewMeta.url : (currentBgUrl || currentPlayingStream || '');
            var curTitle = (activePreviewMeta && activePreviewMeta.title) ? activePreviewMeta.title : currentHudTitle;
            var curSub = (activePreviewMeta && activePreviewMeta.sub) ? activePreviewMeta.sub : currentHudSub;
            var cleanAuthor = extractCleanAuthorName(curSub);
            if (streamAuthorOnlyVideos.length === 0 || streamAuthorOnlyName !== cleanAuthor) {
                streamAuthorOnlyName = cleanAuthor;
                streamAuthorOnlyVideos = buildInitialAuthorVideoList(curUrl, curTitle, curSub, cleanAuthor);
                streamAuthorOnlyIndex = 0;
            }
            if (streamAuthorOnlyVideos.length <= 1 && curUrl) {
                fetchAndMergeStreamAuthorVideos(curUrl, cleanAuthor);
            }
            return true;
        }

        function closeFsStreamMenu() {
            if (!fsStreamMenuOpen) return;
            fsStreamMenuOpen = false;
            var hud = document.getElementById('fsStreamMenuHud');
            if (hud) {
                hud.classList.remove('visible');
                hud.setAttribute('aria-hidden', 'true');
            }
        }

        function toggleFsStreamMenu() {
            if (fsStreamMenuOpen) {
                closeFsStreamMenu();
                return true;
            }
            return openFsStreamMenu();
        }

        function toggleStreamAuthorOnlyMode() {
            streamAuthorOnlyActive = !streamAuthorOnlyActive;
            var curUrl = (activePreviewMeta && activePreviewMeta.url) ? activePreviewMeta.url : (currentBgUrl || currentPlayingStream || '');
            var curTitle = (activePreviewMeta && activePreviewMeta.title) ? activePreviewMeta.title : currentHudTitle;
            var curSub = (activePreviewMeta && activePreviewMeta.sub) ? activePreviewMeta.sub : currentHudSub;
            var cleanAuthor = extractCleanAuthorName(curSub);
            streamAuthorOnlyName = cleanAuthor;
            updateFsStreamMenuUI();

            if (!streamAuthorOnlyActive) {
                streamAuthorOnlyVideos = [];
                streamAuthorOnlyIndex = 0;
                streamAuthorFetchPromise = null;
                return;
            }

            if (streamAuthorOnlyVideos.length === 0) {
                streamAuthorOnlyVideos = buildInitialAuthorVideoList(curUrl, curTitle, curSub, cleanAuthor);
                streamAuthorOnlyIndex = 0;
            } else {
                var curKey = normalizeAuthorVideoDedupKey(curUrl);
                var idx = streamAuthorOnlyVideos.findIndex(function(v) {
                    return normalizeAuthorVideoDedupKey(v && (v.url || v.action)) === curKey;
                });
                streamAuthorOnlyIndex = idx !== -1 ? idx : 0;
            }

            fetchAndMergeStreamAuthorVideos(curUrl, cleanAuthor);
        }

        function handleFsStreamMenuKey(key) {
            if (!fsStreamMenuOpen) return false;
            if (key === 'Escape' || key === 'Backspace') {
                closeFsStreamMenu();
                return true;
            }
            if (key === 'ArrowUp') {
                closeFsStreamMenu();
                switchFullScreenVideo(1);
                return true;
            }
            if (key === 'ArrowDown') {
                closeFsStreamMenu();
                switchFullScreenVideo(-1);
                return true;
            }
            if (key === 'Enter' || key === ' ') {
                toggleStreamAuthorOnlyMode();
                return true;
            }
            return true;
        }

        (function bindFsStreamMenuEvents() {
            var btn = document.getElementById('fsStreamAuthorOnlyBtn');
            if (btn) {
                btn.addEventListener('click', function(ev) {
                    ev.stopPropagation();
                    toggleStreamAuthorOnlyMode();
                });
            }
        })();

        function handleFsEpisodePickerKey(key) {
            if (!fsEpisodePickerOpen) return false;
            var allEps = SERIES_GROUPS[fsEpPickerSeriesKey] || [];
            var seasonEps = allEps.filter(function(e) { return e.season === fsEpPickerSeasonNum; });
            var epCount = seasonEps.length;

            if (key === 'Escape' || key === 'Backspace' || key === 'ArrowUp' || key === 'ArrowDown') {
                closeFsEpisodePicker();
                return true;
            }
            if (key === 'ArrowLeft') {
                if (fsEpFocusZone === 'nextSeason') {
                    fsEpFocusZone = 'ep';
                    fsEpFocusIndex = Math.max(0, epCount - 1);
                } else if (fsEpFocusZone === 'ep') {
                    if (fsEpFocusIndex > 0) {
                        fsEpFocusIndex--;
                    } else {
                        fsEpFocusZone = 'prevSeason';
                    }
                } else if (fsEpFocusZone === 'prevSeason') {
                    switchFsEpPickerSeason(-1);
                    return true;
                }
                updateFsEpPickerFocusVisuals();
                return true;
            }
            if (key === 'ArrowRight') {

        function animateSettingsListScrollTo(listGroup, targetTop, immediate) {

            }
            if (listGroup.__fcScrollRafId) return;
            var lastTs = performance.now();
            function stepScrollFrame(nowTs) {
                var dt = Math.min(48, Math.max(4, nowTs - lastTs));

        function handleSettingsModalDirectionKey(key) {
            var rows = getSettingsModalRows();
            if (!rows.length) return false;
            var activeEl = modalFocusList[modalFocusIdx] || rows[0][0];
            var curRowIdx = 0;
            var curColIdx = 0;
            for (var r = 0; r < rows.length; r++) {
                var c = rows[r].indexOf(activeEl);
                if (c !== -1) {
                    curRowIdx = r;
                    curColIdx = c;
                    break;
                }
            }

            if (key === 'ArrowDown' || key === 'ArrowUp') {
                var stepR = (key === 'ArrowDown') ? 1 : -1;
                var nextRowIdx = (curRowIdx + stepR + rows.length) % rows.length;
                var nextRow = rows[nextRowIdx];
                var targetEl = nextRow[Math.min(curColIdx, nextRow.length - 1)] || nextRow[0];
                var tIdx = modalFocusList.indexOf(targetEl);
                if (tIdx !== -1) {
                    setModalFocus(tIdx);
                    if (settingsCurrentLevel === 1) settingsLastLevel1Idx = tIdx;
                    else if (settingsCurrentLevel === 2 && settingsActiveCategory) settingsLastLevel2IdxMap[settingsActiveCategory] = tIdx;
                }
                return true;
            }

            if (key === 'ArrowLeft' || key === 'ArrowRight') {
                var stepC = (key === 'ArrowRight') ? 1 : -1;
                if (settingsCurrentLevel === 2 && activeEl && activeEl.getAttribute('data-item-type') === 'status') {
                    stepNonFillableSetting(activeEl.getAttribute('data-item-id'), stepC);
                    return true;
                }
                if (settingsCurrentLevel === 2 && activeEl && activeEl.getAttribute('data-item-type') === 'fillable' && key === 'ArrowRight') {
                    settingsLastLevel2IdxMap[settingsActiveCategory] = curRowIdx;
                    openSettingsLevel3(activeEl.getAttribute('data-item-id'));
                    return true;
                }
                if (settingsCurrentLevel === 2 && key === 'ArrowLeft') {
                    handleSettingsBackNavigation();
                    return true;
                }
                if (settingsCurrentLevel === 1 && activeEl && activeEl.classList.contains('settings-nav-row-btn') && key === 'ArrowRight') {
                    settingsLastLevel1Idx = modalFocusIdx;
                    openSettingsLevel2(activeEl.getAttribute('data-settings-cat'));
                    return true;
                }
                var curRow = rows[curRowIdx];
                if (curRow && curRow.length > 1) {
                    var nextColIdx = curColIdx + stepC;
                    if (nextColIdx >= 0 && nextColIdx < curRow.length) {
                        var horizTarget = curRow[nextColIdx];
                        var hIdx = modalFocusList.indexOf(horizTarget);
                        if (hIdx !== -1) setModalFocus(hIdx);
                    }
                }
                return true;
            }
            return false;
        }

        function scrollSeasonPillIntoView(pillEl) {
            if (!pillEl) return;
            var viewport = document.getElementById('seasonPillsViewport');

            if (!viewport || !track || !track.contains(pillEl)) return;
            var vpWidth = viewport.clientWidth - 52;
            var totalWidth = track.scrollWidth;
            if (vpWidth <= 0 || totalWidth <= vpWidth) {
                track.style.transform = 'translate3d(0px, 0, 0)';
                return;
            }
            var pillLeft = pillEl.offsetLeft;
            var pillWidth = pillEl.offsetWidth;
            var pillCenter = pillLeft + pillWidth / 2;
            var targetScroll = pillCenter - vpWidth / 2;
            var maxScroll = Math.max(0, totalWidth - vpWidth + 16);
            var clampedScroll = Math.max(0, Math.min(maxScroll, targetScroll));
            if (parseInt(pillEl.getAttribute('data-col') || '1') <= 1) {
                clampedScroll = 0;
            }

        function fetchTMDBLogo(title, callback) {
            var cleanTitle = title.replace(/(HD|FHD|4K|1080p|720p)/ig, '').trim();
            if (!cleanTitle) return callback(null);
            var ignoreList = ["有线电视", "流媒体", "抖音", "刷新推荐流", "正在加载推荐内容...", "正在加载抖音精选...", "正在刷新推荐流...", "系统设置", "设置", "有线频道", "现在观看", "正在观看", "很酷 TV+", "很酷 TV+ 剧集", "很酷 TV+ 电影", "暂无观看记录", "暂无视频内容", "最新剧集与热门电影", "热门剧集与番剧", "热门院线与高分电影", "私密空间", "限制级", "点击配置本地影视库", "点击配置剧集资源位置", "点击配置电影资源位置", "文件夹为空"];
            if (ignoreList.indexOf(cleanTitle) !== -1 || cleanTitle.indexOf('正在刷新') === 0 || cleanTitle.indexOf('正在加载') === 0 || /^很酷\s*TV\+/i.test(cleanTitle)) return callback(null);
            if (tmdbLogoCache[cleanTitle] !== undefined) {
                var cachedLogo = tmdbLogoCache[cleanTitle];
                if (cachedLogo && cachedLogo.indexOf('http') === 0 && cachedLogo.indexOf('http://127.0.0.1:8765/') !== 0) {
                    cacheRemoteImageLocal(cachedLogo, false, function(localLogoUrl) {
                        tmdbLogoCache[cleanTitle] = localLogoUrl;
                        try { localStorage.setItem('tmdb_logo_cache', JSON.stringify(tmdbLogoCache)); } catch(e){}
                        scheduleSavePersistentMetadata();
                    });
                }
                return callback(cachedLogo ? resolveCachedImageUrl(cachedLogo) : null);
            }

            var apiKey = globalConfig.api.tmdb_api_key || 'f7762624a95e4c3823500736d40162cd';
            fetch('https://api.themoviedb.org/3/search/multi?api_key=' + apiKey + '&language=zh-CN&query=' + encodeURIComponent(cleanTitle))
                .then(res => res.json())
                .then(data => {
                    if (data.results && data.results.length > 0) {
                        var item = data.results[0]; var type = item.media_type === 'movie' ? 'movie' : 'tv';
                        return fetch('https://api.themoviedb.org/3/' + type + '/' + item.id + '/images?api_key=' + apiKey);
                    } else { throw new Error('Not found'); }
                })
                .then(res => res.json())
                .then(data => {
                    if (data && data.logos && data.logos.length > 0) {
                        var bestLogo = data.logos.find(l => l.iso_639_1 === 'zh') || data.logos.find(l => l.iso_639_1 === 'en') || data.logos[0];
                        var logoUrl = 'https://image.tmdb.org/t/p/w500' + bestLogo.file_path;
                        tmdbLogoCache[cleanTitle] = logoUrl;
                        localStorage.setItem('tmdb_logo_cache', JSON.stringify(tmdbLogoCache));
                        scheduleSavePersistentMetadata();
                        cacheRemoteImageLocal(logoUrl, false, function(localLogoUrl) {
                            tmdbLogoCache[cleanTitle] = localLogoUrl;
                            try { localStorage.setItem('tmdb_logo_cache', JSON.stringify(tmdbLogoCache)); } catch(e){}
                            scheduleSavePersistentMetadata();
                        });
                        callback(resolveCachedImageUrl(logoUrl));
                    } else { throw new Error('No logo'); }

        function findSeasonPillInAdjacentRow(currentPill, dir) {
            var seasonBar = document.getElementById('seasonBar');
            if (!seasonBar || !seasonBar.classList.contains('active') || seasonBar.classList.contains('single-line-mode') || !currentPill) return null;
            var pills = Array.from(seasonBar.querySelectorAll('.season-pill.focusable'));
            if (pills.length <= 1) return null;

            var rowGroups = [];
            for (var i = 0; i < pills.length; i++) {
                var p = pills[i];
                var rect = p.getBoundingClientRect();
                var centerY = rect.top + rect.height / 2;
                var centerX = rect.left + rect.width / 2;
                var matchedGroup = null;
                for (var g = 0; g < rowGroups.length; g++) {
                    if (Math.abs(rowGroups[g].centerY - centerY) <= 16) {
                        matchedGroup = rowGroups[g];
                        break;
                    }
                }
                if (!matchedGroup) {
                    matchedGroup = { centerY: centerY, items: [] };
                    rowGroups.push(matchedGroup);
                }
                matchedGroup.items.push({ el: p, centerX: centerX, centerY: centerY });
            }

            if (rowGroups.length <= 1) return null;
            rowGroups.sort(function(a, b) { return a.centerY - b.centerY; });

            var curRowIdx = -1;
            var curCenterX = 0;
            for (var r = 0; r < rowGroups.length; r++) {
                for (var k = 0; k < rowGroups[r].items.length; k++) {
                    if (rowGroups[r].items[k].el === currentPill) {
                        curRowIdx = r;
                        curCenterX = rowGroups[r].items[k].centerX;
                        break;
                    }
                }
                if (curRowIdx !== -1) break;
            }

            if (curRowIdx === -1) return null;
            var targetRowIdx = curRowIdx + dir;
            if (targetRowIdx < 0 || targetRowIdx >= rowGroups.length) return null;

            var targetItems = rowGroups[targetRowIdx].items;
            var bestEl = targetItems[0].el;
            var bestDist = Infinity;
            for (var m = 0; m < targetItems.length; m++) {
                var dist = Math.abs(targetItems[m].centerX - curCenterX);
                if (dist < bestDist) {
                    bestDist = dist;
                    bestEl = targetItems[m].el;
                }
            }
            return bestEl;
        }

        function fetchGithubConfigOnline(forceOverwriteCache) {
            var cachedConfigStr = localStorage.getItem('fc_github_config_cache') || localStorage.getItem('fc_cached_github_config_v1');
            var cachedSyncTime = localStorage.getItem('fc_github_sync_time') || '未记录';
            return fetch(CONFIG_URL + "?t=" + new Date().getTime())
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(data => {
                    var nowTimeStr = formatDateTimeNow();
                    var jsonStr = JSON.stringify(data);
                    localStorage.setItem('fc_github_config_cache', jsonStr);
                    localStorage.setItem('fc_cached_github_config_v1', jsonStr);
                    localStorage.setItem('fc_github_sync_time', nowTimeStr);
                    applyGithubConfigData(data, true, nowTimeStr, !!forceOverwriteCache);
                })
                .catch(e => {
                    currentSyncStatusText = cachedConfigStr ? (cachedSyncTime + '（离线缓存 · 网络异常）') : '无缓存（网络异常）';
                    updateLevel2StatusTexts();
                    var syncEl = document.getElementById('githubSyncStatusText');
                    if (syncEl) {
                        syncEl.className = 'sync-status-time offline';
                        syncEl.innerText = currentSyncStatusText;
                    }
                });
        }

        function initApp() {
            // 任务 11 (Round 26)：启动时加载磁盘持久化缓存的影视评分、介绍、TMDB Logo、封面图、IPTV 台标与用户头像映射
            loadPersistentMetadataFromDisk(function() {
                var savedAv = localStorage.getItem('cache_user_avatar');
                if (savedAv) {
                    var avEl = document.getElementById('uiAvatar');
                    if (avEl) avEl.src = resolveCachedImageUrl(savedAv);
                }
                scrapeCoolTvLibraries(false);
            });
            syncNowWatchingRowData(false);
            scrapeCoolTvLibraries(false);
            // 任务 1 (Round 10 & Round 17) & 任务 5 (Round 25)：启动时拉取推荐流并采用节流轮询（首屏满额后自动休眠定时器，杜绝后台无限 IPC 轮询堆积）
            loadDouyinNativeFeed(false, false);
            if (!douyinPollTimer) {
                douyinPollTimer = setInterval(() => loadDouyinNativeFeed(false, false), 750);
            }

            // 1. 先读取本地缓存的 GitHub 配置以确保离线秒开
            var cachedConfigStr = localStorage.getItem('fc_github_config_cache') || localStorage.getItem('fc_cached_github_config_v1');
            var cachedSyncTime = localStorage.getItem('fc_github_sync_time') || '未记录';
            if (cachedConfigStr) {
                try {
                    applyGithubConfigData(JSON.parse(cachedConfigStr), false, cachedSyncTime, false);
                } catch (_) {}
            }

            // 2. 网络通畅时拉取最新 GitHub 配置并更新缓存与时间戳
            fetchGithubConfigOnline(false);

            // 3. 加载 EPG 节目单并定时更新
            refreshEpgFromBackend();
            setInterval(refreshEpgFromBackend, 5 * 60 * 1000);

            // 4. 任务 8 (Round 19)：取消定时气象速报，仅保留实时降水、高湿、灾害预警等即时气象信息轮询
            setTimeout(() => pollWeatherBroadcast(), 3500);
            setInterval(() => pollWeatherBroadcast(), 2 * 60 * 1000);

            // 问题 8 (Round 22) & 任务 3 (Round 28) & 任务 4, 8 (Round 29) & 任务 3 (Round 30)：每次启动 APP 时，若开启“始终隐藏”（含左侧与顶部侧边栏）则先渲染“现在观看/正在观看”轨道并将焦点落在第一个卡片以保持侧边栏隐藏，其余模式焦点落在“现在观看/正在观看”侧边栏项；仅当存在播放历史时自动播放上次退出时最后播放的内容
            setTimeout(() => {
                if (appSettings.sidebarMode === 'alwayshide') {
                    sidebarForceHiddenByMenu = true;
                    lastRowColMap[7] = 1;
                    renderTrack(7);
                    var firstWatchEl = findTargetFocusable(7, 1) || document.getElementById('navNowPlayingItem');
                    if (firstWatchEl) setFocus(firstWatchEl);
                } else {
                    var initial = document.getElementById('navNowPlayingItem') || document.querySelector('.focusable[data-row="7"][data-col="0"]');
                    if (initial) setFocus(initial);
                }
            }, 100);
            setTimeout(() => document.body.classList.remove('preload'), 250);
        }

        initApp();
    </script>
</body>
