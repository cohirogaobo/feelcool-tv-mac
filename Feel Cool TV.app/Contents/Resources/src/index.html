<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>很酷TV</title>
    <style>
        @font-face {
            font-family: 'DouyinMeihaoti';
            src: url('./assets/DouyinMeihaoti.otf') format('opentype'),
                 url('assets/DouyinMeihaoti.otf') format('opentype'),
                 local('抖音美好体'),
                 local('Douyin Sans Bold'),
                 local('Douyin Sans');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }
        @font-face {
            font-family: 'DouyinMeihaoti';
            src: url('./assets/DouyinMeihaoti.otf') format('opentype'),
                 url('assets/DouyinMeihaoti.otf') format('opentype'),
                 local('抖音美好体'),
                 local('Douyin Sans Bold'),
                 local('Douyin Sans');
            font-weight: bold;
            font-style: normal;
            font-display: block;
        }
        .douyin-font {
            font-family: 'DouyinMeihaoti', '抖音美好体', 'Douyin Sans Bold', 'Douyin Sans', -apple-system, BlinkMacSystemFont, sans-serif !important;
            font-weight: 700;
            letter-spacing: 0.2px;
        }
        .inline-bili-logo {
            display: inline-block;
            height: 1.04em;
            width: auto;
            vertical-align: -0.14em;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
        }
        /* 任务 3 (Round 21) & 问题 2 & 4 (Round 22) & 任务 10 (Round 23)：很酷 TV+ Logo 与 bilibili Logo 内联显示，确保很酷 TV+ 与后方“剧集/电影”二字视觉大小一致且不过大 */
        .inline-cooltv-logo {
            display: inline-block;
            height: 0.97em;
            width: auto;
            vertical-align: -0.11em;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
        }
        .main-title .inline-bili-logo,
        .main-title .inline-cooltv-logo,
        .iptv-hud-title .inline-bili-logo,
        .iptv-hud-title .inline-cooltv-logo {
            opacity: 1;
        }
        .brand-title .inline-bili-logo,
        .brand-title .inline-cooltv-logo {
            opacity: 0.7;
        }
        .sub-title .inline-bili-logo,
        .sub-title .inline-cooltv-logo,
        .iptv-hud-sub .inline-bili-logo,
        .iptv-hud-sub .inline-cooltv-logo {
            opacity: 0.78;
        }
        .card-meta .inline-bili-logo,
        .card-meta .inline-cooltv-logo {
            opacity: 0.55;
        }
        .season-pill .inline-bili-logo,
        .season-pill .inline-cooltv-logo {
            opacity: 0.75;
            transition: opacity 0.22s ease, filter 0.22s ease;
        }
        .season-pill .inline-bili-logo {
            height: 1.08em;
            vertical-align: -0.15em;
            margin-right: 0;
        }
        .season-pill .inline-cooltv-logo {
            height: 0.97em;
            vertical-align: -0.11em;
            margin-right: 0;
        }
        .season-pill.current:not(.focused):not(:focus) .inline-bili-logo,
        .season-pill.current:not(.focused):not(:focus) .inline-cooltv-logo {
            opacity: 0.85;
        }
        .season-pill.focused .inline-bili-logo,
        .season-pill:focus .inline-bili-logo,
        .season-pill.focused .inline-cooltv-logo,
        .season-pill:focus .inline-cooltv-logo,
        .btn:focus .inline-bili-logo,
        .btn.modal-focused .inline-bili-logo,
        .btn:focus .inline-cooltv-logo,
        .btn.modal-focused .inline-cooltv-logo {
            opacity: 1 !important;
            filter: invert(1) brightness(0.08);
        }
        :root { --glass-bg: rgba(28, 28, 30, 0.55); --glass-border: rgba(255, 255, 255, 0.08); --animation-speed: 0.3s; --overlay-bg-inner: rgba(16, 20, 28, 0.76); --overlay-bg-outer: rgba(6, 8, 12, 0.88); }
        /* 任务 5 (Round 20)：窗口模式下允许鼠标指针可见；全屏模式（html.app-cursor-hidden）继续严格执行鼠标指针不可见 */
        html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #000 !important; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif; overflow: hidden !important; user-select: none; position: fixed; -webkit-font-smoothing: antialiased; }
        *, *::before, *::after { scrollbar-width: none !important; -webkit-user-drag: none; }
        ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
        .preload *:not(#appBootSplash):not(#appBootSplash *) { transition: none !important; animation: none !important; }
        
        .window-drag-bar { position: fixed; top: 0; left: 0; right: 0; height: 34px; z-index: 9000; }
        html.app-cursor-hidden, html.app-cursor-hidden *, html.app-cursor-hidden *::before, html.app-cursor-hidden *::after { cursor: none !important; }

        /* 任务 4 (Round 9) & 任务 5 (Round 10) & 任务 9 (Round 21)：整点和半点前一分钟开始显示右上角无底框时钟，调高文字阴影模糊半径使阴影柔化不突兀聚集 */
        .top-right-clock { position: fixed; top: 28px; right: 40px; z-index: 80; background: transparent; border: none; padding: 0; font-size: 25px; font-weight: 700; color: rgba(255, 255, 255, 0.95); letter-spacing: 1.2px; opacity: 0; transform: translateY(-8px); transition: opacity 0.4s ease, transform 0.4s ease; pointer-events: none; text-shadow: 0 4px 28px rgba(0, 0, 0, 0.62), 0 2px 16px rgba(0, 0, 0, 0.44); }
        .top-right-clock.visible { opacity: 1; transform: translateY(0); }

        /* 任务 12 (Round 18) & 任务 6 (Round 30)：气象信息轻微调大字号（33px / 27px），并根据顶部侧边栏显隐状态动态下移避让顶部胶囊侧边栏 */
        .jp-weather-telop {
            position: fixed;
            top: var(--telop-top, 48px);
            left: 50%;
            transform-origin: top center;
            transform: translateX(-50%) translateY(-8px) scale(var(--telop-scale, 1));
            width: min(900px, 75vw);
            min-width: 560px;
            z-index: 95;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
            font-size: 33px;
            font-weight: 700;
            letter-spacing: 1.6px;
            line-height: 1.35;
            color: #ffffff;
            white-space: nowrap;
            opacity: 0;
            transition: top 0.36s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1), transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            -webkit-font-smoothing: antialiased;
            text-shadow:
                -2px -2px 0 #000,
                 2px -2px 0 #000,
                -2px  2px 0 #000,
                 2px  2px 0 #000,
                 0px -2px 0 #000,
                 0px  2px 0 #000,
                -2px  0px 0 #000,
                 2px  0px 0 #000,
                 0px  4px 10px rgba(0, 0, 0, 0.88);
        }
        .jp-weather-telop.top-bar-avoid {
            top: var(--telop-top-with-bar, 118px);
        }
        .jp-weather-telop.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(var(--telop-scale, 1));
        }
        .jp-telop-row1 {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            width: 100%;
            gap: 28px;
        }
        /* 任务 2 (Round 14)：气象信息的色彩下划线置于文字后方（isolation: isolate + z-index: -1），避免遮挡文字 */
        #telopMainText {
            position: relative;
            display: inline-block;
            padding: 0 3px;
            z-index: 1;
            isolation: isolate;
        }
        #telopMainText::after {
            content: '';
            position: absolute;
            left: -2px;
            right: -2px;
            bottom: 2px;
            height: 12px;
            border-radius: 5px;
            background: var(--telop-underline-color, rgba(10, 132, 255, 0.72));
            pointer-events: none;
            z-index: -1;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.32);
        }
        .jp-telop-row2 {
            display: flex;
            align-items: baseline;
            justify-content: flex-end;
            width: 100%;
            font-size: 27px;
            letter-spacing: 2px;
        }

        /* 任务 2 & 3 (Round 9) & 任务 8 (Round 18)：正式播放画面底部全宽黑色渐变透明遮罩，最底部黑色部分增加些许透明度柔化视觉体验 */
        .iptv-fullscreen-hud {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            z-index: 92;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.72) 0%, rgba(0, 0, 0, 0.42) 54%, rgba(0, 0, 0, 0) 100%);
            padding: 84px 58px 40px 58px;
            box-sizing: border-box;
            color: #fff;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .iptv-fullscreen-hud.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* 任务 7 & 8 (Round 18)：本地剧集正式播放期间按 F16 在底部唤出选集列表，采用与进度条一致的柔化黑色透明渐变遮罩 + 横向排布集数按钮 + 左右 SVG 季切换箭头 */
        .fs-episode-picker-hud {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            z-index: 94;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.72) 0%, rgba(0, 0, 0, 0.42) 54%, rgba(0, 0, 0, 0) 100%);
            padding: 90px 58px 42px 58px;
            box-sizing: border-box;
            color: #fff;
            opacity: 0;
            visibility: hidden;
            transform: translateY(14px);
            transition: opacity 0.28s cubic-bezier(0.22, 1, 0.36, 1), transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.28s ease;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            gap: 14px;
        }
        .fs-episode-picker-hud.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
            pointer-events: auto;
        }
        .fs-ep-picker-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            padding: 0 4px;
        }
        .fs-ep-picker-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.4px;
            color: rgba(255, 255, 255, 0.96);
            text-shadow: 0 4px 26px rgba(0, 0, 0, 0.50), 0 2px 12px rgba(0, 0, 0, 0.30);
        }
        .fs-ep-picker-season-meta {
            font-size: 15px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.72);
            margin-left: 12px;
            text-shadow: 0 3px 20px rgba(0, 0, 0, 0.45), 0 1px 10px rgba(0, 0, 0, 0.26);
        }
        .fs-ep-picker-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
        }
        /* 任务 1 (Round 31)：选集列表按钮 (.fs-ep-item-btn) 与季切换箭头 (.fs-ep-season-arrow) 全面适配原生 Liquid Glass 设计 */
        .fs-ep-season-arrow {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            -apple-visual-effect: -apple-system-glass-material-clear;
            color-scheme: dark;
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border: none !important;
            box-shadow: none !important;
            color: rgba(255, 255, 255, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            outline: none;
            overflow: hidden;
            transform: translateZ(0);
            transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }
        body.liquid-glass-light .fs-ep-season-arrow:not(.focused):not(:focus),
        body.liquid-glass-light .fs-ep-item-btn:not(.focused):not(:focus) {
            color-scheme: light;
        }
        .fs-ep-season-arrow svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            display: block;
        }
        .fs-ep-season-arrow.disabled {
            opacity: 0.35;
        }
        .fs-ep-season-arrow.focused {
            -apple-visual-effect: none !important;
            background: #ffffff !important;
            color: #000000 !important;
            transform: scale(1.10);
            box-shadow: 0 10px 34px rgba(0, 0, 0, 0.34), 0 4px 16px rgba(0, 0, 0, 0.20) !important;
        }
        /* 任务 9 (Round 44)：修复选集列表左右第一项集数按钮被静态边缘渐变遮罩与溢出裁切形成阴影遮挡的问题：
           移除常驻左右 12px 黑色透明遮罩，扩充上下阴影缓冲内边距（38px），仅在轨道实际产生左/右滚动位移时动态施加边缘渐隐 */
        .fs-ep-list-viewport {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            padding: 38px 14px;
            margin: -38px -6px;
            -webkit-mask-image: none;
            mask-image: none;
        }
        .fs-ep-list-viewport.has-scroll-left:not(.has-scroll-right) {
            -webkit-mask-image: linear-gradient(to right, transparent 0px, black 18px, black 100%);
            mask-image: linear-gradient(to right, transparent 0px, black 18px, black 100%);
        }
        .fs-ep-list-viewport.has-scroll-right:not(.has-scroll-left) {
            -webkit-mask-image: linear-gradient(to right, black 0px, black calc(100% - 18px), transparent 100%);
            mask-image: linear-gradient(to right, black 0px, black calc(100% - 18px), transparent 100%);
        }
        .fs-ep-list-viewport.has-scroll-left.has-scroll-right {
            -webkit-mask-image: linear-gradient(to right, transparent 0px, black 18px, black calc(100% - 18px), transparent 100%);
            mask-image: linear-gradient(to right, transparent 0px, black 18px, black calc(100% - 18px), transparent 100%);
        }
        /* 任务 3 (Round 24)：清除“短视频选项”左侧渐变遮罩残余，避免单按钮放大或高亮时左侧出现暗影裁切 */
        #fsStreamMenuViewport {
            overflow: visible !important;
            padding: 8px 4px !important;
            margin: -8px -4px !important;
            -webkit-mask-image: none !important;
            mask-image: none !important;
        }
        .fs-ep-list-track {
            display: flex;
            align-items: center;
            gap: 12px;
            width: max-content;
            transform: translate3d(0, 0, 0);
            transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }
        .fs-ep-item-btn {
            height: 44px;
            padding: 0 22px;
            border-radius: 999px;
            -apple-visual-effect: -apple-system-glass-material-clear;
            color-scheme: dark;
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border: none !important;
            box-shadow: none !important;
            color: rgba(255, 255, 255, 0.90);
            font-size: 15px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            flex-shrink: 0;
            outline: none;
            overflow: hidden;
            transform: translateZ(0);
            transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        }
        .fs-ep-item-btn.current:not(.focused):not(:focus) {
            background: rgba(255, 255, 255, 0.16) !important;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.36) !important;
            color: #ffffff;
        }
        .fs-ep-item-btn.focused {
            -apple-visual-effect: none !important;
            background: #ffffff !important;
            color: #000000 !important;
            transform: scale(1.07);
            box-shadow: 0 10px 34px rgba(0, 0, 0, 0.34), 0 4px 16px rgba(0, 0, 0, 0.20) !important;
        }
        /* 任务 6 (Round 26)：通过扩大阴影所在容器的 padding + 对称负 margin 扩充离屏光栅化与 mask 边界，保持模糊值不变的同时彻底消除标题背景半透明黑色矩形裁切框 */
        .iptv-hud-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 0.4px;
            line-height: 1.25;
            padding: 38px 42px;
            margin: -38px -42px -32px -42px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 76%;
            text-shadow: 0 4px 28px rgba(0, 0, 0, 0.52), 0 2px 14px rgba(0, 0, 0, 0.32);
        }
        /* 任务 1 (Round 14) & 任务 2 (Round 15) & 任务 6 (Round 26)：文字滚动时左侧也增加渐变透明效果，同时上下预留充足内边距避免大半径文字阴影被 mask 盒裁切成半透明矩形底框 */
        .iptv-hud-title.single-line-marquee {
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: clip;
            max-width: 76%;
            padding: 38px 42px 38px 26px;
            margin: -38px -42px -32px -26px;
            transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            -webkit-mask-image: linear-gradient(to right, transparent 0px, black 26px, black 93%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0px, black 26px, black 93%, transparent 100%);
        }
        .iptv-hud-sub {
            font-size: 20px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.35;
            padding: 32px 36px;
            margin: -32px -36px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 76%;
            text-shadow: 0 4px 24px rgba(0, 0, 0, 0.48), 0 2px 12px rgba(0, 0, 0, 0.30);
        }
        .fs-progress-wrap {
            margin-top: 18px;
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
        }
        .fs-progress-wrap.active {
            display: flex;
        }
        .fs-progress-row {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
        }
        /* 任务 2 (Round 30)：轻微放大正式播放页面的播放状态按钮（34px -> 42px，图标 18px -> 22px），并赋予 macOS 27 原生 Liquid Glass 液态玻璃设计 */
        .fs-play-state-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            -apple-visual-effect: -apple-system-glass-material-clear;
            color-scheme: dark;
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border: none !important;
            box-shadow: none !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #fff;
            overflow: hidden;
            transform: translateZ(0);
            transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .fs-play-state-btn.liquid-light {
            color-scheme: light;
        }
        .fs-play-state-btn.liquid-dark {
            color-scheme: dark;
        }
        .fs-play-state-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            display: block;
            filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.38));
        }
        /* 任务 2 (Round 21)：取消亮度符号的按钮样式容器，直接显示亮度符号 */
        .tv-brightness-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0;
            color: rgba(255, 255, 255, 0.96);
        }
        .tv-brightness-icon svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            display: block;
            filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.44)) drop-shadow(0 2px 8px rgba(0, 0, 0, 0.26));
        }
        #tvBrightnessFill {
            transition: width 0.04s ease-out;
        }
        #tvBrightnessThumb {
            transition: left 0.04s ease-out, transform 0.15s ease;
        }
        .fs-progress-track {
            position: relative;
            flex: 1;
            height: 7px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.24);
            overflow: visible;
            cursor: pointer;
        }
        .fs-progress-fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0%;
            border-radius: 999px;
            background: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.42), 0 2px 14px rgba(0, 0, 0, 0.28);
            transition: width 0.08s linear;
        }
        .fs-progress-thumb {
            position: absolute;
            top: 50%;
            left: 0%;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #ffffff;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.40), 0 0 14px rgba(255, 255, 255, 0.35);
            transition: left 0.08s linear, transform 0.18s ease;
        }
        .fs-progress-wrap.scrubbing .fs-progress-thumb {
            transform: translate(-50%, -50%) scale(1.32);
        }
        .fs-time-label {
            font-size: 16px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: rgba(255, 255, 255, 0.92);
            min-width: 118px;
            text-align: right;
            flex-shrink: 0;
            letter-spacing: 0.5px;

        /* 任务 1 & 10 & 14 (Round 26) & 任务 6 (Round 27) & 任务 2, 3, 4, 8 (Round 29)：
           1) 左侧边栏与屏幕边缘间距、侧边栏内按钮与侧边栏边缘间距、按钮内文字/图标与按钮边缘间距轻微缩小，进一步提高屏幕空间利用率；

           3) 支持 Liquid Glass 浅色 (light) 与深色 (dark) 两种原生外观模式；
           4) 支持全新“顶部侧边栏” (.sidebar.top-bar) 居中长连贯药丸胶囊设计，无任何折叠或隐藏逻辑，始终显示。 */
        .sidebar {
            position: fixed;
            left: 14px;
            top: 14px;

            background: linear-gradient(165deg, rgba(30, 33, 42, 0.34) 0%, rgba(16, 18, 24, 0.24) 52%, rgba(12, 14, 20, 0.30) 100%);

        /* 任务 4 (Round 28) & 任务 2 (Round 29)：macOS 27 Golden Gate 100% 原生 Liquid Glass（液态玻璃）侧边栏设计方案，原生支持深色 (dark) 与浅色 (light) 两种模式 */
        .sidebar.liquid-glass {

            background: transparent !important;
            backdrop-filter: none !important;

        .sidebar-focus-pill {

        .sidebar-header.pressing, .nav-item.pressing { transform: scale3d(0.92, 0.92, 1) !important; background-color: transparent !important; box-shadow: none !important; }

        /* 任务 4 (Round 44)：针对左侧模式下的侧边栏（.sidebar:not(.top-bar)），将文字、头像和 SVG 在内的所有元素轻微缩小一点点使视觉更和谐，顶部模式（.sidebar.top-bar）不做任何更改 */
        .sidebar:not(.top-bar) { width: 178px; padding: 10px 7px; }

        /* 任务 8 (Round 29) & 任务 1, 3 (Round 30)：全新顶部侧边栏 (.sidebar.top-bar) 设计方案 —— Apple 官方 tvOS 长连贯药丸胶囊造型，支持“始终显示”与“始终隐藏”两种方案，并在进入正式播放页面时自动隐藏 */

        /* 任务 11 & 13 (Round 10)：三条竖线随机升高降低动态波形 SVG 动画与卡片右上角波形徽标 */
        .wave-bars-svg .wave-bar {

        .main-content { position: absolute; top: 0; bottom: 0; z-index: 2; left: 74px; width: calc(100% - 74px); display: flex; flex-direction: column; justify-content: flex-end; padding: 40px 45px; box-sizing: border-box; transform: translateX(128px); transition: left 0.38s cubic-bezier(0.22, 1, 0.36, 1), width 0.38s cubic-bezier(0.22, 1, 0.36, 1), transform 0.34s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease; will-change: transform, left, width; overflow: hidden; }

        /* 任务 1 (Round 42) & 任务 9 (Round 43)：当焦点位于导航项（含开始页用户头像）时，标题与丸形菜单统一应用与卡片一致的微透明效果（0.48）；当焦点位于丸形菜单项或卡片时恢复不透明 */
        .main-content.content-dim-header-and-pills #heroText,

        /* 修复 1：小标题旁小 SVG 与文字精准垂直居中对齐 */
        .brand-title { font-size: 14px; font-weight: 400; letter-spacing: 1px; color: rgba(255,255,255,0.7); margin-bottom: 0; display: inline-flex; align-items: center; height: 20px; line-height: 20px; }

        .main-title { font-size: 42px; font-weight: 800; margin: 0 0 4px 0; letter-spacing: -0.5px; line-height: 1.15; max-width: 75%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        /* 任务 10 (Round 19)：采用双节点乒乓交替驻留跑马灯架构，当标题滚动回静止位 (0px) 时直接由当前可见节点驻留，仅在屏幕外重置隐藏节点，彻底消除归位闪烁 */

        .season-bar { display: none; gap: 10px; margin-bottom: 10px; align-items: center; z-index: 6; flex-wrap: wrap; transition: opacity 0.26s cubic-bezier(0.22, 1, 0.36, 1), transform 0.26s cubic-bezier(0.22, 1, 0.36, 1); }

        .season-pill { display: inline-flex; align-items: center; gap: 4px; padding: 6px 16px; border-radius: 999px; -apple-visual-effect: -apple-system-glass-material-clear; color-scheme: dark; background: transparent !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; border: none !important; box-shadow: none !important; color: rgba(255,255,255,0.86); font-size: 13px; font-weight: 600; cursor: pointer; outline: none; flex-shrink: 0; white-space: nowrap; overflow: hidden; transform: translateZ(0); transition: background-color 0.22s ease, color 0.22s ease, transform 0.24s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.24s ease; }

        /* 任务 6 (Round 41)：短视频刷新状态指示器支持三种不同状态：
           1) 正在刷新 (state-refreshing)：旋转箭头动画配合“正在刷新”字样；
           2) 正在搜索 (state-searching)：放大镜 SVG 忽明忽暗呼吸动画配合“正在搜索”字样；
           3) 完成 (state-completed)：指示器完全隐藏，不显示任何符号和文字。 */
        .stream-refresh-indicator {

        }
        .stream-refresh-indicator.state-completed,
        .stream-refresh-indicator:not(.loading-pill) {

        /* 任务 2 (Round 26) & 任务 6 (Round 41)：短视频刷新旋转动画与搜索放大镜忽明忽暗动画 */
        @keyframes spinRefreshIcon {

        .stream-refresh-indicator.spinning:not(.state-searching) svg {

        }
        .stream-refresh-indicator.state-searching svg,
        .stream-refresh-indicator.pulsing svg {

        .season-pill.pill-anim-expand { animation: pillExpandSpring 0.32s cubic-bezier(0.16, 1, 0.3, 1) both; }
        .season-pill.pill-anim-collapse { animation: pillCollapseSpring 0.28s cubic-bezier(0.16, 1, 0.3, 1) both; }
        @keyframes pillExpandSpring {

        .season-pill.focused, .season-pill:focus { -apple-visual-effect: none !important; background: #fff !important; color: #000 !important; border-color: #fff; transform: scale(1.06); box-shadow: 0 6px 16px rgba(0,0,0,0.35) !important; }

        .carousel-container { width: calc(100% + 90px); height: 240px; margin: -20px -45px; padding: 20px 45px; position: relative; box-sizing: border-box; overflow: hidden; -webkit-mask-image: linear-gradient(to right, transparent 0px, black 45px, black calc(100% - 45px), transparent 100%); mask-image: linear-gradient(to right, transparent 0px, black 45px, black calc(100% - 45px), transparent 100%); transition: width 0.38s cubic-bezier(0.22, 1, 0.36, 1), margin 0.38s cubic-bezier(0.22, 1, 0.36, 1), padding 0.38s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.28s ease; }
        /* 任务 10 (Round 26)：当侧边栏自动隐藏时，第一个卡片的左侧渐变遮罩同步从侧边栏边缘移至屏幕最左边缘 */

        }

        /* 任务 7 (Round 41)：当焦点位于某个媒体卡片时其余卡片增加轻微透明度；当焦点位于侧边栏导航项时给所有卡片赋予轻微透明度 */
        .media-item { display: flex; flex-direction: column; gap: 8px; width: 220px; flex-shrink: 0; outline: none; cursor: pointer; contain: layout style; transition: opacity 0.26s cubic-bezier(0.22, 1, 0.36, 1); }
        .carousel-track.track-has-card-focus .media-item:not(.focused):not(:focus),
        .carousel-track.track-dim-all-cards .media-item {

        }
        .carousel-track .media-item.focused,
        .carousel-track .media-item:focus {

        }
        .card-image-wrapper { width: 100%; height: 124px; border-radius: 14px; background-color: rgba(255,255,255,0.06); position: relative; overflow: hidden; box-sizing: border-box; clip-path: inset(0 round 14px); -webkit-clip-path: inset(0 round 14px); transition: transform 0.22s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.22s ease; transform: translateZ(0); }
        .card-image-wrapper::after { content: ''; position: absolute; inset: 0; border-radius: 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); pointer-events: none; z-index: 4; transition: box-shadow 0.22s ease; }
        .card-image-wrapper img { width: 100%; height: 100%; opacity: 0; transition: opacity 0.3s ease; display: block; border-radius: 14px; }
        /* 任务 10 (Round 18)：正在观看/现在观看卡片底部贴边白色线条展示大致观看进度 */
        .card-watch-progress-track { position: absolute; left: 0; right: 0; bottom: 0; height: 3.5px; background: rgba(255, 255, 255, 0.22); z-index: 6; pointer-events: none; overflow: hidden; }
        .card-watch-progress-fill { height: 100%; width: 0%; background: #ffffff; box-shadow: 0 0 6px rgba(255, 255, 255, 0.85); transition: width 0.2s ease; }

        .card-image-wrapper.refresh-card-wrapper { display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); }
        .card-image-wrapper.refresh-card-wrapper svg { width: 38px; height: 38px; fill: rgba(255, 255, 255, 0.75); transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1), fill 0.25s ease; }
        .media-item:focus .card-image-wrapper.refresh-card-wrapper:not(.search-card-wrapper) svg, .media-item.focused .card-image-wrapper.refresh-card-wrapper:not(.search-card-wrapper) svg { transform: rotate(180deg) scale(1.1); fill: #fff; }
        .card-image-wrapper.refresh-card-wrapper.spinning:not(.search-card-wrapper) svg { animation: spinRefreshIcon 0.72s linear infinite; fill: #fff; }
        /* 任务 6 (Round 41)：搜索时的临时补位卡片使用搜索专用的忽明忽暗放大镜符号 */
        @keyframes pulseSearchCardIcon {

        /* 任务 8 (Round 26)：“暂无视频内容”卡片参照流媒体刷新按钮卡片的设计样式，采用半透明毛玻璃中间加一个 + 符号 SVG */
        .card-image-wrapper.empty-card-wrapper { display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); }

        .card-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* 任务 5 (Round 26)：流媒体卡片下方的视频标题过长时允许滚动显示 */
        .card-title.single-line-marquee {

        .media-item:focus .card-info, .media-item.focused .card-info { opacity: 1; transform: translateY(0); }

        .glass-modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.72); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); z-index: 100; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.25s ease; }

        /* 任务 9 & 10 (Round 11) & 任务 5 (Round 15) & 任务 5 (Round 30) & 任务 9 (Round 41)：
           参照 Apple TV (tvOS) 深色设置页面升级设置页、电源选项页与密码页背景遮罩，并注入 8-Bit 防色带高频抖动噪声纹理层 (TPDF Dithering Noise) 与多阶平滑过渡渐变，彻底弱化 8-Bit 大屏色彩断层/色带现象 */
        /* 任务 10 (Round 44)：借鉴 Apple tvOS 原生全屏材质（UIBlurEffectStyleDark / CABackdropLayer 管线）：
           1) 采用超大半径高斯模糊 blur(118px) 将底层海报/视频高频细节彻底柔化为宏观明暗起伏；
           2) 采用极低饱和度 saturate(22%) 剥离底层五颜六色的杂乱色斑，仅保留底层画面的大致亮部（Highlights）与暗部（Shadows）明暗体积结构；
           3) 结合动态提取的亮部主色调（--tvos-highlight-tint）与暗部主色调（--tvos-shadow-tint）进行低饱和度双色调柔光映射（Luminance-Mapped Tinting），
              使全屏对话框（设置页、密码页、电源选项页、恢复出厂设置确认页、关机页）背景既干净纯粹，又能自然透出底层画面的明暗呼吸感与主色调。 */
        .fs-overlay-mask {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background:
                radial-gradient(130% 108% at var(--tvos-light-x, 30%) var(--tvos-light-y, 24%),
                    var(--tvos-highlight-tint, rgba(74, 92, 120, 0.24)) 0%,
                    var(--tvos-mid-tint, rgba(46, 58, 78, 0.14)) 42%,
                    rgba(18, 22, 30, 0.04) 76%,
                    rgba(0, 0, 0, 0) 100%),
                linear-gradient(165deg,
                    var(--tvos-surface-top, rgba(20, 23, 30, 0.56)) 0%,
                    var(--tvos-surface-mid, rgba(14, 17, 23, 0.62)) 52%,
                    var(--tvos-shadow-tint, rgba(9, 11, 16, 0.68)) 100%);
            backdrop-filter: blur(118px) saturate(22%) brightness(0.56) contrast(0.92);
            -webkit-backdrop-filter: blur(118px) saturate(22%) brightness(0.56) contrast(0.92);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
            z-index: 100;
            display: flex;
            visibility: hidden;
            pointer-events: none;
            opacity: 0;
            transition: background 0.38s ease, opacity 0.36s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.36s cubic-bezier(0.22, 1, 0.36, 1);
            overflow-y: auto;
            overflow-x: hidden;
            box-sizing: border-box;
        }
        .fs-overlay-mask::before {
            content: '';
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-image: var(--dither-noise-url, none);
            background-repeat: repeat;
            background-size: 128px 128px;
            opacity: 0.42;
            mix-blend-mode: overlay;
            pointer-events: none;
            z-index: 1;
        }
        .fs-overlay-mask::after {
            content: '';
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background-image: var(--dither-noise-url, none);
            background-repeat: repeat;
            background-size: 96px 96px;
            background-position: 37px 53px;
            opacity: 0.18;
            mix-blend-mode: soft-light;
            pointer-events: none;
            z-index: 1;
        }
        .fs-overlay-mask > * {
            position: relative;
            z-index: 2;
        }
        .fs-overlay-mask.active {
            visibility: visible;
            pointer-events: auto;
            opacity: 1;
        }
        /* 任务 12 (Round 26) & 任务 1 & 2 (Round 27)：当设置项较少时设置项与大标题整体垂直居中显示（height: auto + margin: auto auto auto 0）；当设置项较多超出视口时冻结顶部大标题，仅让下方选项列表滚动 */
        #settingsModal {

        .fs-settings-page {

        .fs-settings-page > .fs-page-header {

        .fs-settings-page .modal-actions {

        .fs-password-page {

            color: #fff;

        }
        /* 任务 4 (Round 17)：长按密码输入框唤出右侧大九键屏幕数字键盘，左侧原文字、密码框和按钮整体平滑左移 */
        .pwd-split-layout {
            display: flex;
            align-items: center;
            justify-content: center;

        /* 任务 1 & 12 (Round 26) & 任务 1 & 2 (Round 27)：多级全屏设置页面在选项较少时垂直居中、选项较多时冻结顶部大标题独立滚动列表；移除外层 overflow:hidden 并扩充左右内边距至 48px，彻底消除选中白色胶囊左侧被裁切的问题 */
        .settings-level-view {

        /* 任务 4 (Round 30)：优化设置列表滚动逻辑与动画，移除原生生硬的 scroll-behavior: smooth，改由保留动量的临界阻尼 rAF 滚动引擎驱动，并配合上下边缘柔化渐隐遮罩 */
        .settings-list-group {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: calc(100% + 96px);
            margin: -20px -48px 0 -48px;

        }
        .settings-list-group.has-scroll-bottom:not(.has-scroll-top) {
            -webkit-mask-image: linear-gradient(to bottom, black 0px, black calc(100% - 30px), transparent 100%);
            mask-image: linear-gradient(to bottom, black 0px, black calc(100% - 30px), transparent 100%);
        }
        .settings-list-group.has-scroll-top.has-scroll-bottom {
            -webkit-mask-image: linear-gradient(to bottom, transparent 0px, black 26px, black calc(100% - 30px), transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0px, black 26px, black calc(100% - 30px), transparent 100%);
        }
        /* 任务 1 (Round 26) & 任务 2 (Round 27) & 任务 4 (Round 30)：设置项选中样式平滑平移白色胶囊图形，采用更丝滑自然的 tvOS 弹簧阻尼曲线 */

        /* 任务 1 (Round 13)：密码输入颜色条两侧为渐变透明设计，填满瞬间（translate3d(0%,0,0)）两侧 0%~20% 与 80%~100% 渐变区完全处于可视范围（left:0~100%）外，随后从左向右消失 */
        .pwd-input-wrap {
            position: relative;
            width: 100%;
            height: 74px;
            border-radius: 20px;
            overflow: hidden;
            box-sizing: border-box;
        }
        .pwd-input-wrap .form-input {
            position: relative;
            z-index: 2;
            height: 74px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.08);
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .pwd-input-wrap .form-input:focus,
        .pwd-input-wrap .form-input.modal-focused {
            background: rgba(0, 0, 0, 0.48);
            transform: none;
        }
        .pwd-fill-bar {
            position: absolute;
            top: 0;
            bottom: 0;
            left: -36%;
            width: 172%;
            z-index: 3;
            pointer-events: none;
            transform: translate3d(-102%, 0, 0);
            opacity: 0;
            will-change: transform, opacity;
        }
        .pwd-fill-bar.fill-error {
            background: linear-gradient(
                90deg,
                rgba(255, 59, 48, 0) 0%,
                rgba(255, 59, 48, 0.28) 9%,
                rgba(255, 59, 48, 0.68) 20%,
                rgba(255, 59, 48, 0.68) 80%,
                rgba(255, 59, 48, 0.28) 91%,
                rgba(255, 59, 48, 0) 100%
            );
            animation: pwdSweepInAndOut 0.76s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .pwd-fill-bar.fill-success {
            background: linear-gradient(
                90deg,
                rgba(48, 209, 88, 0) 0%,
                rgba(48, 209, 88, 0.28) 9%,
                rgba(48, 209, 88, 0.68) 20%,
                rgba(48, 209, 88, 0.68) 80%,
                rgba(48, 209, 88, 0.28) 91%,
                rgba(48, 209, 88, 0) 100%
            );
            animation: pwdSweepInAndOut 0.76s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes pwdSweepInAndOut {
            0% {
                transform: translate3d(-102%, 0, 0);
                opacity: 1;
            }
            46% {

        function triggerStreamRefreshSpin(minMs, mode) {

        // 任务 2, 3, 6 (Round 33)：

        // 2) 每次刷新与加载更多均跨轮次去重，杜绝上一轮相同视频重复出现；
        // 3) 支持抖音与 bilibili 关键词搜索及搜索结果向后增量翻页加载。
        function syncStreamTrackFromBridgeOrBackend(reqCat, backendList) {
            if (!reqCat) reqCat = activeDouyinCategory;
            var catObj = getStreamCategoryObj(reqCat);
            var prevCache = DOUYIN_CATEGORY_CACHE[reqCat];
            var prevRawCount = prevCache ? (prevCache.rawCount || 0) : 0;
            var prevSig = prevCache ? (prevCache.contentSig || '') : '';
            var visibleQuota = (prevCache && prevCache.visibleQuota) ? prevCache.visibleQuota : STREAM_INITIAL_VISIBLE_COUNT;

            if (Array.isArray(backendList) && backendList.length > 0) {
                appendUniqueBridgeFeedItems(reqCat, backendList, false);
            }
            var mergedList = (bridgeFeedMap[reqCat] || []).slice(0, 300);
            if (mergedList.length === 0) return false;

            if (mergedList.length > visibleQuota && visibleQuota <= STREAM_INITIAL_VISIBLE_COUNT && prevRawCount === 0) {
                visibleQuota = Math.max(STREAM_INITIAL_VISIBLE_COUNT, Math.min(20, mergedList.length));
            }
            var cappedList = mergedList.slice(0, visibleQuota);
            var newSig = computeStreamListSig(cappedList);
            var isAppendOnly = Boolean(prevSig && newSig && newSig.indexOf(prevSig) === 0);
            var sigChanged = Boolean(newSig && newSig !== prevSig && !isAppendOnly);
            var nowMs = Date.now();
            var growthTs = (cappedList.length > prevRawCount || sigChanged || !prevCache || !prevCache.lastGrowthTs)
                ? nowMs
                : prevCache.lastGrowthTs;
            var settleMs = isBiliCategory(reqCat) ? 650 : DOUYIN_BATCH_SETTLE_MS;

        function cleanTextToSeriesTitle(str) {
            if (!str) return '';
            var s = str
                .replace(/^(?:\[.*?\]|【.*?】|\(.*?\))+/g, ' ')
                .replace(/(?:[._\-\s]+|^)(?:S\d{1,2}\s*E\d{1,3}|S\d{1,2}|EP?\s*\d{1,3}|第\s*[0-9一二三四五六七八九十百]+\s*[季集话期]).*$/i, '')
                .replace(/(?:[._\-\s]+)(?:1080p|720p|2160p|4K|UHD|HDR|HEVC|H264|H265|x264|x265|WEB-DL|BluRay|REMUX|AAC|DTS|RMVB|DIVX).*$/i, '')
                .replace(/\[.*?\]|\(.*?\)|【.*?】/g, ' ')
                .replace(/\b(19\d{2}|20\d{2})\b/g, ' ')
                .replace(/[._\-]+/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
            return s;
        }

        function isSeasonFolderName(name) {
            return /^(?:Season\s*\d+|S\d{1,2}|第\s*[0-9一二三四五六七八九十]+\s*季|Specials|SP)$/i.test(name.trim());
        }

        function deriveSeriesKey(mediaBasePath, fullPath, rawName) {
            var cleanBase = mediaBasePath.replace(/\/+$/, '');
            var rel = fullPath.indexOf(cleanBase) === 0 ? fullPath.substring(cleanBase.length).replace(/^\/+/, '') : '';
            var parts = rel ? rel.split('/') : [];

            if (parts.length >= 2) {
                var topFolder = parts[0];
                if (!isSeasonFolderName(topFolder)) {
                    var folderClean = cleanTextToSeriesTitle(topFolder);
                    if (folderClean) return folderClean;
                }
            }
            if (parts.length >= 2 && isSeasonFolderName(parts[0])) {
                var baseParts = cleanBase.split('/');
                var baseFolder = baseParts[baseParts.length - 1];
                var baseClean = cleanTextToSeriesTitle(baseFolder);
                if (baseClean) return baseClean;
            }

            var nameClean = cleanTextToSeriesTitle(rawName);
            if (!nameClean || /^\d+$/.test(nameClean)) {
                var bParts = cleanBase.split('/');
                return cleanTextToSeriesTitle(bParts[bParts.length - 1]) || rawName;
            }
            return nameClean;
        }

        function parseSeasonAndEp(fullPath, rawName, idx) {
            var season = 1, ep = idx + 1;
            var sMatch = rawName.match(/S(\d{1,2})/i) || rawName.match(/第\s*(\d+)\s*季/) || fullPath.match(/(?:Season|S)\s*(\d{1,2})/i) || fullPath.match(/第\s*(\d+)\s*季/);
            if (sMatch) season = parseInt(sMatch[1]) || 1;
            var eMatch = rawName.match(/E(\d{1,3})/i) || rawName.match(/EP(\d{1,3})/i) || rawName.match(/第\s*(\d+)\s*[集话期]/) || rawName.match(/(?:^|[._\-\s])(\d{1,3})(?:[._\-\s]|$)/);
            if (eMatch) ep = parseInt(eMatch[1]) || (idx + 1);
            return { season: season, ep: ep, label: '第 ' + ep + ' 集' };
        }

        function extractPornSubfolder(basePath, fullPath) {

            var rel = fullPath.indexOf(cleanBase) === 0 ? fullPath.substring(cleanBase.length).replace(/^\/+/, '') : fullPath;
            var parts = rel.split('/');

        function consolidateSameTitleSeriesForList(sourceList, isMovieMode) {

                var t = item.title;
                if (!isMovieMode && item.seriesKey && titleMap[t]) {
                    var primaryItem = titleMap[t];
                    var primaryKey = primaryItem.seriesKey;
                    var currKey = item.seriesKey;
                    if (primaryKey !== currKey && SERIES_GROUPS[currKey]) {
                        SERIES_GROUPS[primaryKey] = (SERIES_GROUPS[primaryKey] || []).concat(SERIES_GROUPS[currKey]);
                        SERIES_GROUPS[primaryKey].sort((a, b) => (a.season - b.season) || (a.ep - b.ep));
                        delete SERIES_GROUPS[currKey];
                    }
                } else {
                    if (item.seriesKey) titleMap[t] = item;
                    outList.push(item);
                }
            }
            for (var j = 0; j < outList.length; j++) {
                var it = outList[j];
                if (isMovieMode) {
                    var mCache = it.seriesKey ? localTmdbCache[it.seriesKey] : null;
                    if (mCache) {
                        it.sub = getSeriesScorePrefix(mCache) + ' · 电影';

                } else if (it.seriesKey && SERIES_GROUPS[it.seriesKey]) {

                    it.sub = scorePrefix + (totalEps > 1 ? (' · 共 ' + totalEps + ' 集') : '');
                }
            }
            return outList;
        }

        var thumbQueue = [];

        function scheduleThumbTasks(tasks, centerIndex) {
            var myToken = ++thumbBatchToken;
            if (thumbDelayTimer) { clearTimeout(thumbDelayTimer); thumbDelayTimer = null; }
            var startIdx = Math.max(0, (centerIndex || 0) - 1);
            var endIdx = Math.min(tasks.length, startIdx + 7);
            var windowed = [];
            for (var i = startIdx; i < endIdx; i++) {
                if (tasks[i] && tasks[i].path && !iptvFrameCache[tasks[i].path]) {
                    windowed.push(tasks[i]);
                }
            }
            thumbQueue = windowed;
            if (thumbQueue.length === 0) return;
            thumbDelayTimer = setTimeout(function() {
                processNextThumbTask(myToken);
            }, 1150);
        }

        function enqueueSingleThumbTask(path, imgId) {
            if (!path || !imgId) return;
            var exists = thumbQueue.some(t => t.path === path && t.imgId === imgId);
            if (!exists && thumbQueue.length < 8) {
                thumbQueue.push({ path: path, imgId: imgId });
                if (!thumbWorkerBusy && !thumbDelayTimer) {
                    var myToken = thumbBatchToken;
                    thumbDelayTimer = setTimeout(function() {
                        thumbDelayTimer = null;
                        processNextThumbTask(myToken);
                    }, 1150);
                }
            }
        }

        async function processNextThumbTask(token) {
            if (thumbWorkerBusy) return;
            thumbWorkerBusy = true;
            while (thumbQueue.length > 0) {
                if (token !== thumbBatchToken) break;
                var sinceMotion = Date.now() - lastUiMotionTime;
                if (sinceMotion < 950) {
                    await new Promise(r => setTimeout(r, 980 - sinceMotion));
                    if (token !== thumbBatchToken) break;
                }
                var task = thumbQueue.shift();
                if (!task || !task.path) continue;
                var imgEl = document.getElementById(task.imgId);
                if (!imgEl) continue;
                if (iptvFrameCache[task.path]) {
                    imgEl.src = iptvFrameCache[task.path];
                    fitSingleImage(imgEl);
                    continue;
                }
                try {
                    var thumbUrl = await invoke('extract_video_thumb', { path: task.path });
                    if (token !== thumbBatchToken) break;
                    if (thumbUrl) {
                        iptvFrameCache[task.path] = thumbUrl;
                        var targetImg = document.getElementById(task.imgId);
                        if (targetImg) {
                            targetImg.src = thumbUrl;
                            fitSingleImage(targetImg);
                        }
                    }
                } catch (_) {
                    var fallbackEl = document.getElementById(task.imgId);
                    if (fallbackEl && fallbackEl.src !== DEFAULT_LOCAL_CARD_SVG) {
                        fallbackEl.src = DEFAULT_LOCAL_CARD_SVG;
                        fallbackEl.style.opacity = '1';
                    }
                }
                await new Promise(r => setTimeout(r, 260));
            }
            thumbWorkerBusy = false;
        }

        function startPreviewStream(url) {

                var savedPreviewHist = findSavedWatchHistoryEntry(url);
                var previewResumeSec = (savedPreviewHist && savedPreviewHist.progressSec && savedPreviewHist.progressSec > 3 && (!savedPreviewHist.durationSec || savedPreviewHist.progressSec < savedPreviewHist.durationSec - 5))
                    ? savedPreviewHist.progressSec
                    : ((activePreviewMeta && activePreviewMeta.url === url && activePreviewMeta.progressSec > 3)

                    var p = invoke('start_ffmpeg', previewFfmpegArgs);
                    inFlightFfmpegReq = { url: url, seq: mySeq, promise: p, seekSec: previewResumeSec };

                        if (inFlightFfmpegReq && inFlightFfmpegReq.seq === mySeq) inFlightFfmpegReq = null;

                        if (allowRetryRefresh && mySeq === streamReqSeq && currentBgUrl === url && isCurrentStreamDouyin() && !isCurrentStreamBilibili()) {

        // 任务 3 (Round 41)：彻底排除“短视频社区”、“抖音”、“bilibili”等分类/来源占位词被误识别为作者名，
        // 确保从“正在播放/现在观看”历史记录进入短视频并开启“只看作者”时，后续加载出的作者作品在“正在播放/现在观看”中始终准确显示为“@XX作者 的视频”
        function isPlaceholderAuthorName(rawName) {
            var n = String(rawName || '').replace(/^@+/, '').trim();
            if (!n) return true;
            var lower = n.toLowerCase();
            if (lower === 'bilibili' || lower === 'bilibili推荐' || lower === 'bilibili热门') return true;
            var badList = [
                '短视频社区', '短视频', '流媒体', '抖音', '抖音精选', '抖音推荐',
                '热门内容', '精选视频', '作者视频', '创作者', '请稍候', '换一批视频',
                '正在播放与历史记录', '正在观看', '现在观看'
            ];
            for (var i = 0; i < badList.length; i++) {
                if (n === badList[i] || n.indexOf('短视频社区') === 0 || n.indexOf('来自 ') === 0) {
                    return true;
                }
            }
            return false;
        }

        function extractCleanAuthorName(subStr) {
            var s = String(subStr || '').trim();
            if (!s) return '';
            var parts = s.split('·');
            for (var i = 0; i < parts.length; i++) {
                var seg = (parts[i] || '').trim();
                if (seg.indexOf('@') === 0) seg = seg.substring(1).trim();
                if (seg && !isPlaceholderAuthorName(seg)) {
                    return seg;
                }
            }
            return '';
        }

        function resolveCurrentStreamAuthorName(explicitUrl) {

            if (targetUrl && typeof findSavedWatchHistoryEntry === 'function') {

            if (streamAuthorOnlyName && !isPlaceholderAuthorName(streamAuthorOnlyName)) {

            }
            for (var i = 0; i < candidates.length; i++) {

                if (clean && !isPlaceholderAuthorName(clean)) {

            for (var j = 0; j < authorItems.length; j++) {

        function handleSettingsModalDirectionKey(key) {
            var rows = getSettingsModalRows();
            if (!rows.length) return false;
            var activeEl = modalFocusList[modalFocusIdx] || rows[0][0];
            var curRowIdx = 0;
            var curColIdx = 0;
            for (var r = 0; r < rows.length; r++) {
                var c = rows[r].indexOf(activeEl);
                if (c !== -1) {
                    curRowIdx = r;
                    curColIdx = c;
                    break;
                }
            }

            if (key === 'ArrowDown' || key === 'ArrowUp') {
                var stepR = (key === 'ArrowDown') ? 1 : -1;
                var nextRowIdx = (curRowIdx + stepR + rows.length) % rows.length;
                var nextRow = rows[nextRowIdx];
                var targetEl = nextRow[Math.min(curColIdx, nextRow.length - 1)] || nextRow[0];
                var tIdx = modalFocusList.indexOf(targetEl);
                if (tIdx !== -1) {
                    playUiSound('move', key === 'ArrowDown' ? 'down' : 'up');
                    setModalFocus(tIdx);
                    if (settingsCurrentLevel === 1) settingsLastLevel1Idx = tIdx;
                    else if (settingsCurrentLevel === 2 && settingsActiveCategory) settingsLastLevel2IdxMap[settingsActiveCategory] = tIdx;
                }
                return true;
            }

            if (key === 'ArrowLeft' || key === 'ArrowRight') {
                var stepC = (key === 'ArrowRight') ? 1 : -1;
                if (settingsCurrentLevel === 3 && settingsActiveItemId === 'systemInfo') {
                    if (key === 'ArrowLeft') {
                        handleSettingsBackNavigation();
                    } else {
                        playUiSound('boundary');
                    }
                    return true;
                }
                if (settingsCurrentLevel === 2 && activeEl && activeEl.getAttribute('data-item-type') === 'status') {
                    stepNonFillableSetting(activeEl.getAttribute('data-item-id'), stepC);
                    return true;
                }
                if (settingsCurrentLevel === 2 && activeEl && activeEl.getAttribute('data-item-type') === 'fillable' && key === 'ArrowRight') {
                    playUiSound('select');
                    settingsLastLevel2IdxMap[settingsActiveCategory] = curRowIdx;
                    openSettingsLevel3(activeEl.getAttribute('data-item-id'));
                    return true;
                }
                if (settingsCurrentLevel === 2 && key === 'ArrowLeft') {
                    handleSettingsBackNavigation();
                    return true;
                }
                if (settingsCurrentLevel === 1 && activeEl && activeEl.classList.contains('settings-nav-row-btn') && key === 'ArrowRight') {
                    playUiSound('select');
                    settingsLastLevel1Idx = modalFocusIdx;
                    openSettingsLevel2(activeEl.getAttribute('data-settings-cat'));
                    return true;
                }
                var curRow = rows[curRowIdx];
                if (curRow && curRow.length > 1) {
                    var nextColIdx = curColIdx + stepC;
                    if (nextColIdx >= 0 && nextColIdx < curRow.length) {
                        var horizTarget = curRow[nextColIdx];
                        var hIdx = modalFocusList.indexOf(horizTarget);
                        if (hIdx !== -1) {
                            playUiSound('move', key === 'ArrowRight' ? 'right' : 'left');
                            setModalFocus(hIdx);
                        }
                    } else {
                        playUiSound('boundary');
                    }
                } else {
                    playUiSound('boundary');
                }
                return true;
            }
            return false;
        }

        function syncSidebarFocusPill(targetEl) {
            var pill = document.getElementById('sidebarFocusPill');
            var sidebar = document.getElementById('sidebar');
            if (!pill || !sidebar) return;
            var colAttr = targetEl ? parseInt(targetEl.getAttribute('data-col')) : -1;
            if (!targetEl || colAttr !== 0 || !sidebar.contains(targetEl)) {
                pill.classList.remove('visible', 'avatar-mode', 'pressing');
                return;
            }
            var x = 0;
            var y = 0;
            var cur = targetEl;
            while (cur && cur !== sidebar) {
                x += cur.offsetLeft || 0;
                y += cur.offsetTop || 0;
                cur = cur.offsetParent;
            }
            var w = targetEl.offsetWidth;
            var h = targetEl.offsetHeight;
            if ((!w || w <= 4 || !h || h <= 4) && !targetEl.__fcPillRetryScheduled) {
                targetEl.__fcPillRetryScheduled = true;
                requestAnimationFrame(function() {
                    targetEl.__fcPillRetryScheduled = false;
                    if (currentFocusEl === targetEl) {
                        syncSidebarFocusPill(targetEl);
                    }
                });
                return;
            }
            w = w || (isTopSidebarActive() ? 76 : (sidebar.clientWidth - 16));
            h = h || (isTopSidebarActive() ? 38 : 36);
            var isAvatar = (targetEl.id === 'avatarHeader');
            var wasVisible = pill.classList.contains('visible');
            if (!wasVisible) {
                pill.style.transition = 'none';
            }
            pill.style.width = w + 'px';
            pill.style.height = h + 'px';
            pill.style.setProperty('--pill-x', x + 'px');
            pill.style.setProperty('--pill-y', y + 'px');
            pill.classList.toggle('avatar-mode', isAvatar);
            if (isAvatar) {
                pill.style.transform = 'translate3d(' + x + 'px, ' + y + 'px, 0) scale3d(1.02, 1.02, 1)';
            } else {
                pill.style.transform = 'translate3d(' + x + 'px, ' + y + 'px, 0) scale3d(1.03, 1.03, 1)';
            }
            pill.classList.add('visible');
            if (!wasVisible) {
                void pill.offsetWidth;
                pill.style.transition = '';
            }
        }

        function refreshAvatarSmartHomeData(forceNow) {

            avatarHomeState.fetchingIndoor = true;

            fetch('http://127.0.0.1:8766/api/home_env?t=' + now, { cache: 'no-store' })
                .then(function(r) {
                    if (!r.ok) throw new Error('8766 unavailable');
                    return r.json();
                })
                .then(function(data) {
                    avatarHomeState.fetchingIndoor = false;
                    applyIndoorEnvPayload(data);
                })
                .catch(function() {
                    fetch('./home_env.json?t=' + now, { cache: 'no-store' })
                        .then(function(r1) {
                            if (!r1.ok) throw new Error('local home_env unavailable');
                            return r1.json();
                        })
                        .then(function(data1) {
                            avatarHomeState.fetchingIndoor = false;
                            applyIndoorEnvPayload(data1);
                        })
                        .catch(function() {

                                .then(function(r2) {

        function handlePasswordModalDirectionKey(key) {

            if (!pwdKeypadOpen) {
                var target = null;
                if (activeEl === inputEl) {
                    if (key === 'ArrowDown' || key === 'ArrowUp') target = cancelBtn;
                } else if (activeEl === cancelBtn) {
                    if (key === 'ArrowUp' || key === 'ArrowDown') target = inputEl;
                    else if (key === 'ArrowRight') target = (confirmBtn && !confirmBtn.disabled) ? confirmBtn : null;
                } else if (activeEl === confirmBtn) {
                    if (key === 'ArrowUp' || key === 'ArrowDown') target = inputEl;
                    else if (key === 'ArrowLeft') target = cancelBtn;
                }
                if (target) {
                    var tIdx = modalFocusList.indexOf(target);
                    if (tIdx !== -1) {
                        playUiSound('move', dirHint);
                        setModalFocus(tIdx);
                    }
                } else {
                    playUiSound('boundary');
                }
                return true;

            var findKeyAt = function(r, c) {
                if (r === 3 && (c === 0 || c === 1)) {
                    return document.querySelector('#pwdNumpadGrid .pwd-key-btn[data-krow="3"][data-kcol="0"]');
                }
                return document.querySelector('#pwdNumpadGrid .pwd-key-btn[data-krow="' + r + '"][data-kcol="' + c + '"]');
            };
            var focusTarget = null;

            if (activeEl === inputEl) {
                if (key === 'ArrowDown') focusTarget = cancelBtn;
                else if (key === 'ArrowUp') focusTarget = (confirmBtn && !confirmBtn.disabled) ? confirmBtn : cancelBtn;
                else if (key === 'ArrowRight') focusTarget = findKeyAt(0, 0);
            } else if (activeEl === cancelBtn) {
                if (key === 'ArrowUp') focusTarget = inputEl;
                else if (key === 'ArrowRight') focusTarget = (confirmBtn && !confirmBtn.disabled) ? confirmBtn : findKeyAt(2, 0);
            } else if (activeEl === confirmBtn) {
                if (key === 'ArrowUp') focusTarget = inputEl;
                else if (key === 'ArrowLeft') focusTarget = cancelBtn;
                else if (key === 'ArrowRight') focusTarget = findKeyAt(2, 0) || findKeyAt(0, 0);
            } else if (activeEl.classList.contains('pwd-key-btn')) {
                var kr = parseInt(activeEl.getAttribute('data-krow') || '0');
                var kc = parseInt(activeEl.getAttribute('data-kcol') || '0');
                if (key === 'ArrowRight') {
                    if (kr === 3 && kc === 0) focusTarget = findKeyAt(3, 2);
                    else if (kc < 2) focusTarget = findKeyAt(kr, kc + 1);
                } else if (key === 'ArrowLeft') {
                    if (kr === 3 && kc === 2) focusTarget = findKeyAt(3, 0);
                    else if (kc > 0) focusTarget = findKeyAt(kr, kc - 1);
                    else focusTarget = (kr >= 2) ? ((confirmBtn && !confirmBtn.disabled) ? confirmBtn : cancelBtn) : inputEl;
                } else if (key === 'ArrowDown') {
                    if (kr < 3) focusTarget = findKeyAt(kr + 1, kc);
                    else focusTarget = findKeyAt(0, kc);
                } else if (key === 'ArrowUp') {
                    if (kr > 0) focusTarget = findKeyAt(kr - 1, kc);
                    else focusTarget = findKeyAt(3, kc);
                }

            if (focusTarget) {
                var idx = modalFocusList.indexOf(focusTarget);
                if (idx !== -1) {
                    playUiSound('move', dirHint);
                    setModalFocus(idx);
                }
                return true;
            }
            playUiSound('boundary');
            return false;
        }

        // 任务 4 (Round 43)：

        var lastSysVolTriggerTs = 0;
        function triggerSystemVolumeStep(dir) {
            var now = Date.now();
            if (now - lastSysVolTriggerTs < 55) return;
            lastSysVolTriggerTs = now;
            fetch('http://127.0.0.1:8766/api/volume_step?dir=' + encodeURIComponent(dir) + '&t=' + now, { cache: 'no-store' }).catch(function() {});
        }

        function isUnrelatedOrSystemVolumeKey(e) {
            if (!e) return false;
            var k = String(e.key || '');
            var c = String(e.code || '');
            var kc = Number(e.keyCode || 0);
            if (k === 'F11' || c === 'F11' || kc === 122 || k === 'AudioVolumeDown' || c === 'AudioVolumeDown' || kc === 174) {
                triggerSystemVolumeStep('down');
                return true;
            }
            if (k === 'F12' || c === 'F12' || kc === 123 || k === 'AudioVolumeUp' || c === 'AudioVolumeUp' || kc === 175) {
                triggerSystemVolumeStep('up');
                return true;
            }
            if (k === 'F10' || c === 'F10' || kc === 109 || k === 'AudioVolumeMute' || c === 'AudioVolumeMute' || kc === 173) {
                triggerSystemVolumeStep('mute');
                return true;
            }
            if (e.metaKey || e.ctrlKey || e.altKey) {
                return true;
            }
            if (/^F([1-9]|1[0-5]|2[1-4])$/i.test(k) || /^F([1-9]|1[0-5]|2[1-4])$/i.test(c)) {
                return true;
            }
            if (k.indexOf('Media') === 0 || k.indexOf('Audio') === 0 || k.indexOf('Brightness') === 0) {
                return true;
            }

        }

        document.addEventListener('keydown', function(e) {

            if (e.key === 'F19' || e.code === 'F19' || e.keyCode === 130) {

                if (e.key === 'Escape' || e.code === 'Escape' || e.keyCode === 27) {

                        ch.epg_name = BUILTIN_EPG_NAME_MAP[ch.title];
                    }
                    var iconName = ch.icon_name || ch.title || '';
                    var cleanIconName = iconName.replace(/(HD|FHD|4K|1080p|720p)/ig, '').trim();
                    var rawLogoUrl = ch.img ? optimizeImageUrl(ch.img) : ('https://live.fanmingming.com/tv/' + encodeURIComponent(cleanIconName) + '.png');
                    if (rawLogoUrl && rawLogoUrl.indexOf('http') === 0) {
                        cacheRemoteImageLocal(rawLogoUrl, !!forceOverwriteCache);
                    }
                });
                ROW_DATA[2] = data.rows["2"];
                if (currentTrackRow === 2) {
                    currentTrackRow = -1;
                    renderTrack(2);
                    if (currentFocusEl) setFocus(currentFocusEl);
                }
            }
            currentSyncStatusText = isOnline
                ? ((syncTimeStr || '刚刚') + '（网络正常）')
                : ((syncTimeStr || '未知时间') + '（离线缓存 · 网络异常）');
            updateLevel2StatusTexts();
            var syncEl = document.getElementById('githubSyncStatusText');
            if (syncEl) {
                if (isOnline) {
                    syncEl.className = 'sync-status-time';
                    syncEl.innerText = currentSyncStatusText;
                } else {
                    syncEl.className = 'sync-status-time offline';
                    syncEl.innerText = currentSyncStatusText;
                }
            }
            scheduleSavePersistentMetadata();
        }

        function fetchGithubConfigOnline(forceOverwriteCache) {
            var cachedConfigStr = localStorage.getItem('fc_github_config_cache') || localStorage.getItem('fc_cached_github_config_v1');
            var cachedSyncTime = localStorage.getItem('fc_github_sync_time') || '未记录';
            return fetch(CONFIG_URL + "?t=" + new Date().getTime())
                .then(res => {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(data => {
                    var nowTimeStr = formatDateTimeNow();
                    var jsonStr = JSON.stringify(data);
                    localStorage.setItem('fc_github_config_cache', jsonStr);
                    localStorage.setItem('fc_cached_github_config_v1', jsonStr);
                    localStorage.setItem('fc_github_sync_time', nowTimeStr);
                    applyGithubConfigData(data, true, nowTimeStr, !!forceOverwriteCache);
                })
                .catch(e => {
                    currentSyncStatusText = cachedConfigStr ? (cachedSyncTime + '（离线缓存 · 网络异常）') : '无缓存（网络异常）';
                    updateLevel2StatusTexts();
                    var syncEl = document.getElementById('githubSyncStatusText');
                    if (syncEl) {
                        syncEl.className = 'sync-status-time offline';
                        syncEl.innerText = currentSyncStatusText;
                    }
                });
        }

        function initApp() {
            // 任务 11 (Round 26)：启动时加载磁盘持久化缓存的影视评分、介绍、TMDB Logo、封面图、IPTV 台标与用户头像映射
            loadPersistentMetadataFromDisk(function() {
                var savedAv = localStorage.getItem('cache_user_avatar');
                if (savedAv) {
                    var avEl = document.getElementById('uiAvatar');
                    if (avEl) avEl.src = resolveCachedImageUrl(savedAv);
                }
                scrapeCoolTvLibraries(false);
            });
            syncNowWatchingRowData(false);
            scrapeCoolTvLibraries(false);
            // 任务 3 (Round 37) & 任务 1 (Round 38) & 任务 2 (Round 39) & 任务 7 (Round 43)：
            // 开屏动画采用单一连续 1.62s GPU 关键帧时间轴（无静止死帧、无退场前重绘闪烁），整体时长严格控制在 1.62 秒（1~2 秒区间内），结束后立即丝滑进入主页并从 DOM 移除
            (function runFireTvBootSplash() {
                var splashEl = document.getElementById('appBootSplash');
                if (!splashEl) return;
                var dismissed = false;
                function forceHideSplashNow() {
                    if (dismissed) return;
                    dismissed = true;
                    try {
                        splashEl.classList.add('boot-hidden', 'hidden');
                        splashEl.style.opacity = '0';
                        splashEl.style.visibility = 'hidden';
                        splashEl.style.display = 'none';
                        if (splashEl.parentNode) {
                            splashEl.parentNode.removeChild(splashEl);
                        }
                    } catch (_) {}
                }
                splashEl.addEventListener('animationend', function(ev) {
                    if (ev && ev.animationName === 'fireTvSplashMaskTimeline') {
                        forceHideSplashNow();
                    }
                });
                setTimeout(function() {
                    if (appSettings && appSettings.uiSound) {
                        playUiSound('boot');
                    }
                }, 40);
                setTimeout(forceHideSplashNow, 1950);
            })();

            // 任务 1 (Round 10 & Round 17) & 任务 5 (Round 25) & 任务 1 (Round 37)：启动时拉取推荐流并预热双短视频引擎实例
            loadDouyinNativeFeed(false, false);
            invoke('get_douyin_feed', { refresh: false, loadMore: false, category: 'bili_rcmd' }).catch(function() {});
            if (!douyinPollTimer) {
                douyinPollTimer = setInterval(() => loadDouyinNativeFeed(false, false), 750);
            }

            // 1. 先读取本地缓存的 GitHub 配置以确保离线秒开
            var cachedConfigStr = localStorage.getItem('fc_github_config_cache') || localStorage.getItem('fc_cached_github_config_v1');
            var cachedSyncTime = localStorage.getItem('fc_github_sync_time') || '未记录';
            if (cachedConfigStr) {
                try {
                    applyGithubConfigData(JSON.parse(cachedConfigStr), false, cachedSyncTime, false);
                } catch (_) {}
            }

            // 2. 网络通畅时拉取最新 GitHub 配置并更新缓存与时间戳
            fetchGithubConfigOnline(false);

            // 3. 加载 EPG 节目单并定时更新
            refreshEpgFromBackend();
            setInterval(refreshEpgFromBackend, 5 * 60 * 1000);

            // 4. 任务 8 (Round 19) & 任务 11 (Round 41)：保留即时气象信息轮询，并在启动时预加载米家室内温湿度与空气质量
            setTimeout(() => refreshAvatarSmartHomeData(), 1200);
            setTimeout(() => pollWeatherBroadcast(), 3500);
            setInterval(() => pollWeatherBroadcast(), 2 * 60 * 1000);

            // 问题 8 (Round 22) & 任务 3 (Round 28) & 任务 4, 8 (Round 29) & 任务 3 (Round 30)：每次启动 APP 时，若开启“始终隐藏”（含左侧与顶部侧边栏）则先渲染“现在观看/正在观看”轨道并将焦点落在第一个卡片以保持侧边栏隐藏，其余模式焦点落在“现在观看/正在观看”侧边栏项；仅当存在播放历史时自动播放上次退出时最后播放的内容
            setTimeout(() => {
                if (appSettings.sidebarMode === 'alwayshide') {
                    sidebarForceHiddenByMenu = true;
                    lastRowColMap[7] = 1;
                    renderTrack(7);
                    var firstWatchEl = findTargetFocusable(7, 1) || document.getElementById('navNowPlayingItem');
                    if (firstWatchEl) setFocus(firstWatchEl);
                } else {
                    var initial = document.getElementById('navNowPlayingItem') || document.querySelector('.focusable[data-row="7"][data-col="0"]');
                    if (initial) setFocus(initial);
                }
            }, 100);
            setTimeout(() => document.body.classList.remove('preload'), 250);
        }

        initApp();
    </script>
</body>
</html>
